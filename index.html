                "Atributo básico": "• Material: Fase de perdas financeiras significativas, desemprego e queda brusca de status social, onde o consultor enfrenta dificuldades reais e precariedade de recursos para sua sobrevivência. A situação é crítica, podendo chegar à falência ou a dívidas impagáveis, resultado direto de uma gestão anterior egoísta e controladora que esgotou as fontes de lucro e afastou todas as oportunidades de crescimento e parcerias.<br>• Mental: Mentalmente, há um empobrecimento das intenções e uma comunicação confusa que produz apenas destruição e pessimismo ao redor do indivíduo. O consultor sente-se fraco, sem iniciativa e incapaz de encontrar soluções inteligentes para seus problemas, mergulhando em pensamentos de ansiedade e angústia que bloqueiam sua competência intelectual e o impedem de enxergar qualquer saída viável para a crise atual.<br>• Sentimental: Reflete uma profunda miséria afetiva e carência emocional, onde o casal vive uma crise severa marcada pela falta de gentileza e pelo desleixo mútuo. Existe uma sensação de abandono e solidão mesmo acompanhado, onde o caráter se deteriora e as atitudes tornam-se rudes ou lacônicas, resultando em relacionamentos problemáticos que podem levar à separação definitiva por falta de investimento emocional real.<br>• Espiritual: Momento de precariedade da fé e desesperança total, onde o indivíduo sente que todos, inclusive o plano divino, lhe viraram as costas. Há uma exaustão energética e falta de proteção espiritual, tornando o canal mediúnico suscetível a bloqueios e influências negativas que aumentam a sensação de desamparo e desalento, exigindo um recolhimento profundo para que a alma não se perca no pessimismo.",
                "Atributo diverso": "• Negativo: Indica o início da recuperação da confiança e a descoberta de que, mesmo na escassez, ainda restam recursos internos para reconstruir a vida com mais dignidade. Representa o fim do período de \"vacas magras\", onde o consultor começa a atrair ajuda externa e a demonstrar vontade de superar a negligência consigo mesmo, abandonando o papel de vítima para buscar novamente a prosperidade e a sorte.<br>• Obstáculo: Ocorre quando a autocomiseração e o bullying (sofrido ou praticado) tornam a convivência impossível, gerando um ambiente de trabalho ou familiar totalmente infértil e doentio. O excesso de foco na falta e no prejuízo paralisa a pessoa, que passa a agir de forma negligente com sua própria saúde e bem-estar, criando bloqueios mentais que impedem a aceitação de qualquer auxílio ou oportunidade.<br>• Orientação/conselho: O conselho é para que você recue imediatamente de situações desgastantes e pare de tentar forçar resultados em terrenos que agora se mostram totalmente inférteis. Afaste-se do caos, desista de lutar contra o que não pode ser mudado agora e não se comprometa com novos projetos enquanto não recuperar sua vitalidade básica, esperando pacientemente que esse ciclo de perdas se encerre."
            }},
            { name: "Seis de Ouros", type: "menor", number: "6", imgUrl: `${baseUrl}P06.jpg`, sections: {
                "Núcleo": "• Essência: Ajudar, receber, equilibrar, resgatar.<br>• Definição: Arcano kármico que representa a solução de prejuízos através da generosidade alheia e do exercício da humildade. Indica um momento em que o consulente recebe auxílio externo (financeiro, profissional ou emocional) de alguém mais experiente, sem necessidade de retribuição imediata, permitindo a superação de crises.<br>• Advertência: Cuidado com o orgulho ferido que pode levar à procrastinação de decisões importantes; aceitar a ajuda que lhe é oferecida não é uma \"esmola\", mas sim uma oportunidade didática para aprender a ser generoso no futuro e restabelecer o fluxo positivo em sua vida.",
                "Atributo básico": "• Material: Representa a solução de problemas financeiros através da ajuda inesperada de terceiros, como investidores, mecenas ou a obtenção de bolsas de estudo e financiamentos vantajosos. O consultor é resgatado por oportunidades externas, recebendo indicações de emprego ou apoio material que permitem a superação da crise, desde que ele tenha a humildade necessária para aceitar as ofertas e o apoio técnico oferecido.<br>• Mental: A mente está em um estado de recepção e aprendizado, buscando o conselho de especialistas, psicólogos ou tutores para organizar as ideias e os propósitos de vida. Há uma dependência saudável de informações externas e suporte intelectual para tomar decisões, onde o indivíduo reconhece que não é capaz de resolver tudo sozinho, abrindo-se para novos paradigmas e conhecimentos que trazem clareza.<br>• Sentimental: Indica uma fase de \"esmola de atenção\" ou carinho, onde o consulente espera passivamente que o outro venha preencher suas carências afetivas e necessidades de amor. Existe uma busca por apoio emocional e compreensão, onde o parceiro ou um amigo atua como um porto seguro, oferecendo bondade e generosidade simples que ajudam a curar feridas de relacionamentos passados e trazem conforto.<br>• Espiritual: O consultor é alvo de um resgate espiritual e amparo por parte de guias ou mentores que oferecem proteção e orientação gratuita através de tratamentos ou intuições. É um momento de superação pelo exercício da humildade mística, onde os propósitos espirituais encontram apoio e compreensão no plano astral, permitindo que a alma aprenda o valor da caridade absoluta e do serviço desinteressado.",
                "Atributo diverso": "• Negativo: Reflete a recusa orgulhosa de ajuda e o fechamento para oportunidades que poderiam salvar o consultor de uma situação difícil, prolongando o sofrimento desnecessariamente. Indica uma fase de egoísmo onde a pessoa não sabe nem dar e nem receber, mantendo-se em um estado de carência crônica por puro medo de parecer inferior ou dependente das outras pessoas ao seu redor.<br>• Obstáculo: Ocorre quando a passividade se torna excessiva e a pessoa fica sentada esperando que o mundo resolva todos os seus problemas sem fazer o mínimo esforço para mudar. A dependência de caridade ou de atenção alheia pode gerar uma paralisação kármica, onde o consulente procrastina decisões vitais por considerar que a ajuda recebida nunca é suficiente, agindo com uma ingratidão disfarçada de orgulho.<br>• Orientação/conselho: Tome uma decisão firme agora e aceite todas as oportunidades de ajuda e conselhos que cruzarem o seu caminho sem hesitar por causa do seu ego. Seja humilde para reconhecer suas limitações, não procrastine as resoluções necessárias e entenda que o trabalho em equipe é o único meio eficaz de se chegar aos resultados desejados e superar os obstáculos atuais."
            }},
            { name: "Sete de Ouros", type: "menor", number: "7", imgUrl: `${baseUrl}P07.jpg`, sections: {
                "Núcleo": "• Essência: Colher, aguardar, progredir, avaliar.<br>• Definição: Representa o florescimento de projetos e a colheita de lucros após um período de esforço continuado. É uma carta de progresso lento e sólido, onde o consultor avalia seus resultados com uma ambição saudável, sentindo-se seguro, mas mantendo a disciplina para que o crescimento continue duradouro.<br>• Advertência: Não permita que a insatisfação ou a pressa coloquem tudo a perder; embora você queira sempre mais, o sucesso alto exige paciência e prudência extrema, pois a precipitação agora pode tornar os lucros menores do que o potencial real que a situação oferece a longo prazo.",
                "Atributo básico": "• Material: Período de colheita de lucros e progresso financeiro sólido, onde o esforço passado é devidamente recompensado com prêmios, heranças ou novas oportunidades de parcerias lucrativas. O consultor sente-se seguro e estruturado em seu cenário profissional, dominando seu contexto de trabalho e alcançando uma independência financeira que permite planejar o futuro com serenidade, sabendo que a prosperidade é fruto de sua própria meritocracia.<br>• Mental: Mentalidade voltada para a análise criteriosa e avaliação constante dos próprios passos, buscando sempre o aprimoramento e a evolução das ideias já plantadas. Há uma ambição boa e um desejo de progredir, mas acompanhados de uma disciplina mental que evita decisões precipitadas, priorizando a estabilidade e o equilíbrio intelectual para lidar com os novos desafios e contestações que surgem no caminho.<br>• Sentimental: No campo afetivo, reflete uma relação que traz segurança e companheirismo, onde o parceiro demonstra amor e carinho de forma constante e equilibrada. O consulente sente-se amado e valorizado, embora possa nutrir uma leve insatisfação por querer sempre mais intensidade ou compromisso, exigindo maturidade para apreciar o crescimento lento e sólido que o vínculo amoroso está construindo dia após dia.<br>• Espiritual: Fase de florescimento espiritual e fortalecimento da fé através da paciência e da persistência nos rituais ou práticas devocionais. Há uma sensação de dever cumprido com o plano superior e a percepção de que a alma está amadurecendo e ganhando uma estrutura mais firme e resiliente, permitindo que o indivíduo desfrute de uma paz interior profunda e de uma conexão serena.",
                "Atributo diverso": "• Negativo: Indica a perda de lucros por pura impaciência ou a incapacidade de reconhecer o valor do que já foi conquistado, gerando um sentimento amargo de fracasso. Representa a falta de autonomia e a negligência com os investimentos feitos, onde o consultor abandona o projeto no momento em que ele começaria a dar frutos, resultando em estagnação financeira e na perda de boas notícias.<br>• Obstáculo: Ocorre pelo excesso de \"fominha\" e insatisfação crônica, onde a pessoa nunca está contente com os resultados obtidos, por maiores que sejam. Essa busca obsessiva por mais pode gerar um estresse físico e mental desnecessário, fazendo com que o consultor perca a serenidade e a alegria da colheita atual por estar excessivamente focado em um ideal de perfeição inalcançável no momento presente.<br>• Orientação/conselho: Tenha paciência e prudência extremas, pois agora é o momento de esperar e deixar que a natureza siga seu curso para que você colha os frutos plenos. Mantenha a determinação e a disciplina em seus planos originais, faça uma análise leal de sua situação atual e não se deixe levar pela pressa, pois a persistência será sua maior aliada para o sucesso."
            }},
            { name: "Oito de Ouros", type: "menor", number: "8", imgUrl: `${baseUrl}P08.jpg`, sections: {
                "Núcleo": "• Essência: Renascer, periciar, recomeçar, aprimorar.<br>• Definição: Arcano kármico que sinaliza um recomeço baseado na vasta experiência adquirida anteriormente. É a fase do refinamento técnico, da dedicação ao trabalho que dá prazer e da descoberta de potenciais latentes, onde o consultor age como um lapidador atento aos detalhes para garantir o sucesso futuro.<br>• Advertência: Cuidado com o perfeccionismo excessivo e o isolamento; embora o trabalho solitário e focado seja necessário para o aprimoramento, não ignore totalmente as novidades ao redor ou a possibilidade de atualizar seus conhecimentos para não ficar estagnado em modelos antigos que já não funcionam mais.",
                "Atributo básico": "• Material: Fase de recomeço profissional em um cenário de alta especialização, onde o consultor aplica toda a sua experiência em novos projetos que trazem refinamento e aprimoramento à carreira. É o momento da perícia técnica e do trabalho detalhista que gera prazer e segurança financeira, resultando em sucesso planejado e na descoberta de novos potenciais e capacidades que garantem a prosperidade através da destreza.<br>• Mental: Mentalidade focada no aprendizado autodidata e na busca constante por perfeição e novos conhecimentos práticos, agindo de forma prudente e consciente. O indivíduo dedica-se ao estudo minucioso e ao planejamento de um novo ciclo intelectual, sentindo-se confiante em suas habilidades para lapidar suas ideias e transformá-las em algo de valor superior, mantendo uma rotina de pensamentos produtivos e voltados ao crescimento.<br>• Sentimental: No amor, representa um renascimento da relação onde os parceiros decidem começar de novo com base na experiência do que já viveram juntos e no conhecimento mútuo. Há um desejo de renovar os votos e de aprimorar a convivência através de atitudes mais maduras e conscientes, buscando um novo cenário afetivo que seja mais sólido e gratificante para ambos os envolvidos.<br>• Espiritual: Período de refinamento espiritual e investimento em si mesmo, onde o consulente busca lapidar sua alma e seus dons de forma solitária e autodidata. É um momento de descoberta de capacidades místicas que estavam adormecidas, exigindo disciplina e foco para integrar esse conhecimento ao novo ciclo de vida, resultando em uma conexão mais profunda e consciente com o plano divino.",
                "Atributo diverso": "• Negativo: Indica a falta de dedicação e o descuido com os detalhes, resultando em trabalhos mal feitos e na perda de credibilidade profissional. Representa a recusa em aprender coisas novas ou em se reciclar, o que gera uma estagnação kármica onde o consultor se vê forçado a repetir ciclos de erro por pura negligência ou falta de foco em seus próprios potenciais de crescimento.<br>• Obstáculo: Ocorre pelo excesso de perfeccionismo e isolamento, onde a pessoa fica tão mergulhada nos detalhes que perde a visão do conjunto e a noção de tempo. A obsessão por fazer tudo sem ajuda de ninguém pode gerar um esgotamento mental e físico, transformando o trabalho que deveria dar prazer em uma obrigação solitária e pesada que impede a fluidez da vida social.<br>• Orientação/conselho: Inove e recicle seus conhecimentos através de cursos de atualização ou buscando informações sobre as novidades em sua área de atuação profissional. Retome projetos que estavam parados, renove seus compromissos afetivos com disposição e invista seriamente em si mesmo, utilizando toda a sua experiência para lapidar o seu futuro de maneira consciente e extremamente produtiva para seus interesses."
            }},
            { name: "Nove de Ouros", type: "menor", number: "9", imgUrl: `${baseUrl}P09.jpg`, sections: {
                "Núcleo": "• Essência: Fertilizar, desfrutar, estabilizar, realizar.<br>• Definição: Representa o ápice da satisfação material e a sensação de dever cumprido. É o momento de colher frutos duráveis, desfrutar do luxo, do bem-estar e da distinção social conquistada por mérito. Indica fertilidade total, autoconfiança e a garantia de sucesso a longo prazo em todos os níveis da vida.<br>• Advertência: Não se torne arrogante com suas conquistas ou perca a cautela necessária para manter sua estabilidade; embora o mar esteja cheio de peixes, a continuidade do sucesso depende do planejamento cuidadoso e da manutenção da sua autonomia e autoestima elevada diante dos desafios que ainda possam surgir.",
                "Atributo básico": "• Material: Fase de grande prosperidade e sucesso financeiro a longo prazo, marcada pela colheita de lucros generosos, promoções e evolução concreta na carreira. O consultor desfruta de estabilidade, segurança e requinte, sentindo-se orgulhoso de suas habilidades que resultaram em bens materiais duráveis e na multiplicação energética de seus recursos, permitindo inclusive a recuperação total de perdas que ocorreram em períodos passados.<br>• Mental: Mentalidade de autoconfiança absoluta e autoestima elevada, onde o indivíduo reconhece seu próprio valor e confia plenamente em sua capacidade de realização. Há um foco no planejamento de ideais elevados e na concretização de projetos ambiciosos, mantendo uma clareza intelectual que favorece o sucesso e a independência de pensamento, sentindo-se perfeitamente capaz de pescar as melhores oportunidades que o mercado oferece.<br>• Sentimental: No campo afetivo, indica uma fase de felicidade plena e bem-estar, onde o relacionamento é visto como um \"bom partido\" ou um negócio emocional seguro e duradouro. Existe uma harmonia fértil que pode indicar gravidez ou a concretização de planos familiares importantes, trazendo uma sensação de plenitude e satisfação que fortalece o vínculo amoroso e a distinção social do casal perante o mundo.<br>• Espiritual: Momento de profunda riqueza interior e fertilidade da alma, onde o consultor se sente em total equilíbrio e regozijo com sua evolução espiritual. É uma fase de colheita mística, onde a persistência no caminho da luz traz recompensas e uma sensação de proteção divina constante, permitindo que o indivíduo desfrute de sua paz interior com gratidão e uma autoestima espiritual revigorada.",
                "Atributo diverso": "• Negativo: Reflete a incapacidade de desfrutar das conquistas por excesso de preocupação ou pela perda de bens materiais devido à má gestão e falta de visão futura. Representa uma fase em que a independência se torna solidão e o orgulho transforma-se em esnobismo, afastando as oportunidades de felicidade real e gerando um vazio existencial mesmo em meio a uma aparente riqueza externa.<br>• Obstáculo: Ocorre pelo excesso de foco no luxo e na aparência social, tornando a pessoa fútil e desconectada das necessidades emocionais reais de si mesma e dos outros. A autoconfiança exagerada pode levar à imprudência ou ao isolamento em uma \"torre de marfim\", onde o consultor se sente tão superior que para de planejar o futuro, acreditando que sua sorte atual é eterna e imutável.<br>• Orientação/conselho: Invista em si mesma e reconheça seu verdadeiro valor pessoal, agindo com a cautela e a autonomia necessárias para proteger seu patrimônio e sua felicidade. Planeje seus projetos com foco no longo prazo, mostre seu trabalho e suas realizações ao mundo com orgulho justo e seja producente em suas escolhas, confiando sempre na sua competência para vencer qualquer desafio."
            }},
            { name: "Dez de Ouros", type: "menor", number: "10", imgUrl: `${baseUrl}P10.jpg`, sections: {
                "Núcleo": "• Essência: Perpetuar, herdar, consolidar, pertencer.<br>• Definição: Representa a realização máxima e concreta a longo prazo, envolvendo a família, o legado e a segurança geracional. É a carta da glória financeira, das heranças, das tradições e da rede de relacionamentos estáveis que garantem o fim dos problemas materiais e a perpetuação do sucesso para o futuro.<br>• Advertência: Não negligencie a convivência prazerosa com os seus em nome da mera administração de bens; a verdadeira riqueza desta carta reside na união harmoniosa e na valorização das raízes, evitando que o sucesso material se torne apenas uma obrigação pesada ou uma fonte de disputas familiares futuras.",
                "Atributo básico": "• Material: Fase de sucesso absoluto e realização financeira consolidada, marcada pelo recebimento de heranças, imóveis e bens materiais que garantem a segurança da família a longo prazo. O consultor demonstra alta competência e responsabilidade na administração de seus recursos e empresas, construindo um legado sólido que será deixado para as próximas gerações, desfrutando de uma rede de relacionamentos profissionais valiosa e muito fértil.<br>• Mental: Mentalidade focada na preservação das tradições, dos costumes e do conhecimento acumulado, agindo com uma estrutura de pensamento muito organizada e pragmática. Há uma valorização extrema da ancestralidade e da história familiar, onde o indivíduo busca perpetuar seu nome e seus valores através de projetos intelectuais, como livros ou ensinamentos, sentindo-se intelectualmente seguro e amparado por uma rede estável de convicções.<br>• Sentimental: No campo afetivo, indica uma união familiar concreta e estável, baseada na convivência prazerosa e na valorização mútua da relação e dos vínculos de parentesco. Pode representar a chegada de filhos, enteados ou a consolidação de um casamento através de documentos legais, onde a felicidade é construída sobre bases sólidas de lealdade e compromisso, trazendo uma profunda sensação de glória e paz doméstica.<br>• Espiritual: Momento de conexão profunda com a linhagem ancestral e com os dons hereditários da alma, sentindo-se parte de um plano espiritual maior e duradouro. Há um recebimento de bênçãos que vêm de gerações passadas, proporcionando uma proteção mística robusta e a compreensão de que a jornada espiritual é um legado contínuo que deve ser honrado com responsabilidade e gratidão plena pela existência.",
                "Atributo diverso": "• Negativo: Reflete a perda de heranças, disputas familiares por dinheiro e a quebra de tradições importantes que mantinham a coesão do grupo. Indica uma fase de má administração dos bens e irresponsabilidade com o futuro dos dependentes, resultando em problemas hereditários (sejam financeiros ou de saúde) e na sensação de que o sucesso alcançado anteriormente foi desperdiçado por negligência e falta de união.<br>• Obstáculo: Ocorre quando o peso das obrigações familiares e das tradições arcaicas sufoca a individualidade e a liberdade de escolha do consultor. O excesso de preocupação com o legado e com as aparências sociais pode criar uma convivência hipócrita, onde o valor material é colocado acima do afeto real, transformando a família em uma empresa fria e desprovida de qualquer calor emocional ou espontaneidade.<br>• Orientação/conselho: Confie em sua capacidade de gestão e invista alto em seus projetos de longo prazo, comprometendo-se seriamente com a resolução de qualquer pendência familiar ou financeira pendente. Tome decisões firmes, posicione-se com autoridade em seu meio social e cuide com zelo daquilo que lhe foi confiado, garantindo que suas ações hoje pavimentem um caminho de glória e segurança para o futuro."
            }},
            { name: "Pajem de Ouros", type: "menor", number: "Pajem", imgUrl: `${baseUrl}PC1P.jpg`, sections: {
                "Núcleo": "• Essência: Iniciar, investir, planejar, prometer.<br>• Definição: Representa o primeiro passo concreto em direção a um objetivo material, marcado pela honestidade, dedicação e pelo desejo de aprender. É o convite para oportunidades sólidas que ainda não possuem estrutura, mas que prometem sucesso futuro através do foco, da disciplina e da manutenção de propósitos iniciais fundamentais.<br>• Advertência: Não se deixe levar apenas pela glamourização do início; embora o cenário seja favorável e você saiba onde está pisando, o êxito duradouro exige que você saia da inércia das ideias e coloque a mão na massa de forma persistente, cumprindo cada promessa feita a si mesmo e aos outros.",
                "Atributo básico": "• Material: Fase de início profissional fundamentada em bases sólidas, onde o consultor recebe convites confiáveis e propostas vantajosas que favorecem novos investimentos financeiros. Há uma proatividade em ajudar livremente e um esforço prestativo para levar adiante os projetos, exigindo que se glamourize menos o status e se foque na execução prática de tarefas básicas que garantam a perspectiva de sucesso.<br>• Mental: Mentalidade observadora e focada na análise criteriosa de situações reais, buscando sempre a integridade e a boa memória para fundamentar suas ideias. O indivíduo expressa-se com atenção e honestidade, agindo de forma prestativa e bem-intencionada ao investigar novos conhecimentos técnicos, sentindo-se confortável em rotinas tradicionais que permitam o planejamento seguro de grandes avanços intelectuais e de projetos futuros.<br>• Sentimental: No campo afetivo, indica o nascimento de um interesse genuíno e honesto, marcado pela lealdade e por promessas que são cumpridas com fidelidade. Existe um frescor e uma disponibilidade para ajudar o parceiro, buscando construir um vínculo estável e prestativo, embora ainda precise evoluir em termos de estrutura emocional e maturidade para que a relação se torne um compromisso duradouro e sólido.<br>• Espiritual: Momento de plantio místico e fertilidade da alma, onde novas ideias e propósitos espirituais começam a germinar com integridade e concentração. Há uma abertura para receber orientações externas e um respeito a modelos tradicionais de fé, permitindo que o consulente inicie um ciclo de aprendizado espiritual que, embora básico, é fundamental para o seu desenvolvimento e para a materialização de dons.",
                "Atributo diverso": "• Negativo: Reflete a incapacidade de dar o primeiro passo ou a quebra de compromissos básicos por falta de foco e disciplina. Indica uma fase de estagnação onde as oportunidades concretas são ignoradas por preguiça ou por uma visão deturpada da realidade, resultando em projetos que morrem antes de nascer devido à negligência com as bases financeiras e com a honestidade necessária.<br>• Obstáculo: Ocorre pelo excesso de tradicionalismo e pela obsessão por rotinas imutáveis que impedem a adaptação às novas necessidades. A pessoa pode se tornar excessivamente tagarela ou focada em ostentar pequenas conquistas (\"enfeitar o pavão\") em vez de trabalhar seriamente, perdendo-se em solenidades e formalismos burocráticos que atrasam o progresso real e a solidez das suas realizações materiais e profissionais.<br>• Orientação/conselho: Dedique-se com honestidade e pragmatismo aos seus novos planos, cumpra rigorosamente o que prometeu e avalie cuidadosamente cada passo antes de investir seu tempo e recursos. Seja fiel aos seus propósitos, observe o terreno onde está pisando, mostre-se prestativo com os outros e invista em si mesmo com a certeza de que a persistência trará resultados concretos e vantajosos."
            }},
            { name: "Cavaleiro de Ouros", type: "menor", number: "Cavaleiro", imgUrl: `${baseUrl}PC2K.jpg`, sections: {
                "Núcleo": "• Essência: Perseverar, empenhar, dominar, cautelar.<br>• Definição: Representa o trabalhador incansável e pragmático que avança com lentidão, mas com total segurança e domínio de suas ações. É o arcano da resistência física, da burocracia eficiente e da manutenção cuidadosa de propriedades e conquistas, priorizando a robustez material acima de qualquer idealismo ou sentimentalismo.<br>• Advertência: Cuidado para não se tornar excessivamente teimoso ou focado apenas no sentido prático da vida a ponto de negligenciar seus afetos; o excesso de meticulosidade e a recusa em correr riscos podem tornar sua trajetória monótona e solitária, transformando a prudência em uma barreira que impede a fluidez emocional.",
                "Atributo básico": "• Material: Fase de progresso sólido e inabalável no trabalho, onde o consultor atua como uma formiguinha empenhada que não tem pressa para colher os frutos. Há um domínio total dos processos financeiros e uma burocracia organizada que garante a estabilidade econômica, resultando em propostas consistentes e no cumprimento rigoroso de promessas comerciais que visam objetivos a longo prazo e a segurança.<br>• Mental: Mentalidade metódica, lógica e racional, focada no planejamento detalhado de cada ação intelectual e na manutenção da ordem estabelecida. O indivíduo expressa-se com clareza e gentileza, mas de forma fria e técnica, agindo com um autocontrole absoluto que evita riscos desnecessários, priorizando a robustez das suas convicções acima de qualquer fantasia criativa ou abstração emocional improdutiva.<br>• Sentimental: No campo afetivo, reflete uma postura de posse e manutenção da relação baseada na segurança e na rotina estável, mas com pouca estrutura emocional profunda. Existe fidelidade e compromisso, porém o consultor demonstra afeto através de presentes e de garantias materiais, agindo com uma gentileza burocrática que pode ser interpretada como falta de calor ou desinteresse por parte do parceiro.<br>• Espiritual: Momento de estabilização espiritual e disciplina mística, onde a alma se dedica a práticas regulares que garantam o equilíbrio e a proteção do seu campo energético. Há uma perseverança nas crenças e um respeito a rituais pragmáticos que trazem segurança interior, permitindo que o consulente mantenha sua fé em dia através do esforço contínuo e da observação cuidadosa de suas obrigações.",
                "Atributo diverso": "• Negativo: Indica a estagnação total causada pela falta de movimento e pela recusa em investir em novas possibilidades, resultando em perdas por obsolescência. Representa uma fase de teimosia cega onde a pessoa se recusa a mudar métodos arcaicos, agindo com uma mesquinharia que impede o crescimento e transforma a cautela em uma paralisia financeira e profissional prejudicial aos interesses.<br>• Obstáculo: Ocorre pelo excesso de meticulosidade e pela mania de planejar cada detalhe até a exaustão, o que faz com que se perca o tempo da ação. A obsessão pela robustez material e pela segurança absoluta torna o indivíduo possessivo e defensivo demais, criando um ambiente tenso e monótono onde não há espaço para a criatividade, para o relaxamento ou para trocas genuínas.<br>• Orientação/conselho: Confie em sua capacidade de trabalho, persevere em seus objetivos com paciência e mantenha o foco na manutenção do que você já conquistou com tanto esforço. Seja prático em suas decisões, organize suas finanças com zelo, vá atrás do que deseja de forma estruturada e entenda que a segurança material agora exige que você seja cauteloso, prudente e incansável."
            }},
            { name: "Rainha de Ouros", type: "menor", number: "Rainha", imgUrl: `${baseUrl}PC3Q.jpg`, sections: {
                "Núcleo": "• Essência: Fertilizar, gerir, nutrir, estabilizar.<br>• Definição: Representa a autoridade feminina pragmática que domina seu território com inteligência analítica e autocontrole. É a mestra da prosperidade que só investe onde há garantia de sucesso, agindo como uma provedora generosa e calorosa que supre a vida dos seus com segurança, maturidade e dignidade absoluta.<br>• Advertência: Não confunda sua prudência com mesquinharia ou desinteresse pelos outros; embora sua necessidade de segurança seja vital, lembre-se de que a verdadeira fertilidade exige também uma abertura emocional para acolher o que não pode ser controlado por planilhas ou garantias financeiras imediatas e tangíveis.",
                "Atributo básico": "• Material: Fase de grande sucesso financeiro e estabilidade profissional, marcada por uma gestão certeira e por investimentos que rendem lucros duradouros por mérito pessoal. A consultora atua como uma mentora hábil que fertiliza tudo o que toca, garantindo a prosperidade do seu patrimônio através de atitudes proativas, responsáveis e pragmáticas que atraem o respeito e a admiração de todo o mercado.<br>• Mental: Mentalidade madura, realista e dotada de um discernimento afiado para separar o que é produtivo do que é fantasia inútil. A expressão é séria e discreta, revelando uma inteligência prática que valoriza o equilíbrio e a observação constante das circunstâncias, agindo com uma paciência inteligente que permite colher os frutos do conhecimento de forma digna, estável e perfeitamente estruturada.<br>• Sentimental: No campo afetivo, reflete uma relação sólida e leal, onde o amor é demonstrado através de ações concretas, presentes e suporte material constante. Existe um acolhimento caloroso e uma sensualidade tranquila, onde a parceira nutre o bem-estar do outro com generosidade, exigindo reciprocidade e segurança emocional para manter o investimento afetivo e a harmonia duradoura no lar.<br>• Espiritual: Momento de profunda conexão com a abundância divina e fertilização dos dons espirituais através da disciplina e da prática constante. A alma regozija-se de sua evolução e utiliza sua força mística para suprir e proteger seu entorno, vivenciando uma fé aterrada e madura que atrai bênçãos concretas e uma estabilidade interior que reflete a luz da sua integridade.",
                "Atributo diverso": "• Negativo: Indica a perda de oportunidades de crescimento por excesso de cautela ou por uma visão limitada que só enxerga o lucro imediato. Representa uma fase de fechamento emocional e mesquinharia disfarçada de prudência, onde a pessoa deixa de nutrir seus projetos e relacionamentos, resultando em uma aridez material e afetiva que compromete sua dignidade e seu sucesso futuro.<br>• Obstáculo: Ocorre quando a necessidade de controle e estabilidade torna a pessoa possessiva e intolerante a qualquer mudança ou risco necessário para evoluir. A busca obsessiva por garantias de sucesso pode paralisar as ações e transformar a generosidade em uma ferramenta de manipulação, criando um ambiente opressor onde a matéria é valorizada acima do afeto e da espontaneidade vital.<br>• Orientação/conselho: Mantenha sua posição com firmeza, seja cautelosa em seus investimentos e dedique-se com esforço e disposição para alimentar seus projetos de longo prazo com inteligência. Seja prática em suas escolhas, aja de forma responsável com seus recursos, acolha quem precisa de sua mentoria e entenda que sua dignidade e segurança dependem de uma gestão equilibrada e realista."
            }},
            { name: "Rei de Ouros", type: "menor", number: "Rei", imgUrl: `${baseUrl}PC4K.jpg`, sections: {
                "Núcleo": "• Essência: Prover, dominar, estabilizar, perseverar.<br>• Definição: Representa a autoridade máxima da realidade e da materialidade, caracterizada por alguém experiente que domina seu território com competência e pragmatismo. É o líder que conquistou seu status pelo mérito e pela perseverança, atuando como um provedor fiel e protetor que garante a durabilidade e o sucesso de tudo o que administra.<br>• Advertência: Cuidado para não se tornar excessivamente possessivo ou burocrático em sua liderança; embora sua base seja sólida e sua proteção seja valiosa, a falta de romantismo e a rigidez sistemática podem afastar as pessoas e transformar seu reinado em uma estrutura fria e desprovida de calor humano genuíno.",
                "Atributo básico": "• Material: Fase de sucesso absoluto e glória profissional conquistada através de décadas de experiência e dedicação ao trabalho. O consultor domina o mercado com know-how e habilidade, agindo como um negociador sagaz que protege seus lucros e garante a prosperidade da família e dos negócios, resultando em uma estabilidade financeira inabalável e em uma reputação de autoridade incontestável.<br>• Mental: Mentalidade sistemática, burocrática e voltada para o entendimento claro da realidade, sem espaço para idealismos ou distrações improdutivas. O indivíduo expressa-se com maturidade e autoconsistência, agindo com uma coragem pragmática que lhe permite superar qualquer obstáculo intelectual, focando na organização técnica de recursos e no domínio absoluto de informações que garantam a manutenção do seu status e poder.<br>• Sentimental: No campo afetivo, reflete um relacionamento estável, duradouro e protetor, onde o parceiro demonstra amor através de suporte material e segurança cotidiana. Existe lealdade e fidelidade, embora a expressão dos sentimentos seja pragmática e pouco romântica, manifestando-se em convites para jantares, presentes e no cuidado zeloso com o bem-estar físico e financeiro da pessoa amada.<br>• Espiritual: Momento de solidez mística e conexão com a força primordial da terra, onde a alma se sente em harmonia com as leis do universo. Há uma proteção espiritual robusta que vem através da prática disciplinada e do respeito às tradições, permitindo que o consulente utilize sua experiência mística para estabilizar sua vida e para liderar seu entorno com honra e responsabilidade.",
                "Atributo diverso": "• Negativo: Indica a perda de controle sobre o patrimônio por excesso de apego ou por uma postura autoritária que gera revoltas e desarmonia. Representa uma fase de estagnação kármica onde o consultor se torna escravo de suas posses, perdendo a flexibilidade para negociar e resultando em prejuízos financeiros e no afastamento de aliados valiosos por pura soberba e falta de visão.<br>• Obstáculo: Ocorre pelo excesso de possessividade e ciúme, que transforma a proteção em uma prisão para si mesmo e para os outros. A obsessão por marcar território e por manter o status a qualquer custo pode gerar um ambiente de tensão e desconfiança constante, onde a espontaneidade é sufocada pela burocracia e pela necessidade neurótica de controlar cada detalhe da vida alheia.<br>• Orientação/conselho: Confie em sua experiência e em sua competência para liderar, proteja o que você conquistou com coragem e tenha atitude para superar qualquer desafio material. Seja fiel aos seus compromissos, honre sua palavra, batalhe pelo seu progresso com paciência e entenda que sua autoridade é sustentada por bases sólidas de responsabilidade, trabalho duro e visão realista do mundo."
            }},
            { name: "Ás de Espadas", type: "menor", number: "As", imgUrl: `${baseUrl}S01.jpg`, sections: {
                "Núcleo": "• Essência: Cortar, decidir, clarear, agir.<br>• Definição: Representa o início de um processo racional intenso, marcado por uma ideia fixa e força de vontade inabalável. É o triunfo da inteligência e da lógica sobre a confusão, trazendo clareza mental e decisões objetivas que rompem obstáculos.<br>• Advertência: Cuidado com o radicalismo e a agressividade verbal; a busca implacável pela verdade ou pela razão pode ferir os outros e gerar conflitos mentais, ansiedades ou um estado de frieza emocional excessiva que isola o consulente.",
                "Atributo básico": "• Material: Fase de decisões objetivas e proatividade absoluta no trabalho e finanças. O consulente utiliza a inteligência estratégica e a esperteza para conquistar espaços, agindo com vigor e clareza para resolver problemas complexos. É um momento de potência para novos empreendimentos, onde a vontade genuína de vencer impulsiona o sucesso material.<br>• Mental: Mentalidade extremamente lúcida, focada na lógica e na racionalidade para analisar situações de forma compartimentada. O consulente possui uma ideia fixa de vitória, expressando-se com eloquência e juízo firme. Há uma grande capacidade intelectual de articulação, embora possa haver tendência à ansiedade e preocupação excessiva com detalhes.<br>• Sentimental: Sentimentos intensos que variam entre o amor profundo e o ódio visceral, dependendo da clareza da situação. Há uma busca por transparência total na relação, o que pode gerar conflitos se o parceiro não for igualmente direto. A relação é pautada pela verdade, mas pode faltar suavidade emocional.<br>• Espiritual: Período de grande potência espiritual e clareza de propósito, onde a vontade do indivíduo se alinha com uma força vigorosa. Contudo, existe o risco de excesso de racionalização da fé, o que pode gerar bloqueios ou ansiedade espiritual se não houver um equilíbrio com a intuição e a entrega.",
                "Atributo diverso": "• Negativo: Reflete a confusão mental absoluta e a incapacidade de tomar qualquer decisão lógica, resultando em paralisia e perda de oportunidades por covardia. A palavra é usada para destruir ou enganar, e a falta de clareza gera decisões desastrosas que aumentam o caos em vez de resolvê-lo.<br>• Obstáculo: Ocorre pelo excesso de intelectualismo e pela necessidade obsessiva de ter sempre a razão. O consulente torna-se frio, insensível e excessivamente crítico, usando sua inteligência como arma para subjugar os outros. O excesso de análise impede a ação espontânea, criando uma \"ideia fixa\" que se torna uma prisão mental.<br>• Orientação/conselho: Analise a situação com frieza e compartimente seus problemas para resolvê-los um a um com inteligência. Tenha atitude proativa, bote sua vontade genuína em primeiro lugar e avance com coragem para conquistar o que deseja através da força, da lógica e da articulação clara de suas ideias."
            }},
            { name: "Dois de Espadas", type: "menor", number: "2", imgUrl: `${baseUrl}S02.jpg`, sections: {
                "Núcleo": "• Essência: Opor, teimar, bloquear, resistir.<br>• Definição: Momento de conflito tenso e empates onde ambos os lados se recusam a ceder por puro orgulho ou vaidade. Representa uma \"cegueira\" voluntária, onde o consulente levanta as armas e se recusa a enxergar a realidade óbvia para não dar razão ao outro.<br>• Advertência: Pare de lutar apenas para provar que está certo; essa teimosia obtusa impede a solução real do problema e gera um desgaste emocional que pode levar a crises de pânico ou rupturas definitivas e desnecessárias.",
                "Atributo básico": "• Material: No ambiente profissional, indica um cabo de guerra improdutivo onde ninguém entra em acordo, resultando em estagnação e prejuízos que podem se tornar irreversíveis. O foco está na disputa e não na solução, criando obstáculos intransponíveis porque o consulente prioriza a soberba em vez do resultado prático.<br>• Mental: Estado mental de dualidade e discórdia, marcado pela recusa em encarar fatos que contrariem as próprias convicções. O consulente está com a \"venda nos olhos\", sofrendo de alta ansiedade e estresse por manter os braços cruzados diante do diálogo, preferindo a ignorância protetiva à aceitação da verdade.<br>• Sentimental: Reflete um relacionamento em crise devido à rivalidade e à falta de entrega. Existe uma tensão constante onde \"querer ter razão\" é mais importante do que manter o namoro. A pessoa recusa-se à reconciliação e ao diálogo, mantendo-se na defensiva e criando um clima de isolamento afetivo.<br>• Espiritual: Bloqueio no desenvolvimento espiritual devido ao ego inflado e à resistência em aceitar ensinamentos que desafiem o orgulho pessoal. É um momento de cegueira mística, onde o indivíduo se sente em oposição ao fluxo divino por não querer baixar as armas e silenciar a mente teimosa.",
                "Atributo diverso": "• Negativo: Representa a queda das vendas e a aceitação dolorosa de que a teimosia causou danos irreparáveis. Indica um momento em que a pessoa é forçada a ver o que ignorou, sentindo a humilhação de ter perdido a batalha por não saber negociar, resultando em uma derrota moral profunda e solitária.<br>• Obstáculo: O excesso de oposição e o hábito de discordar de tudo por sistema criam um isolamento total do consulente. A pessoa torna-se tão obtusa que afasta aliados e oportunidades, ficando presa em um conflito eterno com o mundo apenas para sustentar uma imagem de força que, na verdade, é fragilidade.<br>• Orientação/conselho: Tenha coragem para pausar a luta e não ouça as vozes externas que alimentam seu orgulho agora. Reflita se vale a pena ter razão e perder tudo o mais; às vezes, a melhor estratégia é radicalizar no silêncio e procrastinar a briga para evitar um desastre maior."
            }},
            { name: "Três de Espadas", type: "menor", number: "3", imgUrl: `${baseUrl}S03.jpg`, sections: {
                "Núcleo": "• Essência: Sofrer, decepcionar, romper, clarear.<br>• Definição: Representa uma dor aguda causada por uma decepção ou traição que o consulente, no fundo, já sabia que aconteceria. É o momento do coração partido e das lágrimas, onde uma descoberta dolorosa ou uma palavra não cumprida força um rompimento inevitável, deixando marcas de mágoa e tristeza profunda.<br>• Advertência: Pare de se culpar ou de alimentar a pena de si mesmo; embora a dor seja real e o outro tenha sido \"malvado\", reconheça que parte do sofrimento vem de sua própria negligência em não ter tirado a venda dos olhos anteriormente. Aceite o luto para poder, eventualmente, mudar de foco.",
                "Atributo básico": "• Material: Fase de fracasso profissional e perdas financeiras dolorosas, frequentemente causadas por traições contratuais ou promessas de promoção que nunca se concretizam. O ambiente de trabalho torna-se insuportável devido a brigas e desonestidade de terceiros, resultando em prejuízos que não podem ser recuperados e em uma crise criativa profunda provocada pelo choque da realidade e pela quebra de confiança nos parceiros de negócios.<br>• Mental: Mentalidade mergulhada em confusão, pesar e pensamentos melancólicos que giram em torno da dor da decepção sofrida. Há uma incapacidade momentânea de raciocinar com clareza devido à mágoa intensa, onde o indivíduo se sente ferido por sua própria negligência em não ter agido antes, alimentando um conflito interno entre a razão que \"já sabia\" do erro e a emoção que agora padece.<br>• Sentimental: Reflete a clássica \"sofrência\" amorosa, com muitas lágrimas, tristeza e um sentimento devastador de abandono e traição afetiva. A relação sofre um rompimento brusco por incompatibilidade ou descoberta de mentiras, gerando feridas emocionais profundas que o consultor permitiu ao se recusar a enxergar a verdade no passado, resultando em uma amargura que impede qualquer reconciliação imediata ou perdão fácil.<br>• Espiritual: Momento de profunda dor espiritual e crise de fé, onde a alma se sente \"esfaqueada\" pelas circunstâncias adversas da vida. Há um bloqueio energético causado pela mágoa e pelo pesar, exigindo um processo doloroso de limpeza das ilusões perdidas para que o consulente possa, futuramente, reconstruir sua base mística sem os resquícios da dor que agora o paralisa e o afasta da luz.",
                "Atributo diverso": "• Negativo: Indica o início da cicatrização das feridas e a superação da fase aguda de sofrimento, onde as lágrimas começam a secar e a razão retoma o controle. Representa a possibilidade de cura através da aceitação da verdade, permitindo que a pessoa pare de se torturar pelo que já passou e comece a vislumbrar um futuro onde a decepção se transforma em um aprendizado valioso.<br>• Obstáculo: Ocorre quando o consulente se entrega totalmente ao vitimismo e à pena de si mesmo, recusando-se a sair do cenário de dor para continuar ganhando atenção através do seu sofrimento. O excesso de mágoa petrifica a alma, impedindo qualquer movimento de renovação e fazendo com que a pessoa insista em situações que só trarão mais ferimentos físicos e emocionais, sabotando sua própria recuperação.<br>• Orientação/conselho: Aceite a ruptura como algo necessário para sua evolução e mude imediatamente o foco de seus pensamentos e planos primários para evitar mais desgaste. Renuncie ao que não tem mais conserto, mude seu comportamento diante das adversidades e resolva todas as pendências que ainda o prendem a esse cenário de dor, entendendo que o próximo passo exige que você pare e se recupere."
            }},
            { name: "Quatro de Espadas", type: "menor", number: "4", imgUrl: `${baseUrl}S04.jpg`, sections: {
                "Núcleo": "• Essência: Pausar, curar, suspender, silenciar.<br>• Definição: Indica uma suspensão involuntária ou forçada por tempo indefinido para que ocorra a recuperação das energias mentais e físicas após uma batalha exaustiva. É o momento de repouso, de retirada estratégica para um \"hospital da alma\", onde nada funciona e nada acontece para que o indivíduo possa refletir e se reequipar.<br>• Advertência: Não tente lutar contra essa paralisia; essa suspensão é um sinal divino de que você estava agindo de forma equivocada e agora precisa de silêncio absoluto e ajuda profissional (psicólogo/psiquiatra) para evitar um colapso permanente ou a morte de seus propósitos mais caros.",
                "Atributo básico": "• Material: Fase de interrupção total das atividades profissionais e financeiras, onde nada anda e todos os investimentos parecem paralisados por forças externas fora do seu controle. Pode representar afastamentos médicos, desemprego prolongado ou a necessidade de fechar negócios temporariamente para evitar um prejuízo maior, exigindo que o consultor aceite a inatividade forçada como uma forma de reequipar sua inteligência estratégica antes de voltar à ativa.<br>• Mental: Estado mental de esgotamento profundo e mudez, onde não há mais estofo emocional para ter ideias ou tomar atitudes. A mente precisa de um refúgio do caos e de uma pausa para curar as feridas intelectuais do passado, exigindo frequentemente ajuda de terapeutas ou médicos para tratar o estado anestesiado e a falta de foco que impedem qualquer raciocínio lógico produtivo no momento.<br>• Sentimental: No campo afetivo, indica um \"dar um tempo\" ou uma solidão necessária após uma guerra emocional devastadora que drenou todas as energias do casal. A relação entra em coma ou suspensão indefinida, onde não há diálogo nem ação, forçando um afastamento para que cada um possa refletir sobre sua felicidade real longe do cenário de dor, evitando que continuem se ferindo em uma luta sem armas.<br>• Espiritual: Período de suspensão divina e isolamento místico, onde o indivíduo é \"colocado de castigo\" pelo universo para que pare de cometer erros graves. Há um silêncio absoluto nas respostas espirituais, funcionando como uma quarentena da alma que impede a conexão com o plano astral para garantir que a pessoa descanse e recupere sua clareza de propósito através do recolhimento e da oração silenciosa.",
                "Atributo diverso": "• Negativo: Reflete o retorno gradual à atividade e o fim da paralisia, onde o indivíduo começa a sentir o despertar das forças mentais e físicas para voltar ao mundo. Indica o momento em que a suspensão termina e a pessoa, agora recuperada e com uma visão mais saudável da realidade, decide sair do seu isolamento para retomar seus projetos, mas de forma muito mais consciente e equilibrada.<br>• Obstáculo: Ocorre quando o repouso se transforma em estagnação crônica ou covardia, onde a pessoa usa a \"pausa\" como desculpa eterna para não enfrentar as responsabilidades da vida. A imobilidade física e mental pode se tornar uma prisão, onde o consultor se acostuma com o estado anestesiado e recusa-se a voltar para a arena, perdendo o tempo de agir e deixando que a vida passe sem sua participação ativa.<br>• Orientação/conselho: Aceite o adiamento e o silêncio como ferramentas de cura necessárias para sua sobrevivência emocional e física no momento. Pare tudo o que está fazendo, não invista energia em nada novo, afaste-se do barulho do mundo, descanse profundamente e busque se recuperar com calma, entendendo que sentar e esperar a tempestade passar é a decisão mais inteligente que você pode tomar agora."
            }},
            { name: "Cinco de Espadas", type: "menor", number: "5", imgUrl: `${baseUrl}S05.jpg`, sections: {
                "Núcleo": "• Essência: Humilhar, vingar, teimar, degradar.<br>• Definição: Considerada a pior carta do baralho, representa uma vitória sem glória conquistada através de métodos injustos, agressivos ou imorais. É o momento do mico e da humilhação causada por si mesmo, onde o consulente usa sua inteligência para pisar nos outros, mas acaba com o nariz no chão por sua própria falta de ética e dignidade.<br>• Advertência: Renuncie imediatamente a essa sede de vingança e à necessidade de ter razão a qualquer preço; as atitudes indignas e o radicalismo só levarão a uma derrota moral irreversível e a ferimentos graves que deixarão marcas profundas em sua reputação e em sua saúde física e mental.",
                "Atributo básico": "• Material: Fase de conquistas profissionais através de chantagens, golpes ou meios ilegais que logo serão desmascarados e resultarão em vergonha pública. O ambiente de trabalho é marcado por uma competitividade violenta e injusta, onde o consultor pode até \"ganhar\" um cargo ou contrato, mas o faz de maneira degradante, perdendo o respeito de todos e garantindo um fracasso futuro inevitável por falta de base moral sólida.<br>• Mental: Mentalidade obsediada pela ideia de revidar ofensas passadas, agindo com um radicalismo e uma teimosia cegos que ignoram qualquer consequência negativa. O indivíduo sente-se desvalorizado e injustiçado, mas sua reação é desproporcional e injusta, focando toda sua capacidade intelectual em destruir o oponente em vez de construir algo útil, resultando em um estado mental perverso, ansioso e totalmente desconectado da sabedoria.<br>• Sentimental: Reflete um relacionamento abusivo e humilhante, onde um dos parceiros tenta ficar por cima através de regras degradantes e falta de respeito mútuo. Há uma sede por vencer discussões que aniquila o amor, onde o consulente pode até implorar afeto ou aceitar situações indignas apenas para manter a posse do outro, vivendo uma crise crônica marcada por agressividade verbal e sentimentos de desmerecimento total.<br>• Espiritual: Momento de degradação espiritual profunda, onde o indivíduo utiliza suas forças e conhecimentos para prejudicar o próximo ou para obter vantagens egoístas através de práticas obscuras. Há um afastamento total da luz e da ética divina, resultando em um carma pesado de \"vitória sem honra\" que atrai energias de violência e discórdia, exigindo uma rendição total do ego para evitar a queda espiritual definitiva.",
                "Atributo diverso": "• Negativo: Indica a possibilidade de interromper o ciclo de vingança antes que o dano seja total, através de um lampejo de consciência sobre a própria indignidade. Representa o momento em que a pessoa decide abaixar as armas e aceitar a derrota com o que lhe resta de honra, evitando pagar micos ainda maiores e buscando um caminho de reparação moral que, embora doloroso, é o único que permite a paz futura.<br>• Obstáculo: Ocorre pelo excesso de agressividade e ganância por poder, que faz o consulente perder totalmente a noção de limites sociais e éticos. A teimosia em repetir erros do passado e a obsessão por pisar nos outros criam um isolamento hostil, onde a pessoa se torna vítima de sua própria maldade, ficando presa em uma guerra inútil que consome todas as suas energias vitais e recursos financeiros.<br>• Orientação/conselho: Renuncie imediatamente aos seus planos de vingança, abdique da necessidade de ter a última palavra e desista de lutar nesta guerra onde não haverá vencedores reais. Se renda aos fatos, pare de tomar atitudes humilhantes que só destroem sua imagem, afaste-se dos conflitos agressivos e entenda que o silêncio e a retirada são as únicas formas de preservar o pouco que ainda resta de sua dignidade."
            }},
            { name: "Seis de Espadas", type: "menor", number: "6", imgUrl: `${baseUrl}S06.jpg`, sections: {
                "Núcleo": "• Essência: Fugir, abandonar, partir, transitar.<br>• Definição: Representa uma fuga necessária de um cenário insuportável de dor ou humilhação para o desconhecido. É a retirada estratégica onde o problema não é resolvido, mas o consulente se afasta por impotência e instinto de sobrevivência, buscando águas mais calmas enquanto carrega o peso do inconformismo e da tristeza.<br>• Advertência: Cuidado com o descuido de si mesmo e com a falta de rumo durante essa travessia; embora partir seja a única solução, o caminho para o desconhecido é perigoso e exige atenção redobrada com a saúde mental e espiritual para que a fuga não se transforme em uma queda definitiva em vícios ou autodestruição.",
                "Atributo básico": "• Material: Movimento de mudança profissional impulsionado por uma situação insuportável, como um pedido de demissão sem ter outro emprego garantido apenas para escapar do caos. O consultor abandona projetos e compromissos por pura impotência, buscando um novo cenário econômico com muita incerteza e medo, sentindo que não há mais como salvar nada na posição atual e que a única saída é partir para o desconhecido com o pouco que lhe restou.<br>• Mental: Mentalidade marcada pela ansiedade, nervosismo e um profundo inconformismo com o fracasso dos planos anteriores. O indivíduo sente-se mentalmente exausto e inseguro, navegando em direção a novas ideias sem um planejamento concreto, agindo por puro instinto de fuga para evitar o sofrimento, o que pode gerar um estado de desleixo intelectual e falta de fé em suas próprias convicções e capacidades de raciocínio.<br>• Sentimental: Reflete o abandono de um relacionamento que se tornou uma fonte de sofrimento intolerável, onde a pessoa parte com o coração oprimido e sufocado pela mágoa. Não há reconciliação possível, apenas o distanciamento físico e emocional como forma de sobreviver, enfrentando um luto difícil pelas perdas do passado e o medo de nunca mais encontrar estabilidade ou felicidade em um novo vínculo afetivo.<br>• Espiritual: Este é o pior arcano para a espiritualidade, indicando que o consulente está abrindo um portal para o desconhecido sem proteção, atraindo ataques de obsessores. Há uma perda de fé nas figuras de autoridade e na religião, onde a alma se larga ao léu por puro desespero, correndo o risco de se perder em energias de afogamento emocional ou vícios como forma de fuga da realidade espiritual degradante.",
                "Atributo diverso": "• Negativo: Indica a superação do medo de transitar e o início de uma jornada mais consciente em direção à cura, onde o indivíduo começa a enxergar as águas calmas no horizonte. Representa o momento em que a fuga se transforma em uma viagem de lazer ou em um descanso merecido (férias), permitindo que a pessoa recupere seu equilíbrio interno e sua esperança de que o futuro trará soluções que o passado negou.<br>• Obstáculo: Ocorre quando o hábito de fugir dos problemas torna-se a única resposta do consulente para qualquer dificuldade, impedindo o enfrentamento e a resolução real dos conflitos. O excesso de insegurança e a falta de rumo podem levar a comportamentos autodestrutivos e ao abandono total de tratamentos de saúde ou cuidados básicos, deixando a pessoa vulnerável a infecções, acidentes e contaminações por negligência extrema.<br>• Orientação/conselho: Desista de tentar resolver o que não tem mais solução e renuncie ao seu apego a esse cenário de dor; abandone a situação agora e parta para novos ares. Tire férias se for possível, divirta-se um pouco para aliviar a pressão mental, relaxe sua mente ansiosa e busque lazer, entendendo que o afastamento é a única forma de você recuperar sua sanidade e sua força vital."
            }},
            { name: "Sete de Espadas", type: "menor", number: "7", imgUrl: "https://i.ibb.co/Wmw8NGw/IMG-6722.jpg", sections: {
                "Núcleo": "• Essência: Esquivar, trapacear, manipular, dissimular.<br>• Definição: Representa a astúcia e o uso de estratégias pouco ortodoxas para evitar confrontos diretos. É o arcano do \"jeitinho\", da malícia e da busca pelo caminho do menor esforço, podendo envolver fofocas, dissimulação ou traição de acordos estabelecidos.<br>• Advertência: Cuidado para não cruzar a linha tênue entre a habilidade estratégica e a desonestidade; agir de forma oculta ou dissimulada pode trazer vantagens temporárias, mas a perda da credibilidade e da honra resultará em um isolamento difícil de reverter no futuro.",
                "Atributo básico": "• Material: No trabalho, o consultor utiliza a astúcia e o traquejo para queimar etapas e obter resultados rápidos através de atalhos. Há um risco de envolvimento em situações de \"caixa dois\", mentiras profissionais ou o não cumprimento da palavra dada em contratos, exigindo malícia para navegar em ambientes corporativos competitivos e evitar ser pego em armadilhas alheias.<br>• Mental: Mentalidade voltada para a estratégia dissimulada e a persuasão, onde a pessoa fala muito menos do que realmente pensa e esconde suas verdadeiras intenções. O indivíduo busca saídas inteligentes para problemas complexos, evitando bater de frente com obstáculos, agindo com uma esperteza que beira a hipocrisia para manter seu orgulho e satisfazer seus interesses pessoais.<br>• Sentimental: Reflete um comportamento de \"stalker\" ou a prática da maledicência dentro da relação, onde a transparência é substituída por truques emocionais. Há uma tendência à traição ou à falta de compromisso com a palavra empenhada, onde o consultor busca se dar bem sem se expor, utilizando a persuasão para levar o parceiro na conversa e evitar responsabilidades afetivas reais.<br>• Espiritual: Indica uma fase de vulnerabilidade a vírus e energias intrusas que se instalam de forma silenciosa e crônica na alma. O consultor pode estar usando conhecimentos espirituais de forma dissimulada ou buscando atalhos místicos pouco éticos, exigindo atenção com a saúde espiritual para que pequenos desequilíbrios não se tornem dores intensas que o acompanharão por muito tempo em sua jornada.",
                "Atributo diverso": "• Negativo: Representa a adoção de uma postura totalmente honesta, transparente e ética, abandonando qualquer tipo de artimanha ou mentira para conquistar objetivos. O consultor decide agir dentro das leis e convenções sociais, revelando suas verdadeiras intenções e colhendo os frutos de uma vida limpa, onde a verdade absoluta restaura a confiança das pessoas e elimina o medo de ser desmascarado.<br>• Obstáculo: Ocorre pelo excesso de malandragem e dissimulação, que acaba tornando a pessoa alvo de desconfiança generalizada em seu círculo social. A busca obsessiva por atalhos e o hábito de \"fingir demência\" para fugir de responsabilidades criam uma barreira que impede conexões reais e o sucesso legítimo, transformando a esperteza em uma armadilha que isola o indivíduo em sua própria teia de mentiras.<br>• Orientação/conselho: A orientação é para que você se cale, dissimule suas intenções e não seja transparente neste momento específico para evitar ataques. Use de astúcia e jogo de cintura para lidar com as adversidades, não bata de frente com seus opositores e procure caminhos alternativos mais inteligentes, entendendo que a discrição e a mentira estratégica podem ser ferramentas de sobrevivência necessárias."
            }},
            { name: "Oito de Espadas", type: "menor", number: "8", imgUrl: `${baseUrl}S08.jpg`, sections: {
                "Núcleo": "• Essência: Expor, condenar, paralisar, sofrer.<br>• Definição: Representa o vexame público e a colheita amarga de erros cometidos no passado que agora vêm à tona. É um arcano kármico de humilhação e censura, onde o consulente se vê encurralado por suas próprias ações irresponsáveis, enfrentando perdas irreversíveis e julgamentos severos da sociedade.<br>• Advertência: Não tente culpar os outros pelos seus fracassos ou fugir da responsabilidade; a falta de autocrítica e o desejo de repetir o erro apenas aumentarão o seu desespero, sendo necessário aceitar a condenação justa para que o processo de reconstrução moral possa, um dia, ser iniciado.",
                "Atributo básico": "• Material: Fase de desastres profissionais e financeiros provocados por corrupção, roubos ou trapaças que foram desmascaradas perante todos. O consultor enfrenta prejuízos irreparáveis, calotes e dívidas que se tornam públicas, resultando em demissões por justa causa ou processos judiciais que destroem sua reputação e o impedem de continuar exercendo suas atividades de forma digna e lucrativa no mercado atual.<br>• Mental: Mentalidade dominada pelo medo, desespero e pela sensação de estar encurralado em uma prisão mental de sua própria fabricação. O indivíduo recusa-se a aceitar o erro, tentando desesperadamente encontrar culpados externos ou justificativas esdrúxulas para suas falhas, o que gera uma estagnação intelectual e uma angústia profunda que impede qualquer planejamento futuro ou solução lógica para a crise.<br>• Sentimental: Reflete um relacionamento marcado pela exposição pública de traições e pela humilhação mútua, onde todos ao redor descobrem as falhas do casal. Há um sentimento de vexame e reprovação social, onde o amor é substituído pela censura e pelo autoflagelo emocional, resultando em uma ruptura dolorosa onde não há arrependimento real, apenas o pesar por ter sido pego no erro cometido.<br>• Espiritual: Momento de crise espiritual extrema, onde o indivíduo se sente encurralado por obsessores ou por uma carga kármica pesada decorrente de seus atos. Há um risco de depressão grave e autoflagelo físico ou psíquico, exigindo supervisão externa e atenção rigorosa, pois a alma encontra-se paralisada em um leito de hospitalização mística, sem forças para buscar a luz por conta própria.",
                "Atributo diverso": "• Negativo: Indica o início da libertação das amarras mentais através do reconhecimento sincero das próprias falhas e do pedido de desculpas. Representa o momento em que o consultor decide interromper o ciclo de irresponsabilidade e aceita as consequências de seus atos com dignidade, permitindo que a verdade cure as feridas da humilhação e abra caminho para uma nova fase de honestidade e paz interior.<br>• Obstáculo: Ocorre quando a estagnação e o medo paralisam totalmente o consultor, que se recusa a fazer qualquer movimento por medo de novas reprovações. A obsessão em defender o indefensável e a falta de autocrítica tornam-se um muro intransponível, onde a pessoa prefere viver na desgraça e no isolamento a admitir que errou, sabotando qualquer chance de reabilitação social ou profissional legítima.<br>• Orientação/conselho: O conselho é para que você não se movimente e desista de forçar qualquer situação no momento atual. Se você errou, reconheça a falha, peça desculpas sinceramente e aceite a punição ou a perda sem lutar contra os fatos, entendendo que a resignação e o silêncio são as únicas formas de minimizar o estrago e preservar o que restou de sua integridade."
            }},
            { name: "Nove de Espadas", type: "menor", number: "9", imgUrl: `${baseUrl}S09.jpg`, sections: {
                "Núcleo": "• Essência: Desesperar, agonizar, temer, fatalizar.<br>• Definição: Arcano kármico de profundo sofrimento mental, insônia e angústia avassaladora. Representa o fundo do poço emocional, onde o consulente não vê luz ou saída, alimentando fatalismos e uma opressão que vem de si mesmo ao tentar salvar o que já está irremediavelmente perdido.<br>• Advertência: Busque ajuda profissional (psiquiatra) imediatamente; você está dando importância excessiva ao sofrimento e se colocando voluntariamente diante de ataques que já duram tempo demais. Sem uma intervenção externa vigorosa e medicação, o risco de colapso mental ou atitudes autodestrutivas é iminente e perigoso.",
                "Atributo básico": "• Material: No trabalho e nas finanças, indica uma fase de caos absoluto e perda total da dignidade profissional por causa de erros e prejuízos inevitáveis. O consultor vive um pesadelo constante de preocupações financeiras que o impedem de dormir, sentindo-se oprimido por dívidas ou fracassos que ele tenta desesperadamente reverter, mas sem sucesso, resultando em uma degradação material que parece não ter fim.<br>• Mental: Mentalidade mergulhada em paranoias, síndrome do pânico e crises de ansiedade severas que bloqueiam qualquer visão de esperança. O indivíduo sofre com o gasto insuportável de energia mental tentando alcançar objetivos impossíveis, alimentando pensamentos de crueldade consigo mesmo e fatalismos que o impedem de realizar a autocrítica necessária para ressignificar sua história e encontrar um caminho de cura real.<br>• Sentimental: Reflete um estado de aflição e melancolia profunda na relação, onde o sofrimento é potencializado pela incapacidade de aceitar a perda ou a traição. O parceiro pode ser alvo de agressões verbais ou físicas em um cenário de toxicidade extrema, onde a dor dura tanto tempo que se torna exaustiva, gerando um luto que não se fecha e uma agonia constante por querer recuperar o que já morreu.<br>• Espiritual: Representa um estado de desgraça espiritual onde a alma se sente atacada por flechas de dor e energias sangrentas. O consulente está em um vácuo místico, sem conseguir ver a saída, exigindo tratamentos espirituais intensos e rápidos (como internações ou passes de cura profunda) para interromper o processo de obsessão e degradação que o coloca por um fio de cometer uma \"cagada\" espiritual definitiva.",
                "Atributo diverso": "• Negativo: Indica a chegada da clareza e da verdade após a longa noite de desespero, onde o consultor finalmente aceita a realidade e decide parar de sofrer. Representa o sucesso em superar os pesadelos mentais, buscando a luz da razão para dissipar os medos infundados, permitindo que a pessoa recupere seu orgulho e sua honra através de um processo de cura consciente e libertador.<br>• Obstáculo: Ocorre pelo excesso de vitimismo e pela obsessão em manter a dor viva como forma de punição ou controle. O consulente se recusa a sair da frente das \"flechas\" do sofrimento, alimentando uma confiança equivocada de que a dor cessará sem ação, o que gera uma estagnação perversa que impede a entrada de qualquer ajuda externa e perpetua a agonia de forma voluntária e doentia.<br>• Orientação/conselho: Isole-se do barulho externo, pare toda e qualquer ação impulsiva e dedique este tempo à reflexão profunda e à autocrítica honesta sobre seus atos. Resigne-se diante dos fatos que não pode mudar, reconheça onde você agiu de forma errada e busque silenciar sua mente desesperada através da meditação ou ajuda médica, entendendo que nada agora é mais importante que sua sobrevivência."
            }},
            { name: "Dez de Espadas", type: "menor", number: "10", imgUrl: `${baseUrl}S10.jpg`, sections: {
                "Núcleo": "• Essência: Romper, finalizar, anular, libertar.<br>• Definição: Representa o fim drástico e intencional de um ciclo de dor, executado pelo próprio consulente através do livre-arbítrio. É uma ruptura de valores fundamentais que, embora cause sofrimento e deixe cicatrizes profundas, é necessária para anular a paralisia do arcano anterior e permitir uma nova realidade.<br>• Advertência: Não tente evitar essa dor ou manter convicções que já não produzem resultados; romper radicalmente com o que você acreditava ser vital é o único meio de conquistar o seu objetivo final, mesmo que a vitória venha acompanhada de mágoas e sem o lucro ou a felicidade que você imaginava.",
                "Atributo básico": "• Material: No âmbito profissional, indica o fim repentino de um contrato ou de uma carreira baseada em valores que o consultor decidiu abandonar para sobreviver. A realização ocorre com grandes dificuldades e prejuízos financeiros, mas elimina de forma rápida a estagnação anterior, exigindo que a pessoa \"venda um rim\" para atingir o objetivo ou aceite uma derrota lucrativa em nome de sua sanidade mental futura.<br>• Mental: Mentalidade de resolução absoluta e radicalismo, onde o indivíduo decide cortar pela raiz os pensamentos e convicções que o faziam sofrer. Há uma exaustão intelectual que leva a uma definição rápida de novos rumos, abandonando paradigmas antigos sem anestesia para garantir que a mente pare de girar em torno de ilusões, resultando em uma clareza fria e decisiva que anula qualquer confusão mental.<br>• Sentimental: Reflete o término de um relacionamento por uma decisão unilateral e dolorosa de romper com valores que não são mais suportáveis. O consultor encerra o vínculo com mágoa da experiência, não necessariamente da pessoa, motivado pela completa perda de esperança de que a situação melhore. É um adeus definitivo que deixa cicatrizes eternas, mas que liberta o coração de um peso insuportável e tóxico.<br>• Espiritual: Momento de ruptura espiritual profunda, onde dogmas ou crenças ancestrais são abandonados com dor para que a alma possa evoluir. Indica internações intensivas ou processos de cura agressivos que eliminam miasmas e paralisias kármicas, deixando marcas indeléveis na sensibilidade do consulente, mas garantindo que a \"sofrência\" mística seja interrompida definitivamente através de uma ação divina de finalização.",
                "Atributo diverso": "• Negativo: Indica que o fim não será tão doloroso ou que a ruptura ocorrerá de forma mais suave, sem as marcas profundas de uma tragédia. Representa a manutenção de valores importantes que evitam o colapso total, permitindo que a finalização do ciclo seja apenas uma transição necessária e menos agressiva, onde a pessoa consegue sair da situação com menos prejuízos emocionais e materiais do que o esperado.<br>• Obstáculo: Ocorre pelo excesso de radicalismo e pela pressa em destruir tudo o que foi construído por puro cansaço ou orgulho ferido. A pessoa pode tomar decisões irreversíveis em um momento de exaustão, jogando fora oportunidades ou relacionamentos que ainda tinham salvação, agindo com uma agressividade desnecessária que gera mágoas eternas e impede qualquer reconciliação futura ou aproveitamento dos frutos do passado.<br>• Orientação/conselho: Revire seus conceitos e convicções ao contrário, pois nada do que você acredita atualmente está produzindo resultados reais de bem-estar em sua vida. Tome a decisão difícil, solucione a pendência de forma definitiva e rompa radicalmente com o que lhe causa dor, entendendo que a resolução drástica agora é o único caminho para interromper o seu sofrimento e conquistar sua liberdade."
            }},
            { name: "Pajem de Espadas", type: "menor", number: "Pajem", imgUrl: `${baseUrl}SC1P.jpg`, sections: {
                "Núcleo": "• Essência: Provocar, criticar, mentir, espionar.<br>• Definição: Representa uma energia juvenil e imatura marcada pela maldade, pela indiscrição e pelo uso vulgar da palavra para ferir ou fofocar. É o \"aspirante a diabo\" que, por insegurança e falta de autocontrole, coloca em dúvida a palavra alheia e busca meios esdrúxulos ou ilegais para obter vantagens fúteis.<br>• Advertência: Cuidado com suas atitudes atabalhoadas e com a língua afiada, pois seus insultos e indiretas podem gerar brigas que você não tem competência mental para vencer; mentir descaradamente ou agir como um stalker apenas destruirá sua própria reputação e o levará a micos e fracassos vergonhosos.",
                "Atributo básico": "• Material: No trabalho, indica um ambiente tóxico marcado por picuinhas, fofocas e por uma competitividade inglória onde se tenta destruir a imagem do colega por pura inveja. O consultor enfrenta propostas ruins e acordos que não serão cumpridos, agindo de forma imoral e desleal para conquistar cargos ou lucros que logo se perderão devido à sua própria burrice e falta de escrúpulos profissionais.<br>• Mental: Mentalidade obtusa, reativa e dominada por uma curiosidade fútil sobre a vida alheia, focada em encontrar defeitos nos outros para compensar a própria frustração. A expressão é ofensiva, sarcástica e cheia de indiretas rasas nas redes sociais, agindo com uma elaboração mental curta e restrita que o impede de ouvir conselhos ou de planejar qualquer coisa que seja legítima e inteligente.<br>• Sentimental: No campo afetivo, reflete uma fase de pirraça, deslealdade e comportamentos abusivos baseados em ameaças e chantagens emocionais (como vazar nudes). Existe uma total falta de sensibilidade e de autocontrole, onde a pessoa provoca discussões vulgares e se comporta de maneira mimada e birrenta, destruindo qualquer chance de harmonia por meio de mentiras e de uma raiva escalonada e destrutiva.<br>• Espiritual: Momento de perigo místico onde o consulente utiliza a fé para práticas negativas, como \"macumbas\" para forçar relacionamentos ou para prejudicar inimigos. Há uma abertura para ataques de obsessores devido à baixa vibração de ódio e fofoca, resultando em um carma pesado de discórdia e em acidentes ou cortes físicos que servem como aviso da degradação espiritual em curso.",
                "Atributo diverso": "• Negativo: Indica a possibilidade de reverter a má conduta através de um choque de realidade que force o indivíduo a adotar a gratidão, a paciência e a negociação honesta. Representa o momento em que a pessoa decide amadurecer e abandonar as mentiras, buscando suavizar suas palavras e agir com resiliência para evitar a autodestruição total e reconquistar um mínimo de decência social.<br>• Obstáculo: Ocorre pelo excesso de rebeldia sem causa e pelo hábito de ser \"do contra\" apenas para chamar atenção ou para irritar os outros. A obsessão em vigiar a vida alheia (stalker) e em causar escândalos cria um isolamento agressivo onde ninguém confia no consulente, transformando sua inteligência em uma ferramenta burra que só produz intrigas e afasta qualquer oportunidade de sucesso real.<br>• Orientação/conselho: A orientação sugere que você seja insensível, pense apenas em si mesmo e use de evasivas para escapar de discussões que não pode vencer. Minta descaradamente se for necessário para se proteger, não tome partido em questões que não lhe dizem respeito e mantenha uma postura defensiva e discreta para evitar que sua própria maldade se volte contra você neste momento crítico."
            }},
            { name: "Cavaleiro de Espadas", type: "menor", number: "Cavaleiro", imgUrl: `${baseUrl}SC2K.jpg`, sections: {
                "Núcleo": "• Essência: Lutar, conquistar, atropelar, dominar.<br>• Definição: Representa a força impetuosa e inteligente da vontade que busca a vitória a qualquer custo, sem medir consequências ou ter piedade. É o combatente audacioso e proativo que lidera através do autoritarismo e do mérito próprio, vencendo desafios por esforço hercúleo e radicalismo em suas convicções inabaláveis.<br>• Advertência: Cuidado com a falta de empatia e com a brutalidade verbal ou física, pois seu desejo de vencer pode levá-lo a passar por cima de tudo e de todos, destruindo pontes valiosas; embora sua coragem seja imensa, agir sem medir as palavras ou os sentimentos alheios pode gerar inimigos poderosos e isolamento.",
                "Atributo básico": "• Material: Fase de conquistas profissionais rápidas e agressivas, onde o consultor aceita e vence qualquer desafio através de uma proatividade absoluta e sem preguiça. O sucesso é garantido pelo mérito e pelo suor, sem ajuda da sorte, resultando em uma liderança impositiva que ostenta medalhas e vitórias, mas que pode criar um ambiente de trabalho inóspito e tenso devido à sua rispidez e comando implacável.<br>• Mental: Mentalidade sagaz, focada e extremamente argumentativa, voltada para a defesa fanática de suas próprias ideias e planos intelectuais. O indivíduo expressa-se com franqueza cortante, falando o que pensa sem manipulações, agindo com uma audácia que não aceita limites ou contestações, sentindo-se plenamente capaz de reconstruir cenários em ruínas através de sua lógica afiada e de sua pressa em realizar.<br>• Sentimental: No campo afetivo, indica um relacionamento marcado pela intensidade, pela urgência e, por vezes, pela agressividade ou brutalidade emocional e verbal. Existe uma busca por domínio e uma falta de paciência para o romantismo, onde o parceiro impõe sua vontade sem empatia, cumprindo promessas de forma ríspida, o que pode resultar em vínculos tóxicos, abusivos ou até em situações de violência e coação.<br>• Espiritual: Momento de combate místico vigoroso e defesa radical da própria fé ou de convicções espirituais, agindo com uma energia de desbravador. Há um risco de fanatismo religioso e de uso da força espiritual para subjugar opositores, exigindo cuidado para que a potência mediúnica não se transforme em uma arma de destruição gratuita que gere cicatrizes eternas na alma e no entorno.",
