            { name: "Cinco de Paus", type: "menor", number: "5", imgUrl: `${baseUrl}W05.jpg`, sections: {
                "Núcleo": "• Essência: Debater, competir, desgastar, detalhar.<br>• Definição: Representa uma fase de irritações insignificantes e tensões causadas por obstáculos de pequeno porte que desviam o consulente de seus objetivos principais. É o arcano das discussões banais, da competitividade acirrada no trabalho e do esforço exaustivo sem um resultado visível imediato, marcado pela intolerância e picuinhas.<br>• Advertência: Pare de gastar sua preciosa energia tentando ter sempre a última palavra em discussões inúteis ou em detalhes irrelevantes; esse excesso de crítica e o desejo de prevalecer em debates vazios apenas geram desarmonia e cansaço, impedindo que você foque no que realmente importa para a sua evolução e sucesso real.",
                "Atributo básico": "• Material: No trabalho, indica um ambiente altamente competitivo e exaustivo, onde todos tentam mostrar que são melhores que os outros em tarefas de \"formiguinha\". Há constantes discussões por coisas banais e burocracias chatas que atrasam os projetos, resultando em um desgaste físico e financeiro sem ganhos expressivos, exigindo que o consultor arregace as mangas e lute arduamente para manter seu espaço em meio ao caos produtivo.<br>• Mental: Mentalidade obscecada por detalhes e picuinhas, marcada por uma ansiedade constante ao ver os outros em paz. O indivíduo expressa-se de forma detalhista e exigente demais, agindo com uma intolerância que o torna péssimo para trabalhar em equipe, gastando seu estofo intelectual em revisões eternas e debates construtivos, mas extremamente cansativos, que não levam a uma conclusão prática ou definitiva de pensamento.<br>• Sentimental: No campo afetivo, reflete uma fase de chatice e \"DRs\" intermináveis por motivos fúteis, como a cor da parede ou tarefas domésticas negligenciadas. Existe uma competitividade sutil onde cada um quer provar que tem razão, colocando obstáculos e defeitos na relação por pura irritação, o que gera um clima de tensão e desarmonia constante onde o amor se perde em meio a reclamações insignificantes.<br>• Espiritual: Momento de inquietação mística e falta de silêncio interior, onde a mente agitada impede a conexão profunda com o divino. Há um desgaste energético causado pela intolerância com as diferenças alheias e por conflitos de ideias religiosas sem liderança clara, exigindo que o consulente aprenda a lidar com as pequenas adversidades do ego para não se perder em uma guerra espiritual inútil e sem propósito.",
                "Atributo diverso": "• Negativo: Indica a cessação dos conflitos inúteis e o fim da fase de irritações constantes que impediam o progresso dos projetos. Representa o momento em que as partes envolvidas decidem parar de discutir por detalhes e começam a focar na solução dos problemas reais, permitindo que a harmonia retorne e que a energia vital seja canalizada para construções muito mais produtivas e gratificantes.<br>• Obstáculo: Ocorre pelo excesso de detalhismo e pela mania de colocar defeito em tudo, o que acaba paralisando as ações do grupo ou do casal. A pessoa torna-se o \"chatão do rolê\", sugando a alegria do ambiente por sua incapacidade de ser tolerante ou flexível, criando uma barreira de negatividade que afasta aliados e transforma desafios superáveis em verdadeiras montanhas de estresse e exaustão emocional.<br>• Orientação/conselho: Aceite os desafios que surgirem com disposição, seja competitivo de forma saudável e mostre sua força e coragem diante dos obstáculos diários. Tenha critério em suas ações, mas evite o detalhismo excessivo que trava o progresso; arregace as mangas e trabalhe com dedicação para superar as picuinhas, entendendo que o esforço contínuo é a única forma de vencer nesta fase de turbulências."
            }},
            { name: "Seis de Paus", type: "menor", number: "6", imgUrl: `${baseUrl}W06.jpg`, sections: {
                "Núcleo": "• Essência: Triunfar, vangloriar, reconhecer, liderar.<br>• Definição: Representa o sucesso merecido após um período de lutas, marcado pelo reconhecimento público e pelo recebimento de elogios e honrarias. É o arcano da vitória de curta duração, onde o consulente sente-se satisfeito consigo mesmo, ganhando autoconfiança e carisma para liderar o seu entorno social.<br>• Advertência: Cuidado para não cair na vanglória e no exibicionismo por conquistas pequenas ou triviais; embora você tenha mérito e os aplausos sejam justos, lembre-se de que o progresso ainda não terminou e que a manutenção do sucesso exige que você continue focado em seus objetivos maiores com humildade e perseverança.",
                "Atributo básico": "• Material: Fase de êxito profissional e financeiro com promoções, bônus e aumentos salariais como fruto direto do esforço pessoal. O consultor é reconhecido publicamente por sua competência, colhendo resultados conforme o planejado e desfrutando de um upgrade social que atrai novas oportunidades, resultando em uma estabilidade econômica momentânea, mas muito gratificante, onde todos os investimentos trazem um retorno positivo imediato e visível ao mercado.<br>• Mental: Mentalidade de autoestima elevada e otimismo contagiante, focada na autoapreciação das próprias ideias e talentos intelectuais. O indivíduo expressa-se com carisma e liderança, agindo de forma faceira e exibida ao mostrar seus conhecimentos, sentindo-se perfeitamente confiante em sua capacidade de convencer os outros e de manter a última palavra em debates, o que favorece a concretização de seus projetos intelectuais mais caros.<br>• Sentimental: No campo afetivo, indica uma fase de harmonia onde o parceiro reconhece e elogia as qualidades do consulente, trazendo um sentimento de vitória e felicidade ao casal. Existe um clima de contentamento e exibicionismo social da relação, com promessas cumpridas de ambos os lados e um carisma que atrai a admiração mútua, resultando em um vínculo fortalecido pelo mérito e pela satisfação de estarem juntos.<br>• Espiritual: Momento de restauração da fé e reconhecimento divino pelos esforços realizados no caminho da luz. O consultor sente-se como um \"vitorioso\" espiritual, recebendo proteção e boas notícias do plano astral que trazem alta hospitalar mística ou a cura de antigos males, permitindo que a alma brilhe com carisma e liderança, sendo recebida com festa e aplausos pelos guias e mentores espirituais.",
                "Atributo diverso": "• Negativo: Indica a falta de reconhecimento e a frustração de não receber os méritos devidos por um trabalho bem realizado, gerando baixa autoestima. Representa uma fase em que o sucesso é apenas aparente ou falso, onde as promessas não são cumpridas e a liderança do consulente é questionada, resultando em uma queda social ou em um sentimento de amargura por ter lutado e não ter sido valorizado.<br>• Obstáculo: Ocorre pelo excesso de orgulho e pela necessidade obsessiva de ser o centro das atenções, o que pode tornar a pessoa arrogante e cega para suas próprias falhas. A vanglória por glórias triviais afasta as pessoas e cria uma falsa sensação de segurança, impedindo que o consultor continue se esforçando para evoluir, ficando preso em um \"pódio\" imaginário que não se sustenta na realidade futura.<br>• Orientação/conselho: Mantenha o foco absoluto em seus objetivos finais e regozije-se sinceramente com as pequenas vitórias que conquistar ao longo do caminho. Mostre confiança em sua capacidade de vencer, vá atrás do seu triunfo com determinação, persevere em seus esforços e inicie seus projetos com a certeza de que você é merecedor de todos os aplausos e recompensas que estão chegando."
            }},
            { name: "Sete de Paus", type: "menor", number: "7", imgUrl: `${baseUrl}W07.jpg`, sections: {
                "Núcleo": "• Essência: Defender, perseverar, combater, destacar.<br>• Definição: Representa a luta solitária do consulente contra múltiplos oponentes ou adversidades para manter o que conquistou anteriormente. É o arcano da meritocracia completa e do foco estruturado, onde a coragem e a disciplina são as ferramentas essenciais para enfrentar boicotes, invejas e sabotagens com altivez e valentia.<br>• Advertência: Não abaixe a guarda nem se deixe intimidar pela força dos seus adversários, que podem parecer mais numerosos que você; embora o desgaste seja enorme, você possui a capacidade e a autoridade necessárias para vencer essas provas, desde que mantenha a direção firme e não se deixe abater pelos ataques injustos do entorno.",

                "Atributo diverso": "• Negativo: Indica a queda diante dos oponentes por falta de coragem ou a incapacidade de defender seus próprios interesses, resultando na perda do que foi duramente conquistado. Representa uma fase de vulnerabilidade total a sabotagens e mentiras, onde a pessoa desiste da luta e se entrega ao fracasso por se sentir em desvantagem numérica ou por não acreditar em sua própria força e competência para vencer.<br>• Obstáculo: Ocorre pelo excesso de agressividade defensiva e pela mania de ver inimigos em todos os lugares, o que gera um isolamento hostil e desnecessário do consulente. A pessoa pode se exaurir lutando contra moinhos de vento ou atacando aliados por puro nervosismo, perdendo a noção de estratégia e transformando sua vida em uma guerra eterna que impede o usufruto da paz e das conquistas materiais.<br>• Orientação/conselho: Lute sem medo pelos seus ideais, defenda com garra o território e as conquistas que você já possui e não se deixe abater pelas dificuldades atuais. Torne seu trabalho público para afastar as mentiras, batalhe com determinação solitária, mova-se com rapidez contra seus opositores e supere os desafios com coragem, entendendo que você está plenamente preparado para enfrentar qualquer força adversa."

            { name: "Oito de Paus", type: "menor", number: "8", imgUrl: `${baseUrl}W08.jpg`, sections: {

                "Atributo diverso": "• Negativo: Indica a lentidão irritante em processos que deveriam ser rápidos, ou o cancelamento súbito de notícias e propostas que eram esperadas com ansiedade. Representa uma fase em que a falta de flexibilidade faz com que a pessoa perca o momento da mudança, resultando em uma estagnação frustrante onde os problemas continuam sem solução e a energia vital se dispersa sem atingir o alvo necessário.<br>• Obstáculo: Ocorre pelo excesso de pressa e pela ansiedade desmedida que podem levar a erros de julgamento e a comportamentos atabalhoados. A pessoa pode se perder em uma comunicação frenética e superficial (como excesso de redes sociais) que não gera resultados profundos, tornando-se escrava da velocidade e perdendo a capacidade de refletir sobre o sentido real de suas ações em meio ao turbilhão de mudanças.<br>• Orientação/conselho: Seja extremamente rápido e impulsivo em suas decisões atuais, persevere em seus planos com vigor e mostre total flexibilidade diante das transformações que estão ocorrendo. Presenteie as pessoas, ofereça ajuda generosa, procure alternativas inovadoras e resolva todas as suas pendências agora sem enrolação, entendendo que o universo está conspirando a seu favor para uma solução imediata e muito positiva."

            { name: "Nove de Paus", type: "menor", number: "9", imgUrl: `${baseUrl}W09.jpg`, sections: {
                "Núcleo": "• Essência: Recuar, temer, precaver, atrasar.<br>• Definição: Representa um estado de exaustão e defesa causado por traumas de experiências passadas que ainda assombram o presente do consulente. É o arcano da quarentena emocional e dos medos paranoicos, onde a pessoa se coloca na defensiva e retarda o progresso por puro receio de reviver dores ou obstáculos que já deveriam ter sido superados.<br>• Advertência: Não permita que suas feridas antigas comandem suas decisões atuais a ponto de paralisar sua vida e transformá-lo em seu próprio inimigo; embora a cautela seja prudente, o excesso de desconfiança e a timidez social podem criar barreiras burocráticas irreais que impedem a realização de seus desejos e o usufruto da sorte.",
                "Atributo básico": "• Material: Fase de atrasos burocráticos e obstáculos passageiros no trabalho, frequentemente causados pelo medo do consultor em investir ou recomeçar em novos cenários econômicos. Há um desgaste físico por excesso de cautela e uma exaustão que leva ao recuo estratégico, onde a pessoa prefere a segurança estagnada à ousadia produtiva, resultando em uma demora maior para atingir metas financeiras por puro receio de cometer erros antigos.<br>• Mental: Mentalidade defensiva e introvertida, marcada por paranoias e por uma lembrança constante de fracassos passados que bloqueia a iniciativa intelectual. O indivíduo expressa-se com retração e timidez, agindo com um \"pé atrás\" em todas as suas propostas, o que gera uma sensação de opressão mental e uma dificuldade em se abrir para novas ideias ou contatos sociais por se sentir permanentemente ameaçado pelo ambiente externo.<br>• Sentimental: No campo afetivo, reflete uma fase de recolhimento onde o consultor luta para gostar do outro por medo de ser ferido novamente. Existe uma defensiva e uma desconfiança crônica que impedem a entrega emocional, resultando em um relacionamento travado por barreiras internas de insegurança e por uma lembrança de traições passadas que impede o casal de vibrar na mesma sintonia de confiança e afeto sincero.<br>• Espiritual: Momento de recolhimento místico e proteção contra ataques obsessores que exploram as feridas da alma. O consultor encontra-se em uma fase de \"quarentena espiritual\", recuando para curar dores antigas, mas corre o risco de se isolar excessivamente da luz por medo de novas influências, exigindo um trabalho de perdão e de fortalecimento interior para que possa voltar a confiar em seus guias e intuições.",
                "Atributo diverso": "• Negativo: Indica a libertação dos medos passados e a coragem de voltar à arena da vida sem as amarras da desconfiança. Representa o fim da quarentena emocional, onde a pessoa decide abandonar a defensiva e se permitir viver novas experiências, superando a timidez e o trauma para retomar o fluxo natural de seus projetos e relacionamentos com confiança renovada.<br>• Obstáculo: Ocorre pelo excesso de precaução e pela síndrome de perseguição, onde o consultor vê ameaças em todo lugar e boicota seu próprio progresso. A obsessão em se proteger cria um isolamento neurótico que afasta aliados e destrói oportunidades reais de felicidade, transformando a experiência de vida em uma eterna trincheira onde a pessoa nunca avança por puro pavor do fracasso.<br>• Orientação/conselho: Seja cauteloso, mas não permita que a paranoia o domine. Analise os fatos com prudência, cure suas feridas passadas e não projete traumas antigos nas oportunidades atuais. Recue estrategicamente apenas para se reorganizar, mas prepare-se para voltar à luta, entendendo que a desconfiança absoluta não o protege do mundo, apenas o impede de viver plenamente e de conquistar seus objetivos."

            { name: "Dez de Paus", type: "menor", number: "10", imgUrl: `${baseUrl}W10.jpg`, sections: {
                "Núcleo": "• Essência: Sobrecarregar, lutar, esforçar, superar.<br>• Definição: Representa uma fase de esforço hercúleo, onde o consulente carrega um peso imenso de responsabilidades, sentindo-se oprimido e exausto. É o momento de \"abraçar o mundo com as pernas\", enfrentando grandes obstáculos com uma dedicação absoluta para atingir uma nova fase de vida.<br>• Advertência: Cuidado com o estresse e a incapacidade de delegar tarefas, pois o excesso de obrigações pode cegá-lo para as conquistas já realizadas; embora a luta seja digna, a fadiga extrema pode comprometer sua visão e saúde se você não aprender a dividir o fardo.",
                "Atributo básico": "• Material: No trabalho e nas finanças, reflete uma fase de sobrecarga total, onde o consultor está assoberbado de tarefas e obrigações que parecem inatingíveis. Há uma rotina exaustiva e um sufocamento profissional causado pelo excesso de responsabilidades que ele assumiu deliberadamente, exigindo um esforço de \"Sansão\" para manter a lealdade à palavra dada e garantir o sucesso financeiro.<br>• Mental: Mentalidade marcada pela pressão, estresse e pela sensação de que o objetivo final está longe demais devido ao peso das responsabilidades. O indivíduo busca sabedoria para reorganizar sua vida, mas sofre com a fadiga intelectual e com a incapacidade de delegar, sentindo-se permanentemente atarefado e sob o domínio de um paradigma que exige dedicação integral sem pausas para respirar.<br>• Sentimental: Reflete um relacionamento vivido sob grande pressão e fadiga, onde o consultor se esforça intensamente para restabelecer a harmonia ou mudar padrões de convivência. Existe uma lealdade profunda ao compromisso, mas o peso das obrigações mútuas gera um incômodo constante, exigindo uma batalha diária com sucesso incerto se não houver uma reconfiguração completa da dinâmica afetiva do casal.<br>• Espiritual: Momento de transição espiritual trabalhosa, assemelhando-se ao esforço de uma cobra para trocar de pele em meio a grandes obstáculos. A alma enfrenta uma sobrecarga energética e kármica que exige lealdade e honra, resultando em uma mudança de frequência conquistada a custos altíssimos de esforço místico, permitindo uma ressignificação profunda da trajetória espiritual através da meritocracia.",
                "Atributo diverso": "• Negativo: Indica a libertação de pesos desnecessários e a descoberta de formas mais leves de atingir os objetivos, abandonando a necessidade de sofrer para vencer. Representa o momento em que o consultor decide delegar tarefas, eliminando a opressão e o sufocamento, permitindo que a vida flua com menos esforço e mais prazer, recuperando a vitalidade perdida durante a fase de sobrecarga.<br>• Obstáculo: Ocorre pelo excesso de responsabilidade e pela mania de carregar o mundo nas costas sem pedir ajuda, o que paralisa a visão do sucesso. A pessoa torna-se escrava de sua própria dedicação, perdendo-se em rotinas exaustivas que impedem o usufruto das recompensas, agindo com uma teimosia heróica que acaba por minar sua resistência física e mental de forma perigosa.<br>• Orientação/conselho: Assuma suas responsabilidades com honradez, dedique-se integralmente aos seus objetivos e não pare diante dos desafios, pois a vitória depende do seu esforço pessoal e da sua lealdade à palavra dada. Lute com garra para superar as limitações atuais, entenda que este é um momento de reestruturação profunda e aceite o desafio com coragem e determinação inabaláveis."

            { name: "Cavaleiro de Paus", type: "menor", number: "Cavaleiro", imgUrl: `${baseUrl}WC2K.jpg`, sections: {

    "Oito de Copas": "• Ou ele abandona o comportamento ou o cenário.<br>• No 8 de espadas ele não reconhece que erra e acha que tem razão no erro que cometeu, no 8 de copas não, tem um entendimento de aquilo é errado, e ele não quer mais errar na mesma coisa.<br>• Abandona promessas e compromissos.<br>• Desleixo em casa<br>• Não paga dívidas<br>• Não cuida do tratamento de saúde<br>• Abandono de valores.<br>• Abandona a moral.<br>• Abandono de si mesmo.<br>• Nem tudo o que a gente quer nos faz bem, realizar é fracassar<br>• Ponto de transformação na vida<br>• Achou que era dono da cocada preta e só pisou no tomate (7 de copas) e aqui vem o fracasso, vai também \"ser descoberto/ pego\".<br>• Consulente mesmo abandona o projeto, parecido com o 6 de espadas, mas o 8 de copas reformula, faz um review de si mesmo.<br>• Ele não queria ir embora, mas é forçado a ir embora, forçado a desistir de algo.<br>• Fracasso<br>• Inevitável.<br>• Perdas.<br>• Prejuízos.<br>• Você apostou no erro.<br>• Desolação<br>• Ihhhhh, não deu!<br>• Vitimismo.<br>• Mimimi.<br>• Crime<br>• Delito.<br>• Engano.<br>• Crises<br>• Ir embora<br>• Despedida forçada.<br>• Ir ao desconhecido.<br>• Com pesar.<br>• Com medo.<br>• Remorso<br>• Uma pessoa completamente doída e péssima, e ainda pode ter um sinal de suicídio (na casa 8), depende dos arcanos - tem que ver a 3 (como vai executar), 1 (como está o pensamento racional), ver arcano maior junto.<br>• Depressão.<br>• (Com lua = psiquiatra)<br>• Sinal de que a pessoa precisa de psiquiatra (casa 8).<br>• Arrependimento; Leva a uma resignificação de si e do que fez, talvez não erre mais.<br>• Abandona o comportamento errado e para de trair esposa.<br>• Ou abandona a esposa e mantém o comportamento.<br>• Doença<br>• Cansaço<br>• Esgotado.<br>• Gasto.<br>• Má sorte<br>• Divórcio<br>• Demissão<br>• É uma saída forçada, você é empurrado pra ir embora, \"estou sendo demitido porque eu abandonei o meu trabalho, porque não tenho mais respeito, não cumpro hora,         function renderCards() {
            cardsGrid.innerHTML = '';
            let filtered = rawData.filter(card => {
                const matchesFilter = activeFilter === 'todos' || card.type === activeFilter;
                const matchesSuit = (activeFilter !== 'menor' || activeSuit === 'todos') || card.suit === activeSuit;
                const term = searchQuery.toLowerCase();
                const matchesName = card.name.toLowerCase().includes(term);
                let matchesContent = false;
                if (term.length > 1) {
                    if (card.sections) matchesContent = Object.values(card.sections).some(text => text.toLowerCase().includes(term));
                    if (!matchesContent && card.planos) matchesContent = JSON.stringify(card.planos).toLowerCase().includes(term);
                }
                const matchesSearch = term === '' ? true : (matchesName || matchesContent);
                return matchesFilter && matchesSuit && matchesSearch;
            });

            cardCount.innerText = `${filtered.length} arcano${filtered.length !== 1 ? 's' : ''}`;

        function renderPlanoTabs() {

        function selectPlanoTab(key) { activeTab = key; activeAmorSub = 'solteiras'; renderPlanoTabs(); renderModalBody(); }
        function selectAmorSub(sub) { activeAmorSub = sub; renderModalBody(); }

        function fieldBlock(label, text) {
            if (!text) return '';
            return `
              <div class="border border-app-secondary/30 rounded-2xl p-4 mb-3 bg-[#171033] shadow-lg shadow-black/20 relative overflow-hidden group">
                  <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-app-primary/50 group-hover:bg-app-primary transition-colors"></div>
                  <span class="text-app-primary font-bold text-sm tracking-widest uppercase block mb-1.5 ml-2">${label}</span>
                  <span class="text-app-textMuted text-sm leading-relaxed font-light block ml-2">${text}</span>
              </div>
            `;
        }

        function renderModalBody() {
            const card = currentCard;
            let html = '';
            const tabConfig = PLANOS_CONFIG.find(p => p.key === activeTab);

                        if (activeTab === 'significadosGerais') {
                if (!card.sections || Object.keys(card.sections).length === 0) {
                    html = `<div class="text-center py-10 text-app-textMuted"><i class="fas fa-moon text-2xl mb-3 opacity-40"></i><p class="text-sm">Significados gerais ainda não foram cadastrados para esta carta.</p></div>`;
                } else {
                    for (const [sectionTitle, content] of Object.entries(card.sections)) {
                        const items = content.split(/<br>\s*•\s*|•\s*/).filter(item => item.trim() !== '');

                        if (sectionTitle === 'Significados Gerais') {
                            // Exibe cada significado como um "botãozinho" (chip/tag),
                            // preservando frases inteiras sem cortar palavras.
                            const chips = items.map(item => {
                                const cleanItem = item.replace(/<br>\s*$/g, '').trim();
                                if (!cleanItem) return '';
                                return `<span class="px-3 py-1.5 rounded-xl bg-[#171033] border border-app-secondary/30 text-app-textMuted text-xs leading-snug hover:border-app-primary/50 hover:text-white transition-colors">${cleanItem}</span>`;
                            }).join('');
                            html += `<div class="mb-6"><h3 class="text-white font-cinzel font-bold text-xl mb-4 tracking-wide flex items-center gap-3 border-b border-app-secondary/20 pb-2"><i class="fas fa-moon text-app-primary text-sm"></i> ${sectionTitle.toUpperCase()}</h3><div class="flex flex-wrap gap-2">${chips}</div></div>`;
                            continue;
                        }

                        let formattedContent = items.map(item => {
                            let cleanItem = item.replace(/<br>\s*$/g, '').trim();
                            let parts = cleanItem.split(':');
                            if (parts.length > 1) {
                                let keyword = parts[0].trim();
                                let text = parts.slice(1).join(':').trim();
                                return fieldBlock(keyword, text);
                            } else {
                                return `<p class="text-app-textMuted text-sm leading-relaxed font-light mb-3">${cleanItem}</p>`;
                            }
                        }).join('');

                        html += `<div class="mb-6"><h3 class="text-white font-cinzel font-bold text-xl mb-4 tracking-wide flex items-center gap-3 border-b border-app-secondary/20 pb-2"><i class="fas fa-moon text-app-primary text-sm"></i> ${sectionTitle.toUpperCase()}</h3><div class="flex flex-col">${formattedContent}</div></div>`;
                    }
                }
                modalBody.innerHTML = html;
                return;
            }


            const planoData = card.planos ? card.planos[activeTab] : null;
            if (!planoData) {
                html = `<div class="text-center py-10 text-app-textMuted"><i class="fas fa-moon text-2xl mb-3 opacity-40"></i><p class="text-sm">Conteúdo de "${tabConfig.label}" ainda não foi cadastrado para esta carta.</p></div>`;
            } else if (activeTab === 'vidaMaterial') {
                html = `<div class="mb-2"><h3 class="text-white font-cinzel font-bold text-xl mb-4 tracking-wide flex items-center gap-3 border-b border-app-secondary/20 pb-2"><i class="fas fa-coins text-app-primary text-sm"></i> VIDA MATERIAL</h3>
                    ${fieldBlock('Ativo', planoData.ativo)}${fieldBlock('Inativo', planoData.inativo)}${fieldBlock('Financeiro', planoData.financeiro)}</div>`;
            } else if (activeTab === 'vidaAmorosa') {
                const sub = planoData[activeAmorSub];
                html = `<div class="mb-2"><h3 class="text-white font-cinzel font-bold text-xl mb-4 tracking-wide flex items-center gap-3 border-b border-app-secondary/20 pb-2"><i class="fas fa-heart text-app-primary text-sm"></i> VIDA AMOROSA</h3>
                    ${planoData.descricao ? fieldBlock('Essência', planoData.descricao) : ''}
                    <div class="flex gap-2 mb-4">
                      <button onclick="selectAmorSub('solteiras')" class="px-4 py-1.5 rounded-full text-xs transition ${activeAmorSub==='solteiras' ? 'pill-active' : 'bg-app-card border border-app-secondary/30 text-app-textMuted'}">Pessoas Solteiras</button>
                      <button onclick="selectAmorSub('compromissadas')" class="px-4 py-1.5 rounded-full text-xs transition ${activeAmorSub==='compromissadas' ? 'pill-active' : 'bg-app-card border border-app-secondary/30 text-app-textMuted'}">Pessoas Compromissadas</button>
                    </div>
                    ${sub ? `${fieldBlock('Relação', sub.relacao)}${fieldBlock('Amor', sub.amor)}${fieldBlock('Atitude', sub.atitude)}${fieldBlock('Sexual', sub.sexo)}${fieldBlock('Futuro', sub.futuro)}` : ''}</div>`;
            } else {
                html = `<div class="mb-2"><h3 class="text-white font-cinzel font-bold text-xl mb-4 tracking-wide flex items-center gap-3 border-b border-app-secondary/20 pb-2"><i class="fas ${tabConfig.icon} text-app-primary text-sm"></i> ${tabConfig.label.toUpperCase()}</h3>
                    ${Object.entries(planoData).map(([k, v]) => fieldBlock(k.charAt(0).toUpperCase() + k.slice(1), v)).join('')}</div>`;

            modalBody.innerHTML = html;
        }

        function closeModal() {
            modalContent.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        /* ============================================================
           PRATICAR LEITURA — Jogo de Treino SCR
           ============================================================ */
        let houseOrder = GAMES.scr.houses.map(h => h.id);
        let houseLabel = Object.fromEntries(GAMES.scr.houses.map(h => [h.id, h.label]));
        function freshPracticeState() {
            const s = {};
            houseOrder.forEach(id => { s[id] = { maior: null, menor: null }; });
            return s;
        }
        let practiceState = freshPracticeState();
        let pendingSlot = null;
        let choosePanelSuit = 'todos';
        let activeDrawMode = null; // 'batch' ou 'single'

        const meaningKeys = ['Núcleo', 'Atributo básico', 'Atributo diverso'];
        let meaningIndex = 0;
        let equalMeaningsMode = false;

        // Extrai as palavras-chave da linha "Essência:" dentro do Núcleo de cada carta,
        // usadas como alternativas extras quando só há 1 palavra cadastrada em customPlateWords.
        function extractEssenceWords(card) {
            if (!card.sections || !card.sections['Núcleo']) return [];
            const match = card.sections['Núcleo'].match(/Essência:\s*([^<]+?)\./i);
            if (!match) return [];
            return match[1].split(',')
                .map(w => w.trim())
                .filter(w => w !== '')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1));
        }

        function cardWord(card) {
            const custom = customPlateWords[card.name];
            let palavras = [];

            // Palavras personalizadas cadastradas para a carta
            if (custom && custom.trim() !== '') {
                palavras = custom.split(',').map(p => p.trim()).filter(p => p !== '');
            }

            // Se só existir 1 palavra cadastrada (caso comum dos Arcanos Maiores),
            // completa com as palavras da Essência para garantir variação ao trocar o significado
            if (palavras.length <= 1) {
                extractEssenceWords(card).forEach(w => {
                    if (!palavras.includes(w)) palavras.push(w);
                });
            }

            if (palavras.length === 0) return card.name;

            // Alternância determinística: cada clique em "Significado" sempre muda a palavra exibida
            return palavras[meaningIndex % palavras.length];
        }

        /* ---------- Modo "Mostrar Significados Iguais" ----------
           Quando ativo, as placas do tabuleiro passam a mostrar, a cada
           clique, UM grupo de significado por vez (igual ou semelhante):
           só as cartas que realmente pertencem àquele grupo mostram a
           palavra; todas as outras cartas do tabuleiro mostram "Sem par".
           Isso evita que duas cartas mostrem palavras de pares diferentes
           ao mesmo tempo, o que dava a impressão de estar "errado". */

        function plateWord(card) {
            if (!equalMeaningsMode) return cardWord(card);

            const { iguais, semelhantes } = computeMeaningMatches();
            const groups = [...iguais, ...semelhantes];

            if (groups.length === 0) return 'Sem par';

            const group = groups[meaningIndex % groups.length];
            return group.cards.includes(card.name) ? group.label : 'Sem par';
        }

        function cycleOrEnableEqualMeanings() {
            if (!equalMeaningsMode) {
                // Primeiro clique: ativa o modo e mostra o primeiro grupo de significados em comum
                equalMeaningsMode = true;
                meaningIndex = 0;
            } else {
                // Cliques seguintes (com o modo já ativo): avança para o próximo grupo
                // de significado em comum (igual ou semelhante) presente no tabuleiro.
                meaningIndex++;
            }
            renderPracticeBoard();
            updateEqualMeaningsButtonUI();
        }

        function updateEqualMeaningsButtonUI() {
            const btn = document.getElementById('equalMeaningsBtn');
            if (!btn) return;
            if (equalMeaningsMode) {
                btn.classList.add('pill-active');
                btn.classList.remove('bg-app-surface', 'border', 'border-app-secondary/30');
            } else {
                btn.classList.remove('pill-active');
                btn.classList.add('bg-app-surface', 'border', 'border-app-secondary/30');
            }
        }

        function shuffleArr(arr) { let a=[...arr],c=a.length,r; while(c!==0){ r=Math.floor(Math.random()*c); c--; [a[c],a[r]]=[a[r],a[c]]; } return a; }

        function openPractice() {
            openGameModal(false);
        }

        /* ============================================================
           MODO QUIZ
           Mostra uma carta aleatória do deck escolhido e 5 possíveis
           significados (1 correto, 4 de outras cartas). O jogador
           escolhe; a opção clicada fica verde+"Correto" ou
           vermelho+"Errado" (e, se errar, a opção certa também é
           destacada em verde para aprendizado).
           ============================================================ */

        let quizCurrentCard = null;
        let quizOptions = [];
        let quizAnswered = false;
        let quizAttempt = 0; // 0 = ainda não errou nessa pergunta; 1 = já errou uma vez (segunda e última chance)
        let quizAdvanceTimer = null;
        let quizBag = []; // "baralho" embaralhado: garante que toda carta apareça uma vez antes de repetir

        function openQuiz() {
            deckModalPurpose = 'quiz';
            openDeckModal();
        }

        function openQuizModal() {
            document.getElementById('quizModal').classList.remove('hidden');
            document.getElementById('quizModal').classList.add('flex');
            quizBag = []; // começa uma nova "sacola" embaralhada a cada entrada no quiz
            quizNextCard();
        }

        function closeQuizModal() {
            document.getElementById('quizModal').classList.add('hidden');
            document.getElementById('quizModal').classList.remove('flex');
        }

        // Sistema de "sacola" (bag randomizer): embaralha as 78 cartas e vai
        // distribuindo uma a uma sem repetir nenhuma, até a sacola esvaziar —
        // aí embaralha de novo. Isso evita repetições seguidas de uma mesma
        // carta em pouco tempo, coisa que pode acontecer com Math.random() puro.
        function quizDrawFromBag() {
            if (quizBag.length === 0) quizBag = shuffleArr(rawData);
            let card = quizBag.shift();
            // Evita repetir a MESMA carta que acabou de aparecer, se possível
            if (quizCurrentCard && card.name === quizCurrentCard.name && quizBag.length > 0) {
                quizBag.push(card);
                card = quizBag.shift();
            }
            return card;
        }

        // Monta as 5 opções de resposta para uma carta: 1 significado
        // verdadeiro dela + 4 significados de OUTRAS cartas, cuidando pra
        // não repetir uma palavra que também pertença à carta certa
        // (evitando mais de uma resposta "correta" por coincidência).
        function quizBuildOptions(card) {
            const ownWords = getCardMeaningWords(card);
            const ownKeys = [...ownWords.keys()];
            if (ownKeys.length === 0) return null;

            const correctKey = ownKeys[Math.floor(Math.random() * ownKeys.length)];
            const correctWord = ownWords.get(correctKey);

            const usedKeys = new Set([correctKey]);
            const distractors = [];
            const otherCards = shuffleArr(rawData.filter(c => c.name !== card.name));

            for (const oc of otherCards) {
                if (distractors.length >= 4) break;
                const words = getCardMeaningWords(oc);
                const keys = shuffleArr([...words.keys()]);
                for (const k of keys) {
                    if (!ownWords.has(k) && !usedKeys.has(k)) {
                        distractors.push(words.get(k));
                        usedKeys.add(k);
                        break;
                    }
                }
            }
            if (distractors.length < 4) return null; // sem opções suficientes, tenta outra carta

            return shuffleArr([
                { word: correctWord, correct: true },
                ...distractors.map(w => ({ word: w, correct: false }))
            ]);
        }

        function quizNextCard() {
            if (quizAdvanceTimer) { clearTimeout(quizAdvanceTimer); quizAdvanceTimer = null; }

            let card, options, attempts = 0;
            do {
                card = quizDrawFromBag();
                options = quizBuildOptions(card);
                attempts++;
            } while (!options && attempts < 15);

            quizCurrentCard = card;
            quizOptions = options || [];
            quizAnswered = false;
            quizAttempt = 0;
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizCardImg').src = cardImg(quizCurrentCard);
            document.getElementById('quizCardName').innerText = quizCurrentCard.name;
            const wrap = document.getElementById('quizOptionsWrap');
            wrap.innerHTML = quizOptions.map((opt, i) => `
                <button id="quizOpt-${i}" onclick="quizAnswer(${i})" class="quiz-option">
                    <span>${opt.word}</span>
                    <span id="quizOptFeedback-${i}" class="quiz-feedback"></span>
                </button>
            `).join('');
        }

        // Trava as opções (impedindo mais cliques) e escurece as que não são
        // destaque, mantendo visíveis só os índices passados em highlightIdx.
        function quizLockOptions(...highlightIdx) {
            quizOptions.forEach((_, idx) => {
                const btn = document.getElementById('quizOpt-' + idx);
                btn.classList.add('quiz-disabled');
                if (!highlightIdx.includes(idx)) btn.classList.add('quiz-dim');
            });
        }

        function quizAnswer(i) {
            if (quizAnswered) return;

            const chosen = quizOptions[i];
            const chosenBtn = document.getElementById('quizOpt-' + i);
            const chosenFeedback = document.getElementById('quizOptFeedback-' + i);

            if (chosen.correct) {
                // Acertou: trava tudo, mostra "Correto" e já avança pro próximo
                // arcano aleatório automaticamente.
                quizAnswered = true;
                chosenBtn.classList.add('quiz-correct');
                chosenFeedback.innerText = 'Correto';
                quizLockOptions(i);
                quizAdvanceTimer = setTimeout(quizNextCard, 1100);
                return;
            }

            // Errou: essa opção específica fica vermelha e sai de jogo
            chosenBtn.classList.add('quiz-wrong', 'quiz-disabled');
            chosenFeedback.innerText = 'Errado';

            if (quizAttempt === 0) {
                // Primeira tentativa errada: dá mais uma chance — as outras
                // opções continuam clicáveis, não revela a resposta certa ainda.
                quizAttempt = 1;
            } else {
                // Segunda tentativa errada: revela a resposta certa em AZUL,
                // trava tudo e espera o usuário trocar de carta manualmente.
                quizAnswered = true;
                const correctIndex = quizOptions.findIndex(o => o.correct);
                const correctBtn = document.getElementById('quizOpt-' + correctIndex);
                const correctFeedback = document.getElementById('quizOptFeedback-' + correctIndex);
                correctBtn.classList.add('quiz-reveal');
                correctFeedback.innerText = 'Correta';
                quizLockOptions(i, correctIndex);
            }
        }

        function openPracticeModal() {
            document.getElementById('practiceModal').classList.remove('hidden');
            document.getElementById('practiceModal').classList.add('flex');
            document.getElementById('practiceGameName').innerText = GAMES[currentGameKey].label;
            practiceReset();
        }
        function closePractice() {
            document.getElementById('practiceModal').classList.add('hidden');
            document.getElementById('practiceModal').classList.remove('flex');
            closeShuffle(); closeChoosePanel(); closeSlotAction();
        }

        function practiceReset() {
            practiceState = freshPracticeState();
            meaningIndex = 0;
            equalMeaningsMode = false;
            updateEqualMeaningsButtonUI();
            renderPracticeBoard();
            autoContinue();
        }

        function practiceRandomAll() {
            closeShuffle(); closeChoosePanel(); closeSlotAction();
            document.getElementById('practiceBoard').classList.remove('selecting');
            const majors = shuffleArr(rawData.filter(c => c.type === 'maior'));
            const minors = shuffleArr(rawData.filter(c => c.type === 'menor'));
            houseOrder.forEach((h, i) => { practiceState[h].maior = majors[i]; practiceState[h].menor = minors[i]; });
            renderPracticeBoard();
        }

        function firstUnfilled(tipo) { for (let i=0;i<houseOrder.length;i++) if (!practiceState[houseOrder[i]][tipo]) return i; return -1; }

        // Nova lógica: embaralha por lote (Maiores todos de uma vez, depois Menores todos de uma vez)
        function autoContinue() {
            let idxM = firstUnfilled('maior');
            if (idxM !== -1) { startShuffleBatch('maior'); return; }
            let idxN = firstUnfilled('menor');
            if (idxN !== -1) { startShuffleBatch('menor'); return; }
        }

        // Quantos "pares" (maior+menor) aparecem lado a lado na linha mais larga de cada jogo —
        // usado para calcular o maior tamanho de carta que cabe na LARGURA do container.
        const GAME_WIDEST_ROW_PAIRS = { dupla: 1, csmd: 1, ta: 3, davi: 3, peladan: 3 };
        // Quantas "linhas" de casas ficam empilhadas verticalmente — usado para calcular
        // o maior tamanho de carta que cabe na ALTURA disponível (sem precisar rolar a página).
        const GAME_VERTICAL_ROWS = { dupla: 1, csmd: 2, ta: 3, davi: 3, peladan: 3 };
        // Limite máximo de largura da carta (px), só pra não ficarem enormes em telas largas.
        const GAME_MAX_SLOT_WIDTH = { dupla: 200, csmd: 190, ta: 175, davi: 175, peladan: 185 };
        let currentWidestPairs = 1;
        let currentVerticalRows = 1;
        let currentSlotMaxWidth = 150;

        // Calcula quanta altura sobra pro tabuleiro, considerando cabeçalho, botões fixos
        // de baixo e (se estiver no modo de sorteio/escolha) o painel que abre por cima.
        function getPracticeAvailableHeight() {
            const wrap = document.getElementById('practiceScrollWrap');
            const header = document.getElementById('practiceHeader');
            if (!wrap || !header) return window.innerHeight * 0.4;
            const wrapH = wrap.clientHeight;
            const headerH = header.offsetHeight;
            const bottomButtonsSpace = 100; // altura aprox. dos botões fixos (Resetar/Significado) + respiro
            let reserved = headerH + 16 /* mb-4 */ + bottomButtonsSpace;

            const board = document.getElementById('practiceBoard');
            if (board.classList.contains('selecting')) {
                const shufflePanel = document.getElementById('shufflePanel');
                const choosePanel = document.getElementById('choosePanel');
                let panelH = 0;
                if (shufflePanel && !shufflePanel.classList.contains('hidden')) panelH = shufflePanel.offsetHeight;
                else if (choosePanel && !choosePanel.classList.contains('hidden')) panelH = choosePanel.offsetHeight;
                if (!panelH) panelH = window.innerHeight * 0.42; // estimativa antes do painel terminar de renderizar
                reserved += panelH;
            }
            return Math.max(70, wrapH - reserved);
        }

        function computeSlotWidth(pairsInWidestRow, verticalRows, maxWidth) {
            const board = document.getElementById('practiceBoard');
            const containerWidth = board.clientWidth || 320;
            const gapBetweenGroups = 8; // gap entre colunas/pares na linha mais larga
            // O CSS real (.house-pair) usa gap: calc(var(--hs-w) * 0.08), ou seja, o gap
            // depende da PRÓPRIA largura final da carta, não de maxWidth. Por isso resolvemos
            // a equação já considerando esse gap proporcional: pairsInWidestRow*(2w + 0.08w) + gapsEntrePares = containerWidth
            const gapFactor = 0.08;
            const totalGapsBetweenGroups = (pairsInWidestRow - 1) * gapBetweenGroups;
            const widthFromWidth = Math.floor((containerWidth - totalGapsBetweenGroups - 2) / (pairsInWidestRow * (2 + gapFactor)));

            const availableHeight = getPracticeAvailableHeight();
            const rowGap = 10; // aprox. gap vertical entre linhas de casas
            const rowOverhead = 20; // aprox. altura do título da casa + margem
            const heightPerRow = Math.max(24, (availableHeight - (verticalRows - 1) * rowGap) / verticalRows - rowOverhead);
            const widthFromHeight = Math.floor(heightPerRow * 0.62);

            return Math.max(20, Math.min(widthFromWidth, widthFromHeight, maxWidth));
        }

        function applySlotWidth() {
            if (currentGameKey === 'scr') return;
            const board = document.getElementById('practiceBoard');
            const w = computeSlotWidth(currentWidestPairs, currentVerticalRows, currentSlotMaxWidth);
            board.style.setProperty('--hs-w', w + 'px');
            // Define a altura explicitamente também (em vez de depender só do
            // aspect-ratio do CSS). Alguns navegadores mobile não resolvem bem o
            // aspect-ratio quando o item está dentro de um flex row (mesmo com
            // align-items:flex-start), então calculamos a altura aqui e a
            // aplicamos direto — isso elimina qualquer ambiguidade e garante que
            // o card nunca fique achatado, independente do motor de renderização.
            board.style.setProperty('--hs-h', Math.round(w / 0.62) + 'px');
        }

        window.addEventListener('resize', () => {
            const modal = document.getElementById('practiceModal');
            if (modal && !modal.classList.contains('hidden')) scheduleSlotSizeUpdate();
        });

        /* =========================================================================
           SISTEMA DE DIMENSIONAMENTO CENTRALIZADO (fonte única de verdade)
           ---------------------------------------------------------------------
           Problema original: várias funções (startShuffleBatch, startShuffleSingle,
           openChoosePanel, closeShuffle, closeChoosePanel, etc.) mexiam manualmente
           na classe "selecting" do tabuleiro E chamavam applySlotWidth()/RAF na
           ordem "certa" — mas bastava uma dessincronia de timing (troca rápida de
           carta, painel fechando enquanto outro abre, etc.) para a classe
           "selecting" ficar "presa" ou o cálculo de largura rodar com o painel
           ainda contando como aberto, deixando as cartas finas/compactadas mesmo
           depois de tudo revelado.

           Agora "selecting" deixa de ser setada manualmente em cada função: ela é
           SEMPRE derivada do estado real de visibilidade dos painéis (é isso que
           importa, não uma variável espalhada pelo código). E o recálculo de
           largura roda via observers que reagem a qualquer mudança real no DOM,
           então mesmo que uma função esqueça de chamar algo, o layout se
           autocorrige nos próximos frames. ========================================= */

        let _slotSizeRAF = null;
        let _slotSizeFallbackTimer = null;
        function scheduleSlotSizeUpdate() {
            if (_slotSizeRAF) cancelAnimationFrame(_slotSizeRAF);
            if (_slotSizeFallbackTimer) clearTimeout(_slotSizeFallbackTimer);
            // Duplo requestAnimationFrame: espera o layout (classe/innerHTML) assentar
            // antes de medir, evitando ler dimensões "no meio" de uma mudança de DOM.
            _slotSizeRAF = requestAnimationFrame(() => {
                _slotSizeRAF = requestAnimationFrame(() => {
                    _slotSizeRAF = null;
                    applySlotWidth();
                });
            });
            // Fallback extra baseado em tempo (não só em frames): alguns navegadores
            // mobile atrasam o layout de transições/CSS além de dois requestAnimationFrame.
            // Recalcula de novo depois que qualquer transição (.2s/.3s) já deve ter terminado,
            // pra garantir que nada fique "preso" num tamanho errado.
            _slotSizeFallbackTimer = setTimeout(() => {
                _slotSizeFallbackTimer = null;
                applySlotWidth();
            }, 350);
        }

        // Deriva a classe "selecting" do estado REAL dos painéis (não de uma flag
        // manual). Chamar isso em vez de mexer em classList.add/remove('selecting')
        // diretamente garante que o tabuleiro nunca fique "preso" num tamanho errado.
        function syncSelectingState() {
            const board = document.getElementById('practiceBoard');
            if (!board) return;
            const shufflePanel = document.getElementById('shufflePanel');
            const choosePanel = document.getElementById('choosePanel');
            const panelOpen = (shufflePanel && !shufflePanel.classList.contains('hidden')) ||
                               (choosePanel && !choosePanel.classList.contains('hidden'));
            board.classList.toggle('selecting', !!panelOpen);
            scheduleSlotSizeUpdate();
        }

        // Rede de segurança: observa os dois painéis e o próprio tabuleiro. Qualquer
        // mudança de classe/conteúdo dispara uma resincronização automática, então
        // o bug não pode mais "escapar" por causa de uma função que chamou as coisas
        // fora de ordem.
        (function setupSlotSizingObservers() {
            const board = document.getElementById('practiceBoard');
            const shufflePanel = document.getElementById('shufflePanel');
            const choosePanel = document.getElementById('choosePanel');
            const wrap = document.getElementById('practiceScrollWrap');
            if (!board) return;

            const mo = new MutationObserver(() => syncSelectingState());
            if (shufflePanel) mo.observe(shufflePanel, { attributes: true, attributeFilter: ['class'] });
            if (choosePanel) mo.observe(choosePanel, { attributes: true, attributeFilter: ['class'] });

            const boardMo = new MutationObserver(() => scheduleSlotSizeUpdate());
            boardMo.observe(board, { childList: true, subtree: false });

            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => scheduleSlotSizeUpdate());
                ro.observe(board);
                if (wrap) ro.observe(wrap);
            }
        })();

            currentWidestPairs = GAME_WIDEST_ROW_PAIRS[currentGameKey] || 1;

/* ============================================================
   SIGNIFICADOS IGUAIS — comparação de palavras-chave entre as
   cartas presentes no tabuleiro do modo de praticar leitura.
   Trabalha apenas com PALAVRA ÚNICA (nunca frases/textos):
     - "Iguais": mesma palavra-chave (ignorando acentos/maiúsculas)
       aparecendo em 2+ cartas do tabuleiro.
     - "Semelhantes": cartas do tabuleiro que pertencem ao mesmo
       grupo de significado (MANUAL_MEANING_GROUPS), mesmo que a
       palavra exata usada em cada carta seja diferente.
   ============================================================ */

function normalizeWord(s) {
    return s
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/[.,;:!?]+$/g, '');
}

// Retorna o conjunto de palavras-chave de UMA palavra só (sem espaço)
// associadas a uma carta, combinando 3 fontes:
//  1) customPlateWords (palavras curtas cadastradas manualmente)
//  2) extractEssenceWords (palavras da linha "Essência" do Núcleo)
//  3) CARD_SINGLE_WORDS (extraídas do documento de estudo, arcanos menores)
function getCardMeaningWords(card) {
    const out = new Map(); // normalizado -> forma de exibição

    const addIfSingleWord = (w) => {
        if (!w) return;
        const trimmed = w.trim();
        if (!trimmed) return;
        if (/\s/.test(trimmed)) return; // ignora frases/textos com espaço
        const key = normalizeWord(trimmed);
        if (key.length < 3) return;
        if (!out.has(key)) out.set(key, trimmed);
    };

    const custom = customPlateWords[card.name];
    if (custom) custom.split(',').forEach(addIfSingleWord);

    extractEssenceWords(card).forEach(addIfSingleWord);

    const docWords = CARD_SINGLE_WORDS[card.name];
    if (docWords) docWords.forEach(addIfSingleWord);

    return out; // Map: normalizado -> exibição
}

// Coleta todas as cartas atualmente presentes no tabuleiro de treino
// (maiores e menores, em todas as casas preenchidas).
function getBoardCards() {
    const cards = [];
    houseOrder.forEach(h => {
        const slot = practiceState[h];
        if (!slot) return;
        if (slot.maior) cards.push({ house: h, tipo: 'maior', card: slot.maior });
        if (slot.menor) cards.push({ house: h, tipo: 'menor', card: slot.menor });
    });
    return cards;
}

function computeMeaningMatches() {
    const boardEntries = getBoardCards();

    // ---- Iguais: palavra normalizada -> lista de {cardName, display} ----
    const wordMap = new Map();
    boardEntries.forEach(({ card }) => {
        const words = getCardMeaningWords(card);
        words.forEach((display, key) => {
            if (!wordMap.has(key)) wordMap.set(key, { display, cards: new Set() });
            wordMap.get(key).cards.add(card.name);
        });
    });
    const iguais = [...wordMap.values()]
        .filter(v => v.cards.size >= 2)
        .map(v => ({ label: v.display, cards: [...v.cards] }))
        .sort((a, b) => b.cards.length - a.cards.length);

    // ---- Semelhantes: grupos manuais com 2+ cartas presentes no tabuleiro ----
    const boardNames = new Set(boardEntries.map(e => e.card.name));
    const semelhantes = MANUAL_MEANING_GROUPS
        .map(g => ({ label: g.label, cards: g.cards.filter(c => boardNames.has(c)) }))
        .filter(g => g.cards.length >= 2);

    return { iguais, semelhantes, hasCards: boardEntries.length > 0 };
}

function meaningMatchGroupHtml(label, cards, iconClass) {
    return `
        <div class="border border-app-secondary/30 rounded-2xl p-4 mb-3 bg-[#171033]">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas ${iconClass} text-app-primary text-xs"></i>
                <span class="text-white font-semibold text-sm">${label}</span>
            </div>
            <div class="flex flex-wrap gap-1.5">
                ${cards.map(c => `<span class="px-2.5 py-1 rounded-full bg-app-card border border-app-secondary/30 text-app-textMuted text-[0.65rem]">${c}</span>`).join('')}
            </div>
        </div>
    `;
}

function openMeaningMatches() {
    const { iguais, semelhantes, hasCards } = computeMeaningMatches();
    const body = document.getElementById('meaningMatchBody');

    if (!hasCards) {
        body.innerHTML = `<div class="text-center py-10 text-app-textMuted"><i class="fas fa-moon text-2xl mb-3 opacity-40"></i><p class="text-sm">Preencha o tabuleiro com cartas para comparar os significados.</p></div>`;
    } else if (iguais.length === 0 && semelhantes.length === 0) {
        body.innerHTML = `<div class="text-center py-10 text-app-textMuted"><i class="fas fa-moon text-2xl mb-3 opacity-40"></i><p class="text-sm">Nenhum significado igual ou semelhante encontrado entre as cartas deste tabuleiro.</p></div>`;
    } else {
        let html = '';
        if (iguais.length > 0) {
            html += `<h4 class="text-app-primary font-cinzel font-bold text-xs tracking-widest uppercase mb-2">Iguais</h4>`;
            html += iguais.map(g => meaningMatchGroupHtml(g.label, g.cards, 'fa-equals')).join('');
        }
        if (semelhantes.length > 0) {
            html += `<h4 class="text-app-primary font-cinzel font-bold text-xs tracking-widest uppercase mb-2 mt-4">Semelhantes</h4>`;
            html += semelhantes.map(g => meaningMatchGroupHtml(g.label, g.cards, 'fa-code-compare')).join('');
        }
        body.innerHTML = html;
    }

    const modal = document.getElementById('meaningMatchModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeMeaningMatches() {
    const modal = document.getElementById('meaningMatchModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}
