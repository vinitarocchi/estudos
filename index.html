            }},
            { name: "Rei de Copas", type: "menor", number: "Rei", imgUrl: `${baseUrl}CC4K.jpg`, sections: {
                "Núcleo": "• Essência: Agradar, dramatizar, intuir, dominar.<br>• Definição: Representa a autoridade masculina carismática, gentil e hedonista que busca o prazer e o bem-estar acima de qualquer obrigação. É o diplomata fofo por conveniência que encanta e bajula para ser bem-visto, utilizando sua profunda intuição e traquejo social para construir uma imagem de influência, embora seja mimado e incapaz de suportar o \"não\".<br>• Advertência: Cuidado com o egoísmo disfarçado de fofura e com a tendência a abandonar cenários assim que o prazer é suprimido; sua falta de permanência e a facilidade com que rompe compromissos quando se sente contrariado podem torná-lo uma figura pouco confiável e corruptível perante a lei e as relações de longo prazo.",
                "Atributo básico": "• Material: Fase de sucesso profissional obtido através de uma rede de contatos influentes e de uma diplomacia fina que soluciona problemas por vias de conversas e negociações. O consultor atua como um mestre da imagem social, agindo com cordialidade e calor humano para atrair investimentos e favores, resultando em um progresso financeiro constante, embora possa ser tentado por caminhos corruptíveis se o ganho pessoal for maior que a ética.<br>• Mental: Mentalidade idealista, intuitiva e dotada de um traquejo social que permite convencer a todos através do carisma e da gentileza. O indivíduo expressa-se de forma dramática e poética, romantizando inclusive os cenários de esforço intelectual, agindo com uma agilidade mental que busca sempre o prazer de ser admirado, sentindo-se seguro ao liderar pelo afeto, embora sofra profundamente quando sua vaidade absoluta é ferida ou ignorada.<br>• Sentimental: No campo afetivo, reflete um relacionamento marcado por bajulações, cantadas e por uma necessidade constante de ser aplaudido e cuidado pelo parceiro. Existe uma química intensa e uma fidelidade baseada na reciprocidade do prazer, onde o homem é fofo e romântico apenas enquanto o cenário lhe agrada, abandonando o vínculo rapidamente se houver irritabilidade ou se ele deixar de ser o centro das atenções.<br>• Espiritual: Momento de espiritualidade profunda e intuitiva, onde a alma se joga nos propósitos de fé com paixão e carisma. O consulente possui uma grande capacidade de harmonizar ambientes espirituais e de atuar como um conselheiro inspirador, vivenciando uma conexão mística que valoriza a beleza dos rituais e o bem-estar espiritual, permitindo que a luz divina se manifeste através de sua sensibilidade refinada.",
                "Atributo diverso": "• Negativo: Indica a falta de compromisso e a traição de acordos em nome de um novo prazer momentâneo, revelando um caráter inconstante e manipulador. Representa uma fase de vitimismo dramático onde a pessoa se torna mimada e birrenta por não ser contrariada, resultando no abandono de responsabilidades vitais e na perda de influência social por sua óbvia falta de honestidade e de lealdade real.<br>• Obstáculo: Ocorre pelo excesso de hedonismo e pela obsessão em manter a própria imagem de \"bonzinho\" a qualquer custo, o que leva à hipocrisia e à falta de integridade. A pessoa pode se perder em dramatizações inúteis para atrair atenção e tornar-se escrava da bajulação alheia, negligenciando as obrigações práticas e os sentimentos reais dos outros por estar excessivamente focada no próprio umbigo e na sua vaidade doentia.<br>• Orientação/conselho: Confie plenamente em sua intuição, aja com gentileza extrema e utilize seu carisma para conquistar o que deseja de forma diplomática neste momento. Busque seu próprio prazer e satisfação pessoal, seja o centro das atenções com elegância, procure cenários que tragam bem-estar ao seu ego e entenda que o seu traquejo social e a sua capacidade de agradar são as chaves para abrir as portas que você deseja."
            }},
            { name: "Ás de Paus", type: "menor", number: "As", imgUrl: `${baseUrl}W01.jpg`, sections: {
                "Núcleo": "• Essência: Iniciar, explodir, ousar, expandir.<br>• Definição: Representa a potência máxima de vontade e energia criativa concentrada. É o arcano dos caminhos abertos, da sorte por meritocracia e das grandes oportunidades que exigem ação imediata e engajamento honesto para se transformarem em sucesso absoluto e crescimento em todos os níveis da vida.<br>• Advertência: Não desperdice este clímax de força com impulsividade cega ou falta de consciência; embora você tenha todas as condições para vencer, a realização ainda exige que você faça por onde, lute com determinação e mantenha o entendimento correto do que está sendo vivido para não queimar etapas.",
                "Atributo básico": "• Material: Fase de abertura total de caminhos profissionais com lucros que rendem e investimentos extremamente férteis. O consultor sente-se motivado a empreender e batalhar, colhendo o sucesso planejado através de um esforço recompensado e de uma produtividade inigualável, resultando em bons negócios e na materialização de projetos que trazem prosperidade e uma nova dinâmica financeira muito vigorosa para sua carreira.<br>• Mental: Mentalidade de autoconfiança absoluta e inteligência brilhante, focada na criação de novas ideias e na descoberta de soluções audaciosas. O indivíduo expressa-se com coragem e clareza, possuindo um entendimento correto da realidade e uma vontade inabalável de fazer acontecer, agindo com um dinamismo intelectual que impulsiona a todos ao seu redor e garante a vitória através da sua capacidade de articular planos.<br>• Sentimental: No campo afetivo, indica uma explosão de paixão intensa e um início de relacionamento marcado pelo entusiasmo e pela química sexual vigorosa. Existe um compromisso honesto e uma energia absoluta que motiva o casal a renascer em um novo padrão de vida, trazendo alegria, virilidade e uma sensação de pureza e verdade que fortalece os vínculos e abre o futuro.<br>• Espiritual: Momento de grande potência mística e ativação do canal mediúnico com pureza e intuição aguçada. A alma vivencia um ritual de passagem significativo, sentindo um influxo de força vital que permite mudar padrões antigos e renascer para uma nova consciência espiritual, exigindo foco e a canalização correta dessa energia absoluta para realizar seus propósitos superiores com sucesso total.",
                "Atributo diverso": "• Negativo: Indica a perda de uma oportunidade única por falta de iniciativa ou o esgotamento precoce de uma energia que não teve base para se sustentar. Representa um início de projeto que \"flopou\" por falta de mérito ou engajamento real, resultando em uma estagnação frustrante onde a vontade existe, mas não consegue se materializar devido ao medo de ousar ou ao desânimo.<br>• Obstáculo: Ocorre pelo excesso de impulsividade e arrogância, onde a pessoa acredita ser tão poderosa que ignora as leis e os limites do ambiente. Essa explosão de força descontrolada pode gerar conflitos agressivos e a destruição de pontes importantes, fazendo com que o consulente se perca em um \"fogo de palha\" que consome recursos sem gerar frutos duradouros ou respeito alheio.<br>• Orientação/conselho: Lute com todas as suas forças, batalhe pelo que deseja com coragem e invente novas formas de atingir seus objetivos agora. Descubra seus talentos ocultos, empreenda com confiança absoluta, siga fielmente sua intuição e seja impulsivo na medida certa para aproveitar as portas que o destino está abrindo para você, entendendo que a vitória depende do seu esforço."
            }},
            { name: "Dois de Paus", type: "menor", number: "2", imgUrl: `${baseUrl}W02.jpg`, sections: {
                "Núcleo": "• Essência: Empacar, adiar, revisar, duvidar.<br>• Definição: Indica um momento de impasse e neutralidade forçada onde o consulente, embora deseje avançar, sente-se paralisado por imprevistos de terceiros ou por uma dúvida interna. É a fase da reavaliação necessária, onde o sucesso do Ás exige uma pausa para ajustar a vida antes de seguir para o novo.<br>• Advertência: Cuidado com a postura de \"isentão\" e com a falta de comprometimento que podem levar à perda de oportunidades valiosas por pura desconfiança; embora o adiamento sirva para protegê-lo de situações estressantes, a procrastinação excessiva pode fazer com que você perca o entusiasmo e o tempo correto de agir definitivamente.",
                "Atributo básico": "• Material: Fase de estagnação temporária no trabalho e nas finanças, marcada por acordos e promessas que não são cumpridos no tempo esperado devido a fatores externos fora do controle do consultor. Há a necessidade de revisar planilhas e projetos, aceitando o atraso como uma ferramenta de ajustamento para evitar preju সুইস maiores, enquanto se lida com a falta de entusiasmo em buscar novos investimentos imediatos.<br>• Mental: Mentalidade mergulhada na dúvida existencial entre manter o que já conquistou ou arriscar o avanço para o desconhecido. O indivíduo expressa-se com neutralidade e falta de foco, tentando não se comprometer com nenhum lado da questão, o que gera um desgaste intelectual e insônia por estresse, exigindo que ele pare momentaneamente para analisar friamente se o próximo passo realmente vale a pena.<br>• Sentimental: No campo afetivo, reflete uma fase de desinteresse e de \"não sair do lugar\", onde o relacionamento não avança nem termina por puro impasse emocional. Existe uma desconfiança sobre a sinceridade das propostas recebidas e uma hesitação em se entregar totalmente ao novo, resultando em um clima de mornidão e falta de paixão onde ambos os parceiros evitam tomar decisões definitivas.<br>• Espiritual: Momento de suspensão mística necessária para reequilibrar as energias e evitar \"cagadas\" espirituais causadas pela pressa. O universo impõe um bloqueio momentâneo para livrar o consulente de influências negativas ou estressantes, funcionando como uma proteção divina que exige paciência e o entendimento de que tudo virá no tempo certo se houver uma reflexão honesta sobre as verdadeiras intenções da alma.",
                "Atributo diverso": "• Negativo: Indica o fim do impasse e a retomada súbita do movimento, onde a dúvida é dissipada por uma decisão firme e corajosa de avançar. Representa o momento em que o consultor decide finalmente assumir um lado e se comprometer com o projeto, abandonando a neutralidade para abraçar as mudanças com entusiasmo, permitindo que a vida flua novamente de forma rápida e produtiva para seus interesses.<br>• Obstáculo: Ocorre pelo excesso de cautela e pela obsessão em analisar todos os riscos, o que acaba gerando uma paralisia crônica e medrosa. A pessoa torna-se tão \"isentona\" e desconfiada que afasta aliados importantes e perde o bonde da história, ficando presa em um círculo vicioso de reavaliações infinitas que não levam a lugar algum e consomem sua energia vital e criativa.<br>• Orientação/conselho: Pare imediatamente suas atividades frenéticas, revise minuciosamente seus planos e reflita se o caminho escolhido é realmente saudável para você agora. Analise todas as variáveis com paciência, espere o momento oportuno para agir, não se comprometa com nada que gere dúvida e entenda que o silêncio e o adiamento são seus melhores aliados para evitar erros graves."
            }},
            { name: "Três de Paus", type: "menor", number: "3", imgUrl: `${baseUrl}W03.jpg`, sections: {
                "Núcleo": "• Essência: Visionar, expandir, projetar, iniciar.<br>• Definição: Representa a virada de página e a conquista de novos territórios (físicos ou intelectuais) através de uma mente aberta e exploradora. É o arcano do planejamento a longo prazo e do empreendedorismo, onde o consulente já pesquisou, estudou e agora coloca as bases sólidas para o sucesso futuro.<br>• Advertência: Não fique apenas olhando para o horizonte sem colocar as mãos na massa de forma prática; embora a visão seja grandiosa e a autoconfiança esteja alta, o caminho de trabalho para atingir o objetivo final ainda é longo e exige resiliência para superar as amarguras passadas e manter o progresso constante.",
                "Atributo básico": "• Material: Fase de grande expansão profissional e financeira, marcada pelo início de carreiras, faculdades ou projetos que visam resultados duradouros no futuro. O consultor demonstra habilidade em negociar e realizar intercâmbios lucrativos, agindo de forma pragmática e audaciosa para ampliar seus horizontes econômicos, contando com o apoio do círculo social e de parcerias externas que favorecem o crescimento sólido de seus negócios.<br>• Mental: Mentalidade visionária e aberta para novas ideias, focada no estudo minucioso e na análise estratégica de oportunidades de mercado. O indivíduo expressa-se com clareza e franqueza, comunicando seus planos de forma fluida e buscando sempre a inovação intelectual, agindo com uma autoconfiança que o permite virar a página das incertezas passadas e focar totalmente na execução prática de suas metas ambiciosas.<br>• Sentimental: No campo afetivo, indica um interesse real em construir um futuro a dois, com propostas de casamento ou compromissos sérios que visam o longo prazo. Existe um sentimento de companheirismo e a disposição para superar mágoas antigas, onde o parceiro demonstra boas intenções e o desejo de explorar novos cenários emocionais juntos, trazendo uma satisfação equilibrada e uma promessa de felicidade duradoura.<br>• Espiritual: Momento de progresso e renovação mística, onde a alma se sente livre para explorar novos conhecimentos e caminhos de fé. Há uma superação de bloqueios passados através do perdão e da resiliência, permitindo que o consulente visione sua trajetória espiritual com clareza e receba ajuda externa para consolidar sua base mística, sentindo-se amparado para avançar em direção à sua evolução superior.",
                "Atributo diverso": "• Negativo: Indica a falta de visão futura e a incapacidade de sair da zona de conforto por medo do desconhecido ou por apego a amarguras passadas. Representa o fracasso de projetos que não tiveram um planejamento sólido, onde a pessoa fica presa em ideias curtas e sem perspectiva, resultando em uma estagnação frustrante que impede o aproveitamento das oportunidades de intercâmbio e crescimento que a vida oferece.<br>• Obstáculo: Ocorre pelo excesso de idealismo e pela mania de projetar tudo para um futuro distante, negligenciando as necessidades e ações do presente. A pessoa pode se perder em especulações e planos mirabolantes sem nunca concretizar nada de fato, tornando-se uma \"eterna visionária\" que gasta energia em viagens mentais enquanto a realidade concreta ao seu redor se deteriora por falta de atitudes práticas.<br>• Orientação/conselho: Dê o devido valor ao que você já possui, mas não pare de olhar para o horizonte em busca de novas oportunidades e inovações para o seu projeto. Especule, crie novas soluções, abra-se para o mundo, movimente suas energias em direção ao progresso e avance com determinação, entendendo que o seu sucesso futuro depende das bases sólidas que você está plantando agora."
            }},
            { name: "Quatro de Paus", type: "menor", number: "4", imgUrl: `${baseUrl}W04.jpg`, sections: {
                "Núcleo": "• Essência: Comemorar, estabilizar, harmonizar, pertencer.<br>• Definição: Representa a conclusão bem-sucedida de uma etapa importante e o regozijo coletivo em um ambiente seguro e acolhedor. É o arcano da concórdia e da paz doméstica, onde o consulente desfruta do reconhecimento de seus esforços e prepara o terreno para novas batalhas com serenidade e otimismo.<br>• Advertência: Não se acomode excessivamente na tranquilidade atual a ponto de esquecer que a jornada ainda continua; use este período de alívio e restauração de forças para organizar sua vida e \"arrumar a casa\" com zelo, evitando que a zona de conforto se torne uma barreira para os novos desafios que virão no futuro.",
                "Atributo básico": "• Material: Fase de grande sucesso profissional e estabilidade financeira, onde os esforços são devidamente reconhecidos com promoções, contratos sólidos e lucros generosos. O ambiente de trabalho é marcado pela harmonia e cooperação entre colegas, permitindo que o consultor administre as contingências com calma e sinta-se seguro e valorizado em seu meio produtivo, desfrutando de uma recompensa justa por sua dedicação anterior.<br>• Mental: Mentalidade de conciliação e clareza, focada na organização de recursos e no planejamento sereno das próximas ações. O indivíduo expressa-se com franqueza e sinceridade, agindo com uma autoconfiança que atrai a receptividade alheia, sentindo-se intelectualmente em paz e capaz de superar qualquer dificuldade mental com otimismo, preparando-se através do estudo e da preparação para novas fases de crescimento intelectual.<br>• Sentimental: No campo afetivo, reflete uma união harmoniosa e feliz, frequentemente celebrada com ritos de passagem como casamentos, noivados ou festas familiares. Existe uma reciprocidade sincera e um sentimento de pertencimento mútuo, onde o casal desfruta de momentos de lazer e tranquilidade em um ambiente doméstico acolhedor, fortalecendo os vínculos de amizade e amor através do compartilhamento genuíno da felicidade comum.<br>• Espiritual: Momento de profunda paz mística e estabilização energética, onde o consulente sente-se protegido e amparado por uma rede de energias positivas. É um período de alívio e restauração das forças espirituais, permitindo que a alma se sinta em casa e em comunhão com o sagrado, vivenciando rituais de gratidão que consolidam sua evolução e trazem uma serenidade inabalável para enfrentar os próximos ciclos de vida.",
                "Atributo diverso": "• Negativo: Indica a falta de harmonia no ambiente doméstico e o sentimento de não ser bem-vindo ou aceito nos círculos sociais e profissionais. Representa uma fase em que as comemorações são canceladas ou marcadas por tensões, onde a falta de sinceridade e a desorganização impedem a estabilização dos projetos, resultando em uma sensação de insegurança e instabilidade que drena as energias de crescimento.<br>• Obstáculo: Ocorre pelo excesso de complacência e pela tendência a ignorar problemas latentes apenas para manter uma aparência de paz e tranquilidade artificiais. A pessoa pode se tornar tão focada em festas e em \"viver o presente\" que negligencia as preparações necessárias para o futuro, ficando vulnerável a imprevistos por não ter deixado sua vida devidamente organizada e estruturada durante o período de bonança.<br>• Orientação/conselho: Compartilhe sua felicidade com as pessoas queridas, aproveite para viajar e relaxar profundamente, e comemore cada uma de suas conquistas recentes com entusiasmo. Tenha calma em suas decisões, seja paciente com o tempo das coisas, procure conciliar os interesses de todos ao seu redor e veja sempre o copo meio cheio, entendendo que a harmonia atual é o seu maior trunfo."
            }},
            { name: "Cinco de Paus", type: "menor", number: "5", imgUrl: `${baseUrl}W05.jpg`, sections: {
                "Núcleo": "• Essência: Debater, competir, desgastar, detalhar.<br>• Definição: Representa uma fase de irritações insignificantes e tensões causadas por obstáculos de pequeno porte que desviam o consulente de seus objetivos principais. É o arcano das discussões banais, da competitividade acirrada no trabalho e do esforço exaustivo sem um resultado visível imediato, marcado pela intolerância e picuinhas.<br>• Advertência: Pare de gastar sua preciosa energia tentando ter sempre a última palavra em discussões inúteis ou em detalhes irrelevantes; esse excesso de crítica e o desejo de prevalecer em debates vazios apenas geram desarmonia e cansaço, impedindo que você foque no que realmente importa para a sua evolução e sucesso real.",
                "Atributo básico": "• Material: No trabalho, indica um ambiente altamente competitivo e exaustivo, onde todos tentam mostrar que são melhores que os outros em tarefas de \"formiguinha\". Há constantes discussões por coisas banais e burocracias chatas que atrasam os projetos, resultando em um desgaste físico e financeiro sem ganhos expressivos, exigindo que o consultor arregace as mangas e lute arduamente para manter seu espaço em meio ao caos produtivo.<br>• Mental: Mentalidade obscecada por detalhes e picuinhas, marcada por uma ansiedade constante ao ver os outros em paz. O indivíduo expressa-se de forma detalhista e exigente demais, agindo com uma intolerância que o torna péssimo para trabalhar em equipe, gastando seu estofo intelectual em revisões eternas e debates construtivos, mas extremamente cansativos, que não levam a uma conclusão prática ou definitiva de pensamento.<br>• Sentimental: No campo afetivo, reflete uma fase de chatice e \"DRs\" intermináveis por motivos fúteis, como a cor da parede ou tarefas domésticas negligenciadas. Existe uma competitividade sutil onde cada um quer provar que tem razão, colocando obstáculos e defeitos na relação por pura irritação, o que gera um clima de tensão e desarmonia constante onde o amor se perde em meio a reclamações insignificantes.<br>• Espiritual: Momento de inquietação mística e falta de silêncio interior, onde a mente agitada impede a conexão profunda com o divino. Há um desgaste energético causado pela intolerância com as diferenças alheias e por conflitos de ideias religiosas sem liderança clara, exigindo que o consulente aprenda a lidar com as pequenas adversidades do ego para não se perder em uma guerra espiritual inútil e sem propósito.",
                "Atributo diverso": "• Negativo: Indica a cessação dos conflitos inúteis e o fim da fase de irritações constantes que impediam o progresso dos projetos. Representa o momento em que as partes envolvidas decidem parar de discutir por detalhes e começam a focar na solução dos problemas reais, permitindo que a harmonia retorne e que a energia vital seja canalizada para construções muito mais produtivas e gratificantes.<br>• Obstáculo: Ocorre pelo excesso de detalhismo e pela mania de colocar defeito em tudo, o que acaba paralisando as ações do grupo ou do casal. A pessoa torna-se o \"chatão do rolê\", sugando a alegria do ambiente por sua incapacidade de ser tolerante ou flexível, criando uma barreira de negatividade que afasta aliados e transforma desafios superáveis em verdadeiras montanhas de estresse e exaustão emocional.<br>• Orientação/conselho: Aceite os desafios que surgirem com disposição, seja competitivo de forma saudável e mostre sua força e coragem diante dos obstáculos diários. Tenha critério em suas ações, mas evite o detalhismo excessivo que trava o progresso; arregace as mangas e trabalhe com dedicação para superar as picuinhas, entendendo que o esforço contínuo é a única forma de vencer nesta fase de turbulências."
            }},
            { name: "Seis de Paus", type: "menor", number: "6", imgUrl: `${baseUrl}W06.jpg`, sections: {
                "Núcleo": "• Essência: Triunfar, vangloriar, reconhecer, liderar.<br>• Definição: Representa o sucesso merecido após um período de lutas, marcado pelo reconhecimento público e pelo recebimento de elogios e honrarias. É o arcano da vitória de curta duração, onde o consulente sente-se satisfeito consigo mesmo, ganhando autoconfiança e carisma para liderar o seu entorno social.<br>• Advertência: Cuidado para não cair na vanglória e no exibicionismo por conquistas pequenas ou triviais; embora você tenha mérito e os aplausos sejam justos, lembre-se de que o progresso ainda não terminou e que a manutenção do sucesso exige que você continue focado em seus objetivos maiores com humildade e perseverança.",
                "Atributo básico": "• Material: Fase de êxito profissional e financeiro com promoções, bônus e aumentos salariais como fruto direto do esforço pessoal. O consultor é reconhecido publicamente por sua competência, colhendo resultados conforme o planejado e desfrutando de um upgrade social que atrai novas oportunidades, resultando em uma estabilidade econômica momentânea, mas muito gratificante, onde todos os investimentos trazem um retorno positivo imediato e visível ao mercado.<br>• Mental: Mentalidade de autoestima elevada e otimismo contagiante, focada na autoapreciação das próprias ideias e talentos intelectuais. O indivíduo expressa-se com carisma e liderança, agindo de forma faceira e exibida ao mostrar seus conhecimentos, sentindo-se perfeitamente confiante em sua capacidade de convencer os outros e de manter a última palavra em debates, o que favorece a concretização de seus projetos intelectuais mais caros.<br>• Sentimental: No campo afetivo, indica uma fase de harmonia onde o parceiro reconhece e elogia as qualidades do consulente, trazendo um sentimento de vitória e felicidade ao casal. Existe um clima de contentamento e exibicionismo social da relação, com promessas cumpridas de ambos os lados e um carisma que atrai a admiração mútua, resultando em um vínculo fortalecido pelo mérito e pela satisfação de estarem juntos.<br>• Espiritual: Momento de restauração da fé e reconhecimento divino pelos esforços realizados no caminho da luz. O consultor sente-se como um \"vitorioso\" espiritual, recebendo proteção e boas notícias do plano astral que trazem alta hospitalar mística ou a cura de antigos males, permitindo que a alma brilhe com carisma e liderança, sendo recebida com festa e aplausos pelos guias e mentores espirituais.",
                "Atributo diverso": "• Negativo: Indica a falta de reconhecimento e a frustração de não receber os méritos devidos por um trabalho bem realizado, gerando baixa autoestima. Representa uma fase em que o sucesso é apenas aparente ou falso, onde as promessas não são cumpridas e a liderança do consulente é questionada, resultando em uma queda social ou em um sentimento de amargura por ter lutado e não ter sido valorizado.<br>• Obstáculo: Ocorre pelo excesso de orgulho e pela necessidade obsessiva de ser o centro das atenções, o que pode tornar a pessoa arrogante e cega para suas próprias falhas. A vanglória por glórias triviais afasta as pessoas e cria uma falsa sensação de segurança, impedindo que o consultor continue se esforçando para evoluir, ficando preso em um \"pódio\" imaginário que não se sustenta na realidade futura.<br>• Orientação/conselho: Mantenha o foco absoluto em seus objetivos finais e regozije-se sinceramente com as pequenas vitórias que conquistar ao longo do caminho. Mostre confiança em sua capacidade de vencer, vá atrás do seu triunfo com determinação, persevere em seus esforços e inicie seus projetos com a certeza de que você é merecedor de todos os aplausos e recompensas que estão chegando."
            }},
            { name: "Sete de Paus", type: "menor", number: "7", imgUrl: `${baseUrl}W07.jpg`, sections: {
                "Núcleo": "• Essência: Defender, perseverar, combater, destacar.<br>• Definição: Representa a luta solitária do consulente contra múltiplos oponentes ou adversidades para manter o que conquistou anteriormente. É o arcano da meritocracia completa e do foco estruturado, onde a coragem e a disciplina são as ferramentas essenciais para enfrentar boicotes, invejas e sabotagens com altivez e valentia.<br>• Advertência: Não abaixe a guarda nem se deixe intimidar pela força dos seus adversários, que podem parecer mais numerosos que você; embora o desgaste seja enorme, você possui a capacidade e a autoridade necessárias para vencer essas provas, desde que mantenha a direção firme e não se deixe abater pelos ataques injustos do entorno.",
                "Atributo básico": "• Material: Fase de intensas batalhas profissionais onde o consultor precisa defender seu cargo, status ou projetos contra opositores invejosos e sabotadores de mercado. Há um esforço hercúleo para manter a produtividade sob pressão de boicotes, exigindo uma disciplina rígida e a tomada de riscos calculados para garantir que os lucros e a reputação não sejam perdidos, resultando em uma vitória irreversível através do mérito próprio e solitário.<br>• Mental: Mentalidade de foco absoluto e controle mental férreo, voltada para a estruturação de argumentos imbatíveis diante de debates e contestações alheias. O indivíduo expressa-se com valentia e autoridade, agindo de forma solitária para beneficiar seus propósitos intelectuais, sentindo-se perfeitamente preparado para enfrentar forças maiores e para superar as armadilhas mentais impostas por terceiros mal-intencionados ou pela própria insegurança, mantendo a responsabilidade.<br>• Sentimental: No campo afetivo, reflete a necessidade de lutar pela manutenção do relacionamento diante de interferências externas ou de crises de chatice do parceiro. Existe um esforço contínuo para que as adversidades não prejudem o sentimento mútuo, exigindo que o consulente combata a inveja alheia e as fofocas com honestidade e perseverança, reafirmando seu compromisso de não desistir do vínculo amoroso mesmo sob grande pressão emocional.<br>• Espiritual: Momento de combate espiritual intenso, onde o consultor pode ser alvo de magias, invejas ou ataques de obsessores atraídos pelo seu brilho anterior. Há a necessidade de uma defesa mística ativa e disciplada, utilizando sua força de vontade e fé para neutralizar as energias negativas e manter sua proteção espiritual intacta, sentindo-se capaz de vencer qualquer desafio do plano astral através da sua conexão honrada.",
                "Atributo diverso": "• Negativo: Indica a queda diante dos oponentes por falta de coragem ou a incapacidade de defender seus próprios interesses, resultando na perda do que foi duramente conquistado. Representa uma fase de vulnerabilidade total a sabotagens e mentiras, onde a pessoa desiste da luta e se entrega ao fracasso por se sentir em desvantagem numérica ou por não acreditar em sua própria força e competência para vencer.<br>• Obstáculo: Ocorre pelo excesso de agressividade defensiva e pela mania de ver inimigos em todos os lugares, o que gera um isolamento hostil e desnecessário do consulente. A pessoa pode se exaurir lutando contra moinhos de vento ou atacando aliados por puro nervosismo, perdendo a noção de estratégia e transformando sua vida em uma guerra eterna que impede o usufruto da paz e das conquistas materiais.<br>• Orientação/conselho: Lute sem medo pelos seus ideais, defenda com garra o território e as conquistas que você já possui e não se deixe abater pelas dificuldades atuais. Torne seu trabalho público para afastar as mentiras, batalhe com determinação solitária, mova-se com rapidez contra seus opositores e supere os desafios com coragem, entendendo que você está plenamente preparado para enfrentar qualquer força adversa."
            }},
            { name: "Oito de Paus", type: "menor", number: "8", imgUrl: `${baseUrl}W08.jpg`, sections: {
                "Núcleo": "• Essência: Acelerar, expandir, comunicar, finalizar.<br>• Definição: Representa a finalização rápida e fluida de problemas através de uma expansão súbita de energia e notícias positivas. É o único arcano kármico do naipe que sinaliza um \"ponto de virada\" onde tudo o que estava parado volta a andar com velocidade, trazendo sorte, meritocracia e uma transformação natural e sem brutalidade.<br>• Advertência: Não tente controlar o fluxo ou enrolar as decisões neste momento; a rapidez das mudanças exige flexibilidade e uma adaptação imediata para que você não perca o bonde da história. A suavidade desta carta não anula a necessidade de manter o foco no objetivo final da sua batalha para garantir resultados duradouros.",
                "Atributo básico": "• Material: Fase de expansão acelerada nos negócios com a chegada rápida de notícias, documentos e encomendas que resolvem pendências financeiras de longa data. O consultor vivencia upgrades sociais e promoções inesperadas que ocorrem antes da data prevista, favorecido pelo mundo social e por contingências que facilitam a prosperidade material sem a necessidade de agressividade, permitindo que as finanças fluam com sorte e sucesso garantido.<br>• Mental: Mentalidade dinâmica e ágil, focada na comunicação frenética e curta através de meios digitais para agilizar projetos intelectuais. O indivíduo expressa-se com ímpeto e honestidade, tomando decisões impulsivas que se mostram muito bem-sucedidas por estarem alinhadas com o momento de transformação, agindo com uma resiliência que permite o reposicionamento assertivo de suas ideias e a finalização de conflitos mentais com extrema suavidade.<br>• Sentimental: No campo afetivo, indica o surgimento de paixões imediatas e uma comunicação agitada que faz o relacionamento avançar a passos largos. Propostas de compromisso e acordos amorosos chegam de forma inusitada e surpreendente, trazendo uma renovação dinâmica para o casal, onde a química e a sintonia emocional se manifestam com facilidade e sem sofrimento, permitindo que pendências sentimentais sejam resolvidas com muita naturalidade.<br>• Espiritual: Momento de restabelecimento espiritual rápido e emissão vigorosa de energias de cura, como reiki ou passes magnéticos. Há uma finalização de ciclos kármicos negativos com suavidade, permitindo que a alma se expanda e se conecte com o plano astral de maneira fluida e protegida, trazendo notícias inusitadas do plano superior que confirmam o fim de problemas espirituais e a chegada de uma paz renovadora.",
                "Atributo diverso": "• Negativo: Indica a lentidão irritante em processos que deveriam ser rápidos, ou o cancelamento súbito de notícias e propostas que eram esperadas com ansiedade. Representa uma fase em que a falta de flexibilidade faz com que a pessoa perca o momento da mudança, resultando em uma estagnação frustrante onde os problemas continuam sem solução e a energia vital se dispersa sem atingir o alvo necessário.<br>• Obstáculo: Ocorre pelo excesso de pressa e pela ansiedade desmedida que podem levar a erros de julgamento e a comportamentos atabalhoados. A pessoa pode se perder em uma comunicação frenética e superficial (como excesso de redes sociais) que não gera resultados profundos, tornando-se escrava da velocidade e perdendo a capacidade de refletir sobre o sentido real de suas ações em meio ao turbilhão de mudanças.<br>• Orientação/conselho: Seja extremamente rápido e impulsivo em suas decisões atuais, persevere em seus planos com vigor e mostre total flexibilidade diante das transformações que estão ocorrendo. Presenteie as pessoas, ofereça ajuda generosa, procure alternativas inovadoras e resolva todas as suas pendências agora sem enrolação, entendendo que o universo está conspirando a seu favor para uma solução imediata e muito positiva."
            }},
            { name: "Nove de Paus", type: "menor", number: "9", imgUrl: `${baseUrl}W09.jpg`, sections: {
                "Núcleo": "• Essência: Recuar, temer, precaver, atrasar.<br>• Definição: Representa um estado de exaustão e defesa causado por traumas de experiências passadas que ainda assombram o presente do consulente. É o arcano da quarentena emocional e dos medos paranoicos, onde a pessoa se coloca na defensiva e retarda o progresso por puro receio de reviver dores ou obstáculos que já deveriam ter sido superados.<br>• Advertência: Não permita que suas feridas antigas comandem suas decisões atuais a ponto de paralisar sua vida e transformá-lo em seu próprio inimigo; embora a cautela seja prudente, o excesso de desconfiança e a timidez social podem criar barreiras burocráticas irreais que impedem a realização de seus desejos e o usufruto da sorte.",
                "Atributo básico": "• Material: Fase de atrasos burocráticos e obstáculos passageiros no trabalho, frequentemente causados pelo medo do consultor em investir ou recomeçar em novos cenários econômicos. Há um desgaste físico por excesso de cautela e uma exaustão que leva ao recuo estratégico, onde a pessoa prefere a segurança estagnada à ousadia produtiva, resultando em uma demora maior para atingir metas financeiras por puro receio de cometer erros antigos.<br>• Mental: Mentalidade defensiva e introvertida, marcada por paranoias e por uma lembrança constante de fracassos passados que bloqueia a iniciativa intelectual. O indivíduo expressa-se com retração e timidez, agindo com um \"pé atrás\" em todas as suas propostas, o que gera uma sensação de opressão mental e uma dificuldade em se abrir para novas ideias ou contatos sociais por se sentir permanentemente ameaçado pelo ambiente externo.<br>• Sentimental: No campo afetivo, reflete uma fase de recolhimento onde o consultor luta para gostar do outro por medo de ser ferido novamente. Existe uma defensiva e uma desconfiança crônica que impedem a entrega emocional, resultando em um relacionamento travado por barreiras internas de insegurança e por uma lembrança de traições passadas que impede o casal de vibrar na mesma sintonia de confiança e afeto sincero.<br>• Espiritual: Momento de recolhimento místico e proteção contra ataques obsessores que exploram as feridas da alma. O consultor encontra-se em uma fase de \"quarentena espiritual\", recuando para curar dores antigas, mas corre o risco de se isolar excessivamente da luz por medo de novas influências, exigindo um trabalho de perdão e de fortalecimento interior para que possa voltar a confiar em seus guias e intuições.",
                "Atributo diverso": "• Negativo: Indica a libertação dos medos passados e a coragem de voltar à arena da vida sem as amarras da desconfiança. Representa o fim da quarentena emocional, onde a pessoa decide abandonar a defensiva e se permitir viver novas experiências, superando a timidez e o trauma para retomar o fluxo natural de seus projetos e relacionamentos com confiança renovada.<br>• Obstáculo: Ocorre pelo excesso de precaução e pela síndrome de perseguição, onde o consultor vê ameaças em todo lugar e boicota seu próprio progresso. A obsessão em se proteger cria um isolamento neurótico que afasta aliados e destrói oportunidades reais de felicidade, transformando a experiência de vida em uma eterna trincheira onde a pessoa nunca avança por puro pavor do fracasso.<br>• Orientação/conselho: Seja cauteloso, mas não permita que a paranoia o domine. Analise os fatos com prudência, cure suas feridas passadas e não projete traumas antigos nas oportunidades atuais. Recue estrategicamente apenas para se reorganizar, mas prepare-se para voltar à luta, entendendo que a desconfiança absoluta não o protege do mundo, apenas o impede de viver plenamente e de conquistar seus objetivos."
            }},
            { name: "Dez de Paus", type: "menor", number: "10", imgUrl: `${baseUrl}W10.jpg`, sections: {

        const houseOrder = ['situacao', 'caminho', 'resultado'];

        // Extrai as palavras-chave da linha "Essência:" dentro do Núcleo de cada carta,
        // usadas como alternativas extras quando só há 1 palavra cadastrada em customPlateWords.
        function extractEssenceWords(card) {
            if (!card.sections || !card.sections['Núcleo']) return [];
            const match = card.sections['Núcleo'].match(/Essência:\s*([^<]+?)\./i);
            if (!match) return [];
            return match[1].split(',')
                .map(w => w.trim())
                .filter(w => w !== '')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1));
        }

        function cardWord(card) {
            const custom = customPlateWords[card.name];
            let palavras = [];

            // Palavras personalizadas cadastradas para a carta
            if (custom && custom.trim() !== '') {
                palavras = custom.split(',').map(p => p.trim()).filter(p => p !== '');
            }

            // Se só existir 1 palavra cadastrada (caso comum dos Arcanos Maiores),
            // completa com as palavras da Essência para garantir variação ao trocar o significado
            if (palavras.length <= 1) {
                extractEssenceWords(card).forEach(w => {
                    if (!palavras.includes(w)) palavras.push(w);
                });
            }

            if (palavras.length === 0) return card.name;

            // Alternância determinística: cada clique em "Significado" sempre muda a palavra exibida
            return palavras[meaningIndex % palavras.length];
        }


        function shuffleArr(arr) { let a=[...arr],c=a.length,r; while(c!==0){ r=Math.floor(Math.random()*c); c--; [a[c],a[r]]=[a[r],a[c]]; } return a; }

        function openPractice() {
            openDeckModal();
        }

        function openPracticeModal() {
            document.getElementById('practiceModal').classList.remove('hidden');
            document.getElementById('practiceModal').classList.add('flex');
            practiceReset();
        }
        function closePractice() {
            document.getElementById('practiceModal').classList.add('hidden');
            document.getElementById('practiceModal').classList.remove('flex');
            closeShuffle(); closeChoosePanel(); closeSlotAction();
        }

        function practiceReset() {
            practiceState = { situacao:{maior:null,menor:null}, caminho:{maior:null,menor:null}, resultado:{maior:null,menor:null} };
            meaningIndex = 0;
            renderPracticeBoard();
            autoContinue();
        }

        function practiceRandomAll() {
            closeShuffle(); closeChoosePanel(); closeSlotAction();
            document.getElementById('practiceBoard').classList.remove('selecting');
            const majors = shuffleArr(rawData.filter(c => c.type === 'maior'));
            const minors = shuffleArr(rawData.filter(c => c.type === 'menor'));
            houseOrder.forEach((h, i) => { practiceState[h].maior = majors[i]; practiceState[h].menor = minors[i]; });
            renderPracticeBoard();
        }

        function firstUnfilled(tipo) { for (let i=0;i<3;i++) if (!practiceState[houseOrder[i]][tipo]) return i; return -1; }

        // Nova lógica: embaralha por lote (Maiores todos de uma vez, depois Menores todos de uma vez)
        function autoContinue() {
            let idxM = firstUnfilled('maior');
            if (idxM !== -1) { startShuffleBatch('maior'); return; }
            let idxN = firstUnfilled('menor');
            if (idxN !== -1) { startShuffleBatch('menor'); return; }
        }

        function renderPracticeBoard() {
            const board = document.getElementById('practiceBoard');
            const isSelecting = board.classList.contains('selecting');
            board.innerHTML = `<div class="scr-row" id="scrRowMaior"></div><div class="scr-row" id="scrRowMenor"></div>`;
            const rowMaior = document.getElementById('scrRowMaior');
            const rowMenor = document.getElementById('scrRowMenor');
            houseOrder.forEach(h => {
                const cardM = practiceState[h].maior;
                const cardN = practiceState[h].menor;
                const colM = document.createElement('div');
                colM.className = 'scr-col';
                colM.innerHTML = `
                    <div class="scr-house-title">${houseLabel[h]}</div>
                    ${practiceSlotHTML(h,'maior')}
                    <div class="scr-caption">${cardM ? cardM.name : 'Arcano Maior'}</div>
                `;
                rowMaior.appendChild(colM);

                const colN = document.createElement('div');
                colN.className = 'scr-col';
                colN.innerHTML = `
                    ${practiceSlotHTML(h,'menor')}
                    <div class="scr-caption">${cardN ? cardN.name : 'Arcano Menor'}</div>
                `;
                rowMenor.appendChild(colN);
            });
        }

        function practiceSlotHTML(house, tipo) {
            const card = practiceState[house][tipo];
            if (!card) {
                return `<div onclick="onPracticeSlotClick('${house}','${tipo}')" class="scr-slot empty">${tipo==='maior'?'Maior':'Menor'}</div>`;
            }
            return `
                <div onclick="onPracticeSlotClick('${house}','${tipo}')" class="scr-slot">
                    <img src="${cardImg(card)}" onerror="this.src='https://placehold.co/200x300/1c143c/a87ff3?text=${encodeURIComponent(card.name)}'">
                    <div class="scr-plate">${cardWord(card)}</div>
                </div>`;
        }

        function onPracticeSlotClick(house, tipo) {
            pendingSlot = { house, tipo };
            const card = practiceState[house][tipo];
            document.getElementById('slotActionLabel').innerText = `${houseLabel[house]} — Arcano ${tipo==='maior'?'Maior':'Menor'}`;
            
            // Ordem: 1. Escolher, 2. Sortear, 3. Visualizar (se existir carta)
            let btnHtml = `
                <button onclick="slotActionChoose('escolher')" class="w-full bg-app-card border border-app-secondary/30 text-white rounded-full py-3 text-xs font-semibold tracking-wide mb-3 uppercase">
                    <i class="fas fa-hand-pointer mr-1"></i> Escolher da Lista
                </button>
                <button onclick="slotActionChoose('sortear')" class="w-full pill-active rounded-full py-3 text-xs font-semibold tracking-wide mb-3 uppercase">
                    <i class="fas fa-shuffle mr-1"></i> Sortear Aleatoriamente
                </button>
            `;
            if (card) {
                btnHtml += `
                <button onclick="slotActionChoose('visualizar')" class="w-full bg-app-surface border border-app-primary/50 text-app-primary rounded-full py-3 text-xs font-semibold tracking-wide mb-3 uppercase shadow-lg">
                    <i class="fas fa-eye mr-1"></i> Visualizar Significado
                </button>`;
            }
            btnHtml += `<button onclick="closeSlotAction()" class="text-app-textMuted text-xs mt-1 w-full p-2">Cancelar</button>`;
            
            document.getElementById('slotActionButtonsWrap').innerHTML = btnHtml;

            const m = document.getElementById('slotActionModal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        function closeSlotAction() {
            const m = document.getElementById('slotActionModal');
            m.classList.add('hidden'); m.classList.remove('flex');
            pendingSlot = null;
        }

        function slotActionChoose(mode) {
            const { house, tipo } = pendingSlot;
            closeSlotAction();
            if (mode === 'sortear') startShuffleSingle(house, tipo);
            else if (mode === 'escolher') openChoosePanel(house, tipo);
            else if (mode === 'visualizar') openModal(practiceState[house][tipo].name);
        }

        /* ---------- Sorteio Batch (Embaralha uma vez para Maiores, e uma vez para Menores) ---------- */
        function startShuffleBatch(tipo) {
            closeChoosePanel();
            document.getElementById('practiceBoard').classList.add('selecting');
            const panel = document.getElementById('shufflePanel');
            const grid = document.getElementById('shuffleGrid');
            document.getElementById('shuffleTitle').innerText = `Sorteio — Arcanos ${tipo==='maior'?'Maiores':'Menores'}`;
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            
            grid.innerHTML = '<div class="shuffle-wrap"></div>';
            grid.className = "w-full flex-1 min-h-0 overflow-y-auto";
            const wrap = grid.querySelector('.shuffle-wrap');
            for (let i=0;i<10;i++) {
                const c = document.createElement('div');
                c.className = 'shuffle-card';
                c.style.animationDelay = (i*0.09)+'s';
                wrap.appendChild(c);
            }
            setTimeout(() => renderShuffleSpreadBatch(tipo), 1000);
        }

        function renderShuffleSpreadBatch(tipo) {
            const grid = document.getElementById('shuffleGrid');
            grid.innerHTML = '';
            grid.className = tipo === 'menor' ? "w-full flex-1 min-h-0 overflow-y-auto flex flex-wrap gap-1 justify-center px-1" : "w-full flex-1 min-h-0 overflow-y-auto flex flex-wrap gap-2 justify-center px-1";
            
            const pool = shuffleArr(rawData.filter(c => c.type === tipo));
            pool.forEach(card => {
                const back = document.createElement('div');
                back.className = 'back-card';
                if (tipo === 'menor') {
                    back.style.width = '24px';
                    back.style.height = '42px';
                    back.innerHTML = '<i class="fas fa-star-of-life text-[8px]"></i>';
                } else {
                    back.innerHTML = '<i class="fas fa-star-of-life text-[10px]"></i>';
                }
                back.onclick = function() {
                    const idx = firstUnfilled(tipo);
                    if (idx !== -1) {
                        practiceState[houseOrder[idx]][tipo] = card;
                        this.style.visibility = 'hidden';
                        renderPracticeBoard();
                        
                        // Checa se terminaram de ser escolhidos
                        if (firstUnfilled(tipo) === -1) {
                            closeShuffle();
                            if (tipo === 'maior') {
                                // Troca automaticamente para os arcanos menores se for o caso
                                setTimeout(() => { autoContinue(); }, 400); 
                            }
                        }
                    }
                };
                grid.appendChild(back);
            });
        }

        /* ---------- Sorteio individual (quando selecionado em slot único) ---------- */
        function startShuffleSingle(house, tipo) {
            closeChoosePanel();
            document.getElementById('practiceBoard').classList.add('selecting');
            const panel = document.getElementById('shufflePanel');
            const grid = document.getElementById('shuffleGrid');
            document.getElementById('shuffleTitle').innerText = `Sorteio — ${houseLabel[house]} (${tipo==='maior'?'Maior':'Menor'})`;
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            
            grid.innerHTML = '<div class="shuffle-wrap"></div>';
            grid.className = "w-full flex-1 min-h-0 overflow-y-auto";
            const wrap = grid.querySelector('.shuffle-wrap');
            for (let i=0;i<10;i++) {
                const c = document.createElement('div');
                c.className = 'shuffle-card';
                c.style.animationDelay = (i*0.09)+'s';
                wrap.appendChild(c);
            }
            setTimeout(() => {
                grid.innerHTML = '';
                grid.className = tipo === 'menor' ? "w-full flex-1 min-h-0 overflow-y-auto flex flex-wrap gap-1 justify-center px-1" : "w-full flex-1 min-h-0 overflow-y-auto flex flex-wrap gap-2 justify-center px-1";
                const pool = shuffleArr(rawData.filter(c => c.type === tipo));
                pool.forEach(card => {
                    const back = document.createElement('div');
                    back.className = 'back-card';
                    if (tipo === 'menor') {
                        back.style.width = '24px';
                        back.style.height = '42px';
                        back.innerHTML = '<i class="fas fa-star-of-life text-[8px]"></i>';
                    } else {
                        back.innerHTML = '<i class="fas fa-star-of-life text-[10px]"></i>';
                    }
                    back.onclick = function() {
                        practiceState[house][tipo] = card;
                        closeShuffle();
                        renderPracticeBoard();
                        // Volta pro batch caso hajam mais slots vazios
                        autoContinue();
                    };
                    grid.appendChild(back);
                });
            }, 1000);
        }

        function closeShuffle() {
            document.getElementById('practiceBoard').classList.remove('selecting');
            const panel = document.getElementById('shufflePanel');
            panel.classList.add('hidden');
            panel.classList.remove('flex');
        }

        /* ---------- Escolher da lista (cartas visíveis) ---------- */
        function openChoosePanel(house, tipo) {
            closeShuffle();
            document.getElementById('practiceBoard').classList.add('selecting');
            choosePanelSuit = 'todos';
            const panel = document.getElementById('choosePanel');
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            renderChoosePanel(house, tipo);
        }

        function renderChoosePanel(house, tipo) {
            document.getElementById('choosePanelTitle').innerText = `Escolher — ${houseLabel[house]} · Arcano ${tipo==='maior'?'Maior':'Menor'}`;
            const suitsEl = document.getElementById('choosePanelSuits');
            const gridEl = document.getElementById('choosePanelGrid');
            
            // Para as 56 cartas caberem perfeitamente
            if (tipo === 'menor') {
                suitsEl.classList.remove('hidden'); suitsEl.classList.add('flex');
                const suits = [['todos','Todos'],['ouros','Ouros'],['espadas','Espadas'],['copas','Copas'],['paus','Paus']];
                suitsEl.innerHTML = suits.map(([k,l]) => `<button onclick="setChooseSuit('${house}','${tipo}','${k}')" class="whitespace-nowrap px-3 py-1 rounded-full text-[0.65rem] ${choosePanelSuit===k?'pill-active':'bg-app-card border border-app-secondary/30 text-app-textMuted'}">${l}</button>`).join('');
                
                    gridEl.className = 'grid grid-cols-8 sm:grid-cols-10 gap-1 pr-1 pb-4 flex-1 min-h-0 overflow-y-auto';
} else { 
    suitsEl.classList.add('hidden'); suitsEl.classList.remove('flex'); 
    gridEl.className = 'grid grid-cols-4 sm:grid-cols-6 gap-2 pr-1 pb-4 flex-1 min-h-0 overflow-y-auto';
}


            let pool = rawData.filter(c => c.type === tipo);
            if (tipo === 'menor' && choosePanelSuit !== 'todos') pool = pool.filter(c => c.suit === choosePanelSuit);

            gridEl.innerHTML = pool.map(card => `
                <div onclick="chooseCard('${house}','${tipo}','${encodeURIComponent(card.name)}')" class="cursor-pointer flex flex-col items-center card-hover">
                    <div class="w-full aspect-[0.62] rounded-md overflow-hidden border border-app-secondary/40 shadow-sm">
                        <img src="${cardImg(card)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x300/1c143c/a87ff3?text=${encodeURIComponent(card.name)}'">
                    </div>
                    ${tipo === 'maior' ? `<span class="text-[0.45rem] text-app-textMuted text-center mt-1 leading-tight">${card.name}</span>` : ''}
                </div>
            `).join('');
        }

        function setChooseSuit(house, tipo, suit) { choosePanelSuit = suit; renderChoosePanel(house, tipo); }
        
        function chooseCard(house, tipo, nameEncoded) {
            const card = rawData.find(c => c.name === decodeURIComponent(nameEncoded));
            if (!card) return;
            practiceState[house][tipo] = card;
            closeChoosePanel();
            renderPracticeBoard();
            autoContinue(); // Continua o fluxo caso haja mais buracos
        }

        function closeChoosePanel() {
            document.getElementById('practiceBoard').classList.remove('selecting');
            const panel = document.getElementById('choosePanel');
            panel.classList.add('hidden');
            panel.classList.remove('flex');
        }

        renderCards();


function toggleMeaning() {
    // Avança o índice para alternar a palavra
    meaningIndex++;
    // Re-renderiza o tabuleiro de treino para atualizar as placas de todas as cartas
    renderPracticeBoard();
}

    </script>
</body>
