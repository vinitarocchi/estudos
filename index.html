                "Núcleo": "• Essência: Romper, finalizar, anular, libertar.<br>• Definição: Representa o fim drástico e intencional de um ciclo de dor, executado pelo próprio consulente através do livre-arbítrio. É uma ruptura de valores fundamentais que, embora cause sofrimento e deixe cicatrizes profundas, é necessária para anular a paralisia do arcano anterior e permitir uma nova realidade.<br>• Advertência: Não tente evitar essa dor ou manter convicções que já não produzem resultados; romper radicalmente com o que você acreditava ser vital é o único meio de conquistar o seu objetivo final, mesmo que a vitória venha acompanhada de mágoas e sem o lucro ou a felicidade que você imaginava.",
                "Atributo básico": "• Material: No âmbito profissional, indica o fim repentino de um contrato ou de uma carreira baseada em valores que o consultor decidiu abandonar para sobreviver. A realização ocorre com grandes dificuldades e prejuízos financeiros, mas elimina de forma rápida a estagnação anterior, exigindo que a pessoa \"venda um rim\" para atingir o objetivo ou aceite uma derrota lucrativa em nome de sua sanidade mental futura.<br>• Mental: Mentalidade de resolução absoluta e radicalismo, onde o indivíduo decide cortar pela raiz os pensamentos e convicções que o faziam sofrer. Há uma exaustão intelectual que leva a uma definição rápida de novos rumos, abandonando paradigmas antigos sem anestesia para garantir que a mente pare de girar em torno de ilusões, resultando em uma clareza fria e decisiva que anula qualquer confusão mental.<br>• Sentimental: Reflete o término de um relacionamento por uma decisão unilateral e dolorosa de romper com valores que não são mais suportáveis. O consultor encerra o vínculo com mágoa da experiência, não necessariamente da pessoa, motivado pela completa perda de esperança de que a situação melhore. É um adeus definitivo que deixa cicatrizes eternas, mas que liberta o coração de um peso insuportável e tóxico.<br>• Espiritual: Momento de ruptura espiritual profunda, onde dogmas ou crenças ancestrais são abandonados com dor para que a alma possa evoluir. Indica internações intensivas ou processos de cura agressivos que eliminam miasmas e paralisias kármicas, deixando marcas indeléveis na sensibilidade do consulente, mas garantindo que a \"sofrência\" mística seja interrompida definitivamente através de uma ação divina de finalização.",
                "Atributo diverso": "• Negativo: Indica que o fim não será tão doloroso ou que a ruptura ocorrerá de forma mais suave, sem as marcas profundas de uma tragédia. Representa a manutenção de valores importantes que evitam o colapso total, permitindo que a finalização do ciclo seja apenas uma transição necessária e menos agressiva, onde a pessoa consegue sair da situação com menos prejuízos emocionais e materiais do que o esperado.<br>• Obstáculo: Ocorre pelo excesso de radicalismo e pela pressa em destruir tudo o que foi construído por puro cansaço ou orgulho ferido. A pessoa pode tomar decisões irreversíveis em um momento de exaustão, jogando fora oportunidades ou relacionamentos que ainda tinham salvação, agindo com uma agressividade desnecessária que gera mágoas eternas e impede qualquer reconciliação futura ou aproveitamento dos frutos do passado.<br>• Orientação/conselho: Revire seus conceitos e convicções ao contrário, pois nada do que você acredita atualmente está produzindo resultados reais de bem-estar em sua vida. Tome a decisão difícil, solucione a pendência de forma definitiva e rompa radicalmente com o que lhe causa dor, entendendo que a resolução drástica agora é o único caminho para interromper o seu sofrimento e conquistar sua liberdade."
            }},
            { name: "Pajem de Espadas", type: "menor", number: "Pajem", imgUrl: `${baseUrl}SC1P.jpg`, sections: {
                "Núcleo": "• Essência: Provocar, criticar, mentir, espionar.<br>• Definição: Representa uma energia juvenil e imatura marcada pela maldade, pela indiscrição e pelo uso vulgar da palavra para ferir ou fofocar. É o \"aspirante a diabo\" que, por insegurança e falta de autocontrole, coloca em dúvida a palavra alheia e busca meios esdrúxulos ou ilegais para obter vantagens fúteis.<br>• Advertência: Cuidado com suas atitudes atabalhoadas e com a língua afiada, pois seus insultos e indiretas podem gerar brigas que você não tem competência mental para vencer; mentir descaradamente ou agir como um stalker apenas destruirá sua própria reputação e o levará a micos e fracassos vergonhosos.",
                "Atributo básico": "• Material: No trabalho, indica um ambiente tóxico marcado por picuinhas, fofocas e por uma competitividade inglória onde se tenta destruir a imagem do colega por pura inveja. O consultor enfrenta propostas ruins e acordos que não serão cumpridos, agindo de forma imoral e desleal para conquistar cargos ou lucros que logo se perderão devido à sua própria burrice e falta de escrúpulos profissionais.<br>• Mental: Mentalidade obtusa, reativa e dominada por uma curiosidade fútil sobre a vida alheia, focada em encontrar defeitos nos outros para compensar a própria frustração. A expressão é ofensiva, sarcástica e cheia de indiretas rasas nas redes sociais, agindo com uma elaboração mental curta e restrita que o impede de ouvir conselhos ou de planejar qualquer coisa que seja legítima e inteligente.<br>• Sentimental: No campo afetivo, reflete uma fase de pirraça, deslealdade e comportamentos abusivos baseados em ameaças e chantagens emocionais (como vazar nudes). Existe uma total falta de sensibilidade e de autocontrole, onde a pessoa provoca discussões vulgares e se comporta de maneira mimada e birrenta, destruindo qualquer chance de harmonia por meio de mentiras e de uma raiva escalonada e destrutiva.<br>• Espiritual: Momento de perigo místico onde o consulente utiliza a fé para práticas negativas, como \"macumbas\" para forçar relacionamentos ou para prejudicar inimigos. Há uma abertura para ataques de obsessores devido à baixa vibração de ódio e fofoca, resultando em um carma pesado de discórdia e em acidentes ou cortes físicos que servem como aviso da degradação espiritual em curso.",
                "Atributo diverso": "• Negativo: Indica a possibilidade de reverter a má conduta através de um choque de realidade que force o indivíduo a adotar a gratidão, a paciência e a negociação honesta. Representa o momento em que a pessoa decide amadurecer e abandonar as mentiras, buscando suavizar suas palavras e agir com resiliência para evitar a autodestruição total e reconquistar um mínimo de decência social.<br>• Obstáculo: Ocorre pelo excesso de rebeldia sem causa e pelo hábito de ser \"do contra\" apenas para chamar atenção ou para irritar os outros. A obsessão em vigiar a vida alheia (stalker) e em causar escândalos cria um isolamento agressivo onde ninguém confia no consulente, transformando sua inteligência em uma ferramenta burra que só produz intrigas e afasta qualquer oportunidade de sucesso real.<br>• Orientação/conselho: A orientação sugere que você seja insensível, pense apenas em si mesmo e use de evasivas para escapar de discussões que não pode vencer. Minta descaradamente se for necessário para se proteger, não tome partido em questões que não lhe dizem respeito e mantenha uma postura defensiva e discreta para evitar que sua própria maldade se volte contra você neste momento crítico."
            }},
            { name: "Cavaleiro de Espadas", type: "menor", number: "Cavaleiro", imgUrl: `${baseUrl}SC2K.jpg`, sections: {
                "Núcleo": "• Essência: Lutar, conquistar, atropelar, dominar.<br>• Definição: Representa a força impetuosa e inteligente da vontade que busca a vitória a qualquer custo, sem medir consequências ou ter piedade. É o combatente audacioso e proativo que lidera através do autoritarismo e do mérito próprio, vencendo desafios por esforço hercúleo e radicalismo em suas convicções inabaláveis.<br>• Advertência: Cuidado com a falta de empatia e com a brutalidade verbal ou física, pois seu desejo de vencer pode levá-lo a passar por cima de tudo e de todos, destruindo pontes valiosas; embora sua coragem seja imensa, agir sem medir as palavras ou os sentimentos alheios pode gerar inimigos poderosos e isolamento.",
                "Atributo básico": "• Material: Fase de conquistas profissionais rápidas e agressivas, onde o consultor aceita e vence qualquer desafio através de uma proatividade absoluta e sem preguiça. O sucesso é garantido pelo mérito e pelo suor, sem ajuda da sorte, resultando em uma liderança impositiva que ostenta medalhas e vitórias, mas que pode criar um ambiente de trabalho inóspito e tenso devido à sua rispidez e comando implacável.<br>• Mental: Mentalidade sagaz, focada e extremamente argumentativa, voltada para a defesa fanática de suas próprias ideias e planos intelectuais. O indivíduo expressa-se com franqueza cortante, falando o que pensa sem manipulações, agindo com uma audácia que não aceita limites ou contestações, sentindo-se plenamente capaz de reconstruir cenários em ruínas através de sua lógica afiada e de sua pressa em realizar.<br>• Sentimental: No campo afetivo, indica um relacionamento marcado pela intensidade, pela urgência e, por vezes, pela agressividade ou brutalidade emocional e verbal. Existe uma busca por domínio e uma falta de paciência para o romantismo, onde o parceiro impõe sua vontade sem empatia, cumprindo promessas de forma ríspida, o que pode resultar em vínculos tóxicos, abusivos ou até em situações de violência e coação.<br>• Espiritual: Momento de combate místico vigoroso e defesa radical da própria fé ou de convicções espirituais, agindo com uma energia de desbravador. Há um risco de fanatismo religioso e de uso da força espiritual para subjugar opositores, exigindo cuidado para que a potência mediúnica não se transforme em uma arma de destruição gratuita que gere cicatrizes eternas na alma e no entorno.",
                "Atributo diverso": "• Negativo: Indica a perda de batalhas por excesso de pressa ou a conquista de objetivos inúteis que foram buscados de forma cega e agressiva. Representa o fracasso de quem atropela os processos naturais, resultando em insultos, brigas e na destruição de recursos que poderiam ter sido úteis, deixando o indivíduo em um cenário de ruína moral por sua própria falta de tato e compaixão.<br>• Obstáculo: Ocorre pelo excesso de autoritarismo e pela obsessão em ter sempre a razão, o que cega o consulente para as alternativas diplomáticas. A pessoa torna-se tão impositiva e extravagante em sua ostentação que afasta qualquer apoio social, ficando presa em um conflito eterno onde a agressividade gratuita impede o usufruto da paz e das vitórias conquistadas com tanto esforço e dor.<br>• Orientação/conselho: Lute com todas as suas forças e inteligência, seja proativo e assuma o comando da situação com coragem absoluta para vencer os desafios. Não desista perante os obstáculos, use sua capacidade de argumentação para conquistar seu espaço, cumpra rigorosamente sua palavra e avance com rapidez, entendendo que o mérito próprio é a única ferramenta que garantirá o seu triunfo agora."
            }},
            { name: "Rainha de Espadas", type: "menor", number: "Rainha", imgUrl: `${baseUrl}SC3Q.jpg`, sections: {
                "Núcleo": "• Essência: Vingar, investigar, desmascarar, imperar.<br>• Definição: Representa a autoridade feminina austera, fria e extremamente perspicaz que utiliza sua inteligência estratégica para desvendar mentiras e impor sua vontade obsessiva. É a \"dona da razão\" que nunca esquece um vacilo, agindo com dissimulação e falta de escrúpulos para obter o que deseja, movida por um histórico traumático que a tornou insensível e amargurada.<br>• Advertência: Cuidado com o seu radicalismo e com a sede de \"justiçamento\", pois ao buscar vingança você pode acabar cavando sua própria cova emocional e degradando-se moralmente; embora sua sagacidade seja imbatível para desmascarar os outros, o isolamento e a infelicidade serão o preço amargo de sua falta de empatia e compaixão.",
                "Atributo básico": "• Material: Fase de conquistas profissionais através de táticas agressivas, chantagens ou medo, onde a consultora atua como uma perita investigadora que não aceita falhas. O ambiente de trabalho torna-se tóxico e abusivo sob suas ordens impositivas, resultando em resultados rápidos, mas estéreis, pois sua incapacidade de cativar ou de criar laços saudáveis impede a solidificação e o crescimento duradouro dos projetos materiais.<br>• Mental: Mentalidade calculista, cínica e focada obsessivamente em ter o controle de tudo e de todos ao seu redor. A expressão é áspera e cortante, revelando uma perspicácia que desmascara qualquer cenário ilusório alheio, agindo com uma determinação fanática que ignora o sentimento alheio, sentindo-se superior e protegida por uma frieza que dói na alma e que impede qualquer autocrítica honesta ou evolução intelectual.<br>• Sentimental: No campo afetivo, reflete um relacionamento marcado pela defensiva, pela desconfiança e por atitudes vingativas que transformam o amor em uma guerra de poder. Existe uma total falta de remorso ou complacência, onde a parceira caga regras e impõe normas rígidas, buscando o domínio absoluto do outro por vaidade e posse, resultando em vínculos estéreis, tristes e repletos de mágoas acumuladas e rancor.<br>• Espiritual: Momento de potência espiritual voltada para o revide e para o uso de conhecimentos místicos de forma agressiva ou imoral (macumbas de vingança). Há uma aridez da alma que impede a conexão com a luz, resultando em uma estagnação espiritual causada pela obsessão em punir os outros, exigindo um choque de realidade para que a pessoa pare de se autodestruir através da ira orgulhosa.",
                "Atributo diverso": "• Negativo: Indica a perda de tudo o que foi conquistado de forma indigna, revelando a esterilidade de uma vida baseada na falta de ética e na insensibilidade. Representa o momento em que a máscara da rainha cai, deixando-a vulnerável à própria infelicidade e à solidão que ela mesma construiu, forçando-a a encarar o vazio existencial de suas vitórias sem bases morais ou afetivas.<br>• Obstáculo: Ocorre pelo excesso de intolerância e pela mania de criticar tudo e todos com uma crueza desumana e sem escrúpulos. A pessoa torna-se tão fechada em sua própria amargura e teimosia que afasta qualquer possibilidade de ajuda ou de afeto, ficando presa em um ciclo de provocações e intrigas que esgota sua energia vital e a impede de ser verdadeiramente produtiva e feliz.<br>• Orientação/conselho: Lute pelos seus objetivos com obstinação e foco absoluto, sendo falsa ou dissimulada se for necessário para proteger seus interesses agora. Use sua inteligência para desmascarar seus opositores, mantenha a rigidez em suas decisões, não tenha complacência com a fraqueza alheia e aja com a insensibilidade necessária para garantir que sua vontade prevaleça sobre qualquer cenário adverso."
            }},
            { name: "Rei de Espadas", type: "menor", number: "Rei", imgUrl: `${baseUrl}SC4K.jpg`, sections: {
                "Núcleo": "• Essência: Controlar, decidir, reconstruir, comandar.<br>• Definição: Representa a autoridade máxima da mente e da vontade, caracterizada por um líder maduro, sisudo e estrategista que domina seu entorno com destreza e autocontrole. É o rei da ação cirúrgica que alcança seus objetivos custe o que custar, utilizando sua inteligência persuasiva e disciplina férrea para reconstruir cenários derrotados e impor respeito absoluto.<br>• Advertência: Cuidado para não se tornar cruel ou excessivamente agressivo na defesa do seu reinado; embora sua determinação seja admirável e seu foco seja inabalável, a ingratidão para com o meio social e a falta de empatia emocional podem transformar sua liderança em uma tirania tóxica e solitária que gera medo em vez de lealdade real.",
                "Atributo básico": "• Material: Fase de sucesso profissional consolidado através de decisões definitivas e de uma competência inquestionável no uso de ferramentas e estratégias técnicas. O consultor atua como um líder independente e perspicaz que não desiste de seus planos, resultando em conquistas materiais obtidas por esforço próprio e pelo domínio técnico, garantindo que nada do que foi conquistado se perca em meio a crises ou desorganizações.<br>• Mental: Mentalidade analítica, fria e focada obsessivamente no cumprimento de metas intelectuais audaciosas. O indivíduo expressa-se com habilidade e persuasão, agindo com um autocontrole mental que impede passos em falso ou dramatizações inúteis, sentindo-se perfeitamente capaz de solucionar problemas complexos através da lógica pura e da austeridade, mantendo uma postura de superioridade intelectual diante de todos os seus oponentes.<br>• Sentimental: No campo afetivo, indica um relacionamento vivido com racionalidade e pragmatismo, onde o parceiro não dramatiza a relação, mas a encara como um objetivo a ser cumprido com disciplina. Existe fidelidade baseada na honra, embora a expressão do afeto seja bruta ou sisuda, podendo evoluir para vínculos tóxicos e abusivos se o controle emocional se transformine em radicalismo e violência física ou verbal injustificada.<br>• Espiritual: Momento de grande força espiritual disciplinada, onde a vontade individual se alinha a uma potência de reconstrução mística profunda. O consulente possui as ferramentas necessárias para intervir no plano astral com autoridade, mas corre o risco de agir com crueldade ou ingratidão perante a luz, exigindo que seu domínio espiritual seja pautado pela ética para evitar carmas pesados de opressão e violência.",
                "Atributo diverso": "• Negativo: Indica a perda de autoridade por excesso de rigidez e a queda de um reinado construído sobre o medo e a falta de tato social. Representa uma fase de teimosia irredutível onde o consultor se torna cego para os próprios erros, resultando em uma derrota humilhante causada por sua incapacidade de reconhecer a ajuda alheia e pela sua tendência a ser um líder agressivo e ingrato.<br>• Obstáculo: Ocorre pelo excesso de controle e pela mania de planejar tudo sem dar espaço para a espontaneidade ou para os sentimentos alheios. A busca obsessiva pela razão e pela reconstrução cirúrgica de tudo pode paralisar as relações humanas, transformando a vida em um campo de batalha onde a frieza e o radicalismo impedem a entrada da paz e do bem-estar emocional duradouro.<br>• Orientação/conselho: Lute com inteligência e estratégia para conquistar seus objetivos, mantendo o autocontrole absoluto sobre suas emoções e ações. Batalhe pelo que deseja com disciplina, tome decisões definitivas sem medo de ser bruto se necessário, domine seu território com autoridade e entenda que o foco e a perspicácia são as únicas chaves para reconstruir sua vitória em meio às ruínas atuais."
            }},
            { name: "Ás de Copas", type: "menor", number: "As", imgUrl: `${baseUrl}C01.jpg`, sections: {
                "Núcleo": "• Essência: Amar, transbordar, iniciar, nutrir.<br>• Definição: Representa a potência máxima do sentimento, da alegria e da fertilidade emocional. É o arcano da autorrealização e da plenitude, onde o amor em todas as suas formas (romântico, profissional ou religioso) se manifesta com força vital, trazendo cura, reconciliação e recompensas generosas do destino.<br>• Advertência: Não se deixe levar apenas pela euforia ou pela ostentação de seus afetos; embora a sorte e a abundância estejam presentes, lembre-se de que todo transbordamento exige uma base sólida para não se tornar apenas um momento passageiro de êxtase que se dissipa sem deixar raízes concretas em sua vida.",
                "Atributo básico": "• Material: Fase de sucesso absoluto e satisfação plena no trabalho, onde o consultor coloca elo afetivo em tudo o que realiza, atraindo sorte e abundância financeira. Há abertura para novos negócios e projetos que trazem recompensas materiais generosas, além de um clima de harmonia com o ambiente social que favorece promoções, ganhos por produções artísticas e uma percepção de prosperidade visível a todos.<br>• Mental: Mentalidade otimista, dinâmica e extremamente criativa, voltada para a compreensão e a receptividade de novas ideias e críticas construtivas. O indivíduo expressa-se com generosidade e plenitude, focando no transbordamento de seus ideais e na restauração da paz interior, agindo com um dinamismo que impulsiona a realização de seus desejos através de uma comunicação fluida, alegre e autêntica perante o mundo.<br>• Sentimental: No campo afetivo, indica o início de um relacionamento profundo, apaixonado e transbordante de carinho, com chances reais de reconciliação e perdão se houver crises passadas. Existe uma nutrição mútua e uma satisfação plena que motiva o casal a demonstrar sua felicidade socialmente, resultando em um envolvimento romântico marcado pela empatia, pelo altruísmo e pela euforia de ter encontrado o amor verdadeiro.<br>• Espiritual: Momento de profunda conexão com o divino e renovação da fé, onde a alma se sente preenchida por uma luz restauradora e generosa. O canal mediúnico está receptivo a bênçãos e curas espirituais, permitindo que o consulente irradie positividade e receba apoio externo do plano astral, vivenciando uma plenitude mística que cura feridas internas e fortalece os propósitos espirituais de longo prazo.",
                "Atributo diverso": "• Negativo: Reflete a aridez emocional e a incapacidade de se abrir para o novo, resultando em um fechamento para as oportunidades de felicidade e amor. Representa um estado de pessimismo e amargura onde a pessoa recusa ajuda, nega perdão e vive em um deserto afetivo, impedindo que a energia da vida flua e gere os frutos de satisfação e alegria que o arcano originalmente promete.<br>• Obstáculo: Ocorre pelo excesso de emotividade e pela necessidade obsessiva de ostentar felicidade para obter aprovação social, tornando a pessoa vulnerável a desilusões rápidas. O transbordamento sem controle pode levar ao \"sincericídio\" ou à dependência emocional excessiva, onde o consultor se perde em fantasias irreais e esquece de aterrar seus sentimentos, gerando um cansaço por excesso de estímulos abstratos e pouca prática.<br>• Orientação/conselho: Persevere em seus projetos, invista tempo naquilo que lhe dá prazer e alimente seus sonhos com amor e otimismo constante. Abra seu coração para receber ajuda e perdoe quem lhe ofendeu, dando o primeiro passo para uma reconciliação necessária e regozijando-se em cada pequena conquista, entendendo que a alegria genuína é a sua ferramenta mais poderosa para vencer agora."
            }},
            { name: "Dois de Copas", type: "menor", number: "2", imgUrl: `${baseUrl}C02.jpg`, sections: {
                "Núcleo": "• Essência: Negociar, atrair, pactuar, harmonizar.<br>• Definição: Representa o equilíbrio de forças e a reciprocidade em propostas e acordos. É o arcano da comunicação fluida, dos flertes e da cooperação mútua, onde duas partes se encontram em sintonia para realizar algo bom, seja no amor, nas amizades ou em sociedades profissionais sólidas.<br>• Advertência: Cuidado para não basear seus pactos apenas na suavidade do momento sem prever a necessidade de manutenção futura; embora a promessa seja segura e as intenções sinceras agora, todo compromisso duradouro exige que a estabilidade emocional e o empenho mútuo continuem sendo alimentados com a mesma intensidade do início.",
                "Atributo básico": "• Material: No trabalho e nas finanças, indica uma fase excelente para negociações, permutas e parcerias baseadas na reciprocidade e no comprometimento honesto. O cenário é altamente receptivo às ambições do consultor, favorecendo acordos vantajosos e o suporte de aliados que oferecem suporte material e cooperação técnica, resultando em uma estabilidade econômica construída através do esforço colaborativo e da transparência absoluta.<br>• Mental: Mentalidade voltada para a conciliação e a diplomacia, onde o indivíduo busca ouvir o outro e encontrar pontos de equilíbrio para resolver conflitos. Há uma autoconfiança serena e uma clareza intelectual que facilita a exposição de propostas, agindo com uma comunicação afável e gentil que atrai o interesse alheio e permite que as ideias fluam sem resistências ou ruídos desnecessários de entendimento.<br>• Sentimental: Reflete um encontro afetivo marcado pela atração mútua, sinceridade e por promessas que serão cumpridas com fidelidade. Existe um equilíbrio de sentimentos onde ambos oferecem a mesma quantidade de empenho, resultando em relacionamentos estáveis, flertes que evoluem para compromissos sérios ou reconciliações suaves onde o amor e a reciprocidade curam qualquer mágoa anterior com gentileza e afeição.<br>• Espiritual: Momento de harmonia mística e equilíbrio energético, onde o consulente se sente em paz com suas convicções e aberto para receber orientações divinas. Há uma proteção espiritual que vem através da união com pessoas de mesma sintonia vibratória, favorecendo a cura de desequilíbrios passados e um período de fertilidade para o desenvolvimento de dons mediúnicos voltados para o aconselhamento e a união.",
                "Atributo diverso": "• Negativo: Indica a quebra de acordos e a falta de reciprocidade em uma relação que parecia promissora, gerando decepção e desequilíbrio emocional. Representa a incapacidade de negociar ou de ouvir o outro, resultando em parcerias que falham por egoísmo ou falta de entrega, onde as promessas são vazias e a comunicação torna-se truncada, fria e desprovida de qualquer afeto ou cooperação.<br>• Obstáculo: Ocorre pelo excesso de complacência ou pela necessidade de agradar a todos a qualquer preço, o que pode levar o consultor a aceitar termos desvantajosos apenas para evitar conflitos. A busca obsessiva por harmonia pode ocultar problemas reais que deveriam ser enfrentados, criando uma paz artificial e frágil que se rompe facilmente diante de qualquer pressão externa mais séria e objetiva.<br>• Orientação/conselho: Aceite as propostas que cruzarem o seu caminho agora, seja honesto em suas palavras e cumpra rigorosamente o que prometeu aos outros. Entregue-se com gentileza às parcerias, abra-se para o perdão se for necessário e compreenda o ponto de vista alheio com afabilidade, entendendo que a união de forças é o meio mais seguro para atingir seus objetivos atuais com sucesso."
            }},
            { name: "Três de Copas", type: "menor", number: "3", imgUrl: `${baseUrl}C03.jpg`, sections: {
                "Núcleo": "• Essência: Festejar, reunir, harmonizar, comemorar.<br>• Definição: Indica um momento de júbilo e celebração por conquistas alcançadas, como formaturas ou promoções, onde a felicidade é consumada e compartilhada em encontros festivos, happy hours e aniversários repletos de prazer.<br>• Advertência: Embora a abundância e a fartura estejam presentes, atente-se para que o clima de festa não encubra traições ou situações em que haja excesso de pessoas envolvidas onde deveria haver privacidade.",
                "Atributo básico": "• Material: Reflete um período de grande êxito profissional e financeiro, onde o progresso resulta em ganhos substanciais e em uma comemoração legítima pelos objetivos atingidos. Negociações fluem com sorte, trazendo um sentimento de fartura e a resolução definitiva de conflitos que anteriormente travavam o avanço material e a estabilidade econômica.<br>• Mental: A mente encontra-se em um estado de total liberdade e despreocupação, focada na receptividade e no bem-estar coletivo. O indivíduo expressa-se com entusiasmo em encontros sociais, buscando o fim de desavenças e celebrando a colheita intelectual através de uma comunicação hospitaleira que favorece a união e a alegria genuína perante todos.<br>• Sentimental: O campo afetivo é marcado por sentimentos de satisfação e triunfo, onde os relacionamentos florescem através de festas e da consumação da felicidade. Há uma fertilidade emocional que pode indicar gravidez ou o sucesso de um vínculo amoroso que superou crises, resultando em êxtase e em uma conexão plena e comemorativa.<br>• Espiritual: Indica um momento de restauração espiritual e abundância de energias positivas, onde a alma celebra a cura e o triunfo sobre as sombras passadas. O consulente sente-se em harmonia com o plano divino, colhendo os frutos de sua dedicação mística com um profundo sentimento de gratidão, felicidade e júbilo inabalável.",
                "Atributo diverso": "• Negativo: Representa a falta de motivos para comemorar ou o isolamento social que impede o compartilhamento da alegria e dos triunfos. Indica projetos que falham em trazer satisfação, encontros que resultam em desconforto ou a incapacidade de relaxar e aproveitar os momentos de lazer, gerando uma sensação de escassez e tristeza profunda.<br>• Obstáculo: Ocorre pelo excesso de busca por prazer e festividades constantes, o que pode levar à negligência de responsabilidades sérias ou à exposição excessiva da intimidade. A euforia desmedida pode atrair terceiros mal-intencionados para dentro da relação ou do ambiente de trabalho, causando confusão, fofocas e perda do foco necessário.<br>• Orientação/conselho: Comemore suas vitórias com entusiasmo e aceite todos os convites para encontros festivos, brindes e celebrações que surgirem no seu caminho. Aceite a felicidade que o destino oferece agora e procure reunir pessoas queridas para compartilhar seus triunfos, entendendo que o regozijo coletivo e a alegria fortalecem seus laços."
            }},
            { name: "Quatro de Copas", type: "menor", number: "4", imgUrl: `${baseUrl}C04.jpg`, sections: {
                "Núcleo": "• Essência: Pausar, entediar, rejeitar, amargar.<br>• Definição: Representa um adiamento temporário imposto por uma ação divina para que o consulente reflita sobre o excesso de euforia anterior. É o momento do tédio, da apatia e do desinteresse por oportunidades que parecem ter perdido o brilho original, tornando-se \"azedas\".<br>• Advertência: Cuidado com o hábito de reclamar de barriga cheia e com a insatisfação que não condiz com a realidade; esse estado de espírito rabugento pode levar ao desperdício de chances valiosas e ao isolamento social por puro ranço ou mau humor.",
                "Atributo básico": "• Material: No âmbito profissional, indica desinteresse e desmotivação, onde o consulente sente que as atividades que antes eram boas agora parecem desbotadas e sem sentido. Boas oportunidades de lucro e crescimento são desperdiçadas por pura apatia ou cansaço, resultando em uma estagnação causada pela falta de circulação de novas ideias e projetos.<br>• Mental: Mentalidade introspectiva e aborrecida, marcada por sentimentos de inveja e ressentimento ao observar a vida alheia nas redes sociais. O indivíduo expressa-se de forma chata, xarope e insuportável, recusando o que os outros falam por teimosia birrenta e por uma percepção distorcida de que o impossível seria o único ideal aceitável.<br>• Sentimental: Reflete o fim da euforia romântica e a instalação do tédio crônico devido ao hiperconvívio e às expectativas irreais construídas pelo próprio consulente. A pessoa sente-se enganada ou traída pelo fato da felicidade não ser infinita, agindo com desânimo e nojo emocional, o que gera uma sensação amarga de desencanto e isolamento afetivo.<br>• Espiritual: Momento de vazio espiritual e desligamento social, onde o ambiente místico encontra-se viciado e com energias densas ou pesadas. Há uma sensação de \"ar envenenado\" que impede a conexão fluida com o sagrado, exigindo uma pausa profunda para que a alma se recupere da \"ressaca\" sensorial e reencontre seu propósito.",
                "Atributo diverso": "• Negativo: Indica o despertar do interesse e a retomada da valorização das bênçãos que já estão presentes na vida do consulente. Representa o fim da fase de mau humor e apatia, onde a pessoa decide finalmente aceitar as taças que lhe são oferecidas, abandonando o vitimismo para abraçar novas soluções e oportunidades de contentamento.<br>• Obstáculo: Ocorre pelo excesso de exigência e pela busca obsessiva por uma perfeição impossível, o que torna a pessoa cega para as alegrias reais do cotidiano. O ranço constante e a mudez emocional criam barreiras intransponíveis na convivência, fazendo com que o indivíduo perca o tempo da ação por estar mergulhado em desgostos imaginários.<br>• Orientação/conselho: Pare imediatamente suas ações impulsivas e dedique tempo para refletir e descansar profundamente sobre suas escolhas atuais. Desconfie de promessas excessivamente brilhantes, duvide das fantasias que você mesmo criou e dê valor ao que você já possui, entendendo que este adiamento é uma oportunidade necessária para você reavaliar seus sentimentos."
            }},
            { name: "Cinco de Copas", type: "menor", number: "5", imgUrl: `${baseUrl}C05.jpg`, sections: {
                "Núcleo": "• Essência: Lamentar, frustrar, perder, ressignificar.<br>• Definição: Representa uma dor real causada pela perda de algo importante que foi negligenciado anteriormente. É o arcano do vitimismo e da melancolia, onde o consulente chora sobre as taças derrubadas, mas ainda possui recursos (taças de pé) que ele se recusa a enxergar devido à agonia.<br>• Advertência: Não se deixe afundar no remorso ou no papel de mal perdedor; embora o prejuízo já exista, o cenário ainda pode ser revertido se você parar de valorizar a dor e começar a tomar atitudes assertivas para reconstruir sua felicidade de forma pragmática.",
                "Atributo básico": "• Material: Fase de fracasso em projetos profissionais onde o consulente sente que \"errou o tempero\" ou negligenciou valores fundamentais para o sucesso. Há um sentimento de amargura por perdas financeiras aparentes ao círculo social, exigindo uma reformatura das estratégias e a busca por orientação técnica para reativar o progresso e reverter o cenário de desapontamento.<br>• Mental: Mentalidade mergulhada no arrependimento e em pensamentos melancólicos que impedem a visão de soluções óbvias que ainda estão ao alcance. O indivíduo expressa-se através de lamentações constantes e falta de amor-próprio, sentindo-se desiludido com seus ideais ilusórios e incapaz de ressignificar suas falhas para construir novos paradigmas intelectuais mais produtivos.<br>• Sentimental: Reflete um relacionamento problemático marcado por expectativas exageradas que levaram à ruína e ao desgosto mútuo. Existe uma tristeza profunda e uma sensação de abandono, onde o consultor se culpa excessivamente pelo fim do vínculo ou pela traição sofrida, exigindo um esforço consciente para olhar o que ainda restou de afeto e respeito.<br>• Espiritual: Momento de agonia mística e desilusão com a fé, onde a alma se sente em luto por propósitos que não se realizaram. Há a necessidade de buscar tratamentos como constelação ou reiki para limpar as energias de tristeza e permitir que a luz volte a entrar, ressignificando o sofrimento como um degrau necessário para a evolução.",
                "Atributo diverso": "• Negativo: Indica o início da superação da dor e a capacidade de olhar para as duas taças que permanecem de pé com esperança e pragmatismo. Representa o momento em que o indivíduo decide parar de chorar pelo que perdeu e começa a transformar seus \"limões em limonada\", buscando formatos de felicidade mais maduros e pé no chão.<br>• Obstáculo: Ocorre quando a valorização da dor se torna uma forma de manipulação para obter consolação e atenção dos outros. O excesso de vitimismo paralisa o consulente em um cenário de luto eterno, impedindo qualquer movimento de cura real e fazendo com que ele insista em erros de comportamento que afastam novas chances de prosperidade.<br>• Orientação/conselho: Afaste-se do cenário de lamentação, reveja seus valores internos e reconsidere suas atitudes diante do fracasso sofrido. Desista de tentar recuperar o que já se quebrou definitivamente e busque a orientação de amigos, advogados ou psicólogos para encontrar um novo caminho, entendendo que ainda há muito o que realizar."
            }},
            { name: "Seis de Copas", type: "menor", number: "6", imgUrl: `${baseUrl}C06.jpg`, sections: {
                "Núcleo": "• Essência: Recordar, conservar, presentear, paralisar.<br>• Definição: Representa o retorno do passado ao presente, trazendo saudades, nostalgia e o desejo de manter modelos antigos de felicidade. É o arcano da solidariedade e da pureza, onde o consulente busca refúgio em memórias boas ou em tradições familiares para confortar sua alma.<br>• Advertência: Cuidado para que a melancolia não se transforme em uma fuga da realidade ou em uma esperança inútil de que o \"ex\" ou os tempos áureos voltem a ser exatamente como eram; o excesso de apego ao que passou pode dificultar a evolução e a aceitação do novo.",
                "Atributo básico": "• Material: No trabalho, indica o desejo de retornar a funções ou métodos anteriores que traziam mais segurança e conforto emocional. O consulente pode receber benefícios do passado, como heranças ou o retorno de antigos contatos profissionais, mas enfrenta uma paralisação por ser reacionário às mudanças tecnológicas ou estruturais, preferindo conservar modelos tradicionais que impedem o progresso inédito.<br>• Mental: Mentalidade marcada pela nostalgia e por convicções conservadoras que priorizam o \"no meu tempo era melhor\". O indivíduo expressa-se com doçura e educação antiga, mas demonstra dificuldade em aceitar o diferente e o novo, agindo com uma intolerância sutil que disfarça sua dor atual através do escapismo em lembranças agradáveis e seguras.<br>• Sentimental: Reflete um sentimento de saudade profunda e a busca por um amor que tenha o frescor e a pureza da infância ou de relacionamentos passados. Existe uma tendência a querer o parceiro atual como ele era antes ou a atrair \"ex-namorados\" de volta para a vida, valorizando o respeito e as boas intenções acima da paixão física ou da safadeza.<br>• Espiritual: Momento de conexão com a ancestralidade e recebimento de orientações através de figuras familiares que já partiram. Há uma proteção espiritual baseada na solidariedade e no acalento da alma, permitindo que o consulente sinta o conforto dos guias que vêm escutá-lo e confortá-lo em sua caminhada, exigindo respeito às regras convencionais e tradicionais da fé.",
                "Atributo diverso": "• Negativo: Indica a libertação do peso do passado e a prontidão para viver experiências inéditas sem compará-las com o que já foi. Representa o fim da melancolia paralisante e o início de uma fase onde o indivíduo decide evoluir, abandonando modelos arcaicos de comportamento para construir uma felicidade baseada nas necessidades reais do seu momento presente e futuro.<br>• Obstáculo: Ocorre pelo excesso de apego a uma realidade que não existe mais, gerando uma paralisia que impede qualquer crescimento real. A pessoa torna-se tão focada em recuperar o passado que negligencia as oportunidades de agora, vivendo em uma bolha de nostalgia que a torna intolerante e incapaz de se adaptar às transformações necessárias da vida social.<br>• Orientação/conselho: Chore se for necessário para encerrar o seu luto, mas procure solucionar todas as pendências que ainda o prendem ao passado. Siga as recomendações dos mais velhos, acolha quem precisa de solidariedade, seja obediente às regras convencionais e conserve o que há de bom em suas raízes, entendendo que a tradição pode ser um porto seguro."
            }},
            { name: "Sete de Copas", type: "menor", number: "7", imgUrl: `${baseUrl}C07.jpg`, sections: {
                "Núcleo": "• Essência: Fantasiar, iludir, prometer, viciar.<br>• Definição: Representa um estado de deslumbramento e euforia exagerada que distorce a realidade, levando o consulente a ver o mundo através de filtros coloridos e enganosos. É o arcano das falsas promessas, da mentira por autoconvencimento e da busca por escapes através de vícios ou fantasias irreais.<br>• Advertência: Acorde para a realidade antes que o seu otimismo cego o leve a prejuízos graves ou à perda de noção dos perigos da vida; a hiperpotência e o narcisismo de acreditar que \"tudo já está ganho\" impedem que você veja as armadilhas que estão bem na sua frente.",
                "Atributo básico": "• Material: Fase de negócios enganosos e objetivos ilusórios, onde o consultor se empolga com conquistas do passado que não sustentam mais sua posição atual. Há um risco de tomar decisões financeiras baseadas em mentiras ou em um otimismo incorrigível, agindo com irresponsabilidade por acreditar que sua importância é maior do que a realidade, resultando em promessas profissionais que jamais serão cumpridas.<br>• Mental: Mentalidade sedada em ideias utópicas e narcisistas, marcada por uma futilidade que impede a percepção dos limites reais. O indivíduo expressa-se com arrogância e soberba, mentindo para si mesmo e para os outros sob o efeito de um \"êxtase\" intelectual que o afasta da lógica, buscando fugir do real através de devaneios ou do negacionismo absoluto dos fatos.<br>• Sentimental: Reflete um relacionamento pautado pela ilusão e pelo encantamento superficial, onde as promessas de amor eterno são feitas na euforia do momento e raramente se concretizam. Pode indicar traição por falta de noção de limites ou uma busca incessante por um parceiro idealizado que não existe, resultando em uma paixão imatura, efêmera e frequentemente baseada em mentiras.<br>• Espiritual: Momento de perigo místico, onde o consultor busca a fé apenas para fugir das responsabilidades do mundo concreto. Pode envolver alucinações, viagens astrais sem proteção ou o uso de substâncias que causam miragens espirituais, exigindo cuidado extremo para não se perder em obsessões por si mesmo ou em crenças vazias que não trazem evolução real à alma.",
                "Atributo diverso": "• Negativo: Indica a queda das máscaras e o despertar doloroso, porém necessário, para a verdade crua da situação. Representa o momento em que a pessoa decide abandonar os vícios e as fantasias para encarar a realidade com sobriedade, permitindo que a honestidade consigo mesma dissipe as ilusões e abra caminho para construções de vida muito mais sólidas, dignas e verdadeiras.<br>• Obstáculo: Ocorre pelo excesso de deslumbramento e pela necessidade constante de estar \"nas nuvens\", o que impede qualquer realização prática. O indivíduo torna-se tão viciado em euforia e em contar vantagem que perde a credibilidade social, ficando preso em um círculo de mentiras e utopias que o isolam em um mundo fictício e impedem seu amadurecimento como ser humano.<br>• Orientação/conselho: Divirta-se e anime-se com as possibilidades que a vida oferece, mas não perca o seu foco na realidade concreta. Seja ambicioso e confie em seu potencial, vibre com o entusiasmo de novos projetos e não se contente com pouco, entendendo que a esperança é positiva desde que você mantenha seus pés devidamente firmados no chão."
            }},
            { name: "Oito de Copas", type: "menor", number: "8", imgUrl: `${baseUrl}C08.jpg`, sections: {
                "Núcleo": "• Essência: Abandonar, desistir, fracassar, reformular.<br>• Definição: Representa o momento em que o consulente reconhece o erro de suas escolhas anteriores e decide, com pesar, abandonar um cenário ou comportamento. É a despedida forçada de sonhos que se provaram infrutíferos, exigindo um mergulho na realidade amarga para que uma transformação real aconteça.<br>• Advertência: Cuidado com a depressão profunda e o sentimento de culpa que podem paralisar sua vida; embora partir seja necessário para sua evolução, não se deixe consumir pelo vitimismo ou pelo desleixo com sua saúde e responsabilidades básicas enquanto atravessa esse período de desolação e perdas inevitáveis.",
                "Atributo básico": "• Material: Fase de fracasso profissional e demissão forçada, muitas vezes causada pelo próprio abandono do compromisso e desleixo com as tarefas. O consultor enfrenta prejuízos financeiras por ter apostado no erro e agora é empurrado a ir embora com um sentimento de derrota, exigindo que ele pare de fugir das responsabilidades e aceite a realidade amarga para tentar reconstruir sua carreira do zero.<br>• Mental: Mentalidade dominada pelo remorso e pela sensação de ter sido \"pego\" em suas próprias mentiras ou ilusões passadas. O indivíduo expressa-se com mágoa e desespero, enfrentando um gasto mental exaustivo para processar o arrependimento, o que pode gerar crises de depressão e uma visão fatalista do futuro, exigindo uma resignificação profunda de suas convicções morais e de seus atos intelectuais.<br>• Sentimental: Reflete a expulsão de um relacionamento ou o abandono unilateral de um vínculo que se tornou insuportável e tóxico. Há uma dor imensa e uma despedida marcada pelo pesar, onde a pessoa reconhece que o que queria não lhe fazia bem e decide parar de trair a si mesma ou ao outro, enfrentando um divórcio doloroso e o luto pelas promessas descumpridas.<br>• Espiritual: Indica uma crise espiritual severa onde o consultor se sente abandonado pelos seus guias devido ao seu próprio desleixo místico. Há um risco de desequilíbrio profundo que exige atenção psiquiátrica e supervisão constante, pois a alma encontra-se em um estado de \"fim de linha\" que necessita de um novo rumo ético e do abandono de práticas ilusórias e perigosas.",
                "Atributo diverso": "• Negativo: Indica a possibilidade de uma transição menos dolorosa através do reconhecimento precoce de que o caminho atual é equivocado. Representa o momento em que o consultor decide \"jogar limpo\" consigo mesmo e com os outros antes do colapso total, permitindo uma reformulação de vida baseada na honestidade, o que diminui o impacto do fracasso e abre portas para uma evolução consciente.<br>• Obstáculo: Ocorre pelo excesso de vitimismo e pela fixação na dor do abandono, o que impede a pessoa de seguir em frente com dignidade. O indivíduo pode usar seu sofrimento como desculpa para negligenciar tratamentos de saúde ou para não pagar dívidas, ficando preso em um ciclo de desolação e \"mimimi\" que afasta qualquer chance de auxílio real ou de superação definitiva da crise.<br>• Orientação/conselho: Desista imediatamente de insistir no erro, aceite a separação ou a demissão como fatos consumados e busque outro caminho para sua vida. Renuncie ao que já morreu em seu coração, jogue limpo em todas as suas negociações e entenda que ir embora deste cenário é a única forma de você se reencontrar com a sua própria verdade e paz interior."
            }},
            { name: "Nove de Copas", type: "menor", number: "9", imgUrl: `${baseUrl}C09.jpg`, sections: {
                "Núcleo": "• Essência: Conciliar, desfrutar, acordar, prosperar.<br>• Definição: Representa a realização dos sonhos e a retomada de um cenário satisfatório após um período de erros e aprendizados. É o arcano da \"bebedeira\" de felicidade, onde o consulente se sente grato, honesto e disposto a se comprometer verdadeiramente com sua nova vida e com o bem-estar coletivo.<br>• Advertência: Não se perca no excesso de comemorações e na satisfação pessoal a ponto de esquecer a manutenção dos seus novos compromissos; a felicidade duradoura exige que você continue agindo com a mesma franqueza e fidelidade que permitiram a conquista deste momento de glória e plenitude atual.",
                "Atributo básico": "• Material: Fase de sucesso e prosperidade onde o consultor colhe os frutos de sua disposição em negociar e se comprometer seriamente com o trabalho. Há uma melhora significativa nas finanças que permite desfrutar de prazeres como jantares e viagens, atraindo novos acordos lucrativos e o reconhecimento profissional por sua honestidade e pela coragem de ter assumido e corrigido erros do passado.<br>• Mental: Mentalidade otimista, franca e voltada para a conciliação das ideias, buscando sempre a transparência em suas comunicações. O indivíduo expressa-se com alegria e abertura para ouvir os outros, sentindo-se mentalmente revigorado e focado em manter um cenário intelectual harmônico que favoreça o desenvolvimento de seus projetos mais queridos e a realização de seus ideais elevados.<br>• Sentimental: Reflete um relacionamento marcado pela comilança, festas e por uma profunda satisfação mútua, onde o casal decide superar problemas passados através de pedidos de desculpas sinceros. Existe um clima de \"lua de mel\" constante, com fidelidade e honestidade, onde o amor é celebrado abertamente em banquetes e reuniões familiares, trazendo uma sensação de que o sonho afetivo finalmente tornou-se possível.<br>• Espiritual: Momento de regozijo espiritual e gratidão, onde o consultor se sente em paz com o divino e com sua própria consciência. É uma fase de colheita mística positiva, onde a alma se abre para doar e receber luz de forma generosa, vivenciando uma plenitude que fortalece a fé e atrai bênçãos constantes através da prática da bondade e da honestidade absoluta em seus rituais.",
                "Atributo diverso": "• Negativo: Indica uma felicidade superficial que esconde uma falta de compromisso real com a manutenção do bem-estar alcançado. Representa o risco de se tornar complacente ou preguiçoso após a conquista do objetivo, permitindo que a desonestidade ou a falta de transparência voltem a manchar a trajetória, resultando em uma satisfação efêmera que pode desmoronar se não houver raízes éticas profundas e constantes.<br>• Obstáculo: Ocorre pelo excesso de busca por prazer sensorial e exibicionismo da própria felicidade, o que pode gerar inveja ou o esquecimento das obrigações práticas. A pessoa pode se tornar \"viciada\" em celebrações e em ser o centro das atenções, agindo com uma autoconfiança exagerada que beira a imprudência, negligenciando os detalhes que garantem a continuidade da sua prosperidade material e afetiva.<br>• Orientação/conselho: Divirta-se intensamente, seja franco em todas as suas relações e mantenha a fidelidade aos seus valores e às pessoas que ama. Abra seu coração com honestidade, aceite as bênçãos que estão chegando, doe-se com generosidade e não tenha medo de se expor, entendendo que este é o momento de colher as recompensas por sua integridade e dedicação."
            }},
            { name: "Dez de Copas", type: "menor", number: "10", imgUrl: `${baseUrl}C10.jpg`, sections: {
                "Núcleo": "• Essência: Unir, plenificar, fantasiar, harmonizar.<br>• Definição: Representa o apogeu da felicidade afetiva e a consolidação de vínculos sinceros em um ambiente de harmonia doméstica. É a carta da família de alma e da saciedade emocional, onde o consulente vive uma euforia que, embora por vezes fantasiosa, traz uma profunda sensação de segurança, paz e honra.<br>• Advertência: Cuidado para não viver em uma \"paz ilusória\" ou em um conto de fadas desconectado da realidade; a euforia excessiva pode distorcer sua visão sobre os problemas concretos que ainda precisam de atenção, sendo necessário aterrar seus sentimentos para que a união se mantenha digna e sustentável a longo prazo.",
                "Atributo básico": "• Material: No âmbito profissional, indica o sucesso conquistado através de parcerias harmoniosas e de um ambiente de trabalho que funciona como uma família. Há uma estabilidade financeira que permite comemorar grandes etapas concluídas com festas e glória, resultando em uma reputação sólida e na percepção de que o consultor é uma figura honrada e bem-sucedida em todos os seus empreendimentos materiais.<br>• Mental: Mentalidade de plenitude e gratidão, focada na construção de laços sinceros e na manutenção da harmonia social. O indivíduo expressa-se com euforia e doçura, embora possa tender a uma visão idealizada das situações, agindo com uma sinceridade que busca sempre o apaziguamento de conflitos e a valorização das conquistas intelectuais coletivas, sentindo-se perfeitamente seguro e amparado por suas convicções.<br>• Sentimental: Reflete a realização máxima no amor, com casamentos felizes, amizades profundas e vínculos afetivos que são considerados sagrados como os de uma família. Existe uma saciedade emocional e uma união digna marcada pela fidelidade e pelo compartilhamento constante de alegrias, trazendo uma sensação de \"felizes para sempre\" que nutre o coração e fortalece o pertencimento social do casal.<br>• Espiritual: Momento de profunda paz interior e conexão com a linhagem espiritual de amor e proteção. Há um sentimento de plenitude mística onde a alma se sente em festa e comemoração constante, irradiando luz e harmonia para todo o seu entorno, permitindo que o consulente viva sua fé de maneira expansiva, sincera e repleta de bênçãos que confirmam sua trajetória de luz.",
                "Atributo diverso": "• Negativo: Indica uma desarmonia familiar disfarçada por aparências de felicidade ou a perda de um vínculo importante por excesso de fantasias. Representa uma fase em que a paz é apenas superficial e as ilusões sobre o parceiro ou os sócios começam a ruir, revelando que a união não possuía a base de sinceridade necessária para sustentar o peso da realidade cotidiana.<br>• Obstáculo: Ocorre pelo excesso de otimismo fantasioso que impede a percepção de perigos reais ou de comportamentos abusivos disfarçados de \"amor\". A pessoa pode se recusar a ver a verdade de uma situação catastrófica por estar viciada no sentimento de bem-estar ilusório, agindo com uma ingenuidade perigosa que a torna vulnerável a decepções profundas quando o \"conto de fadas\" finalmente se quebrar.<br>• Orientação/conselho: Conquiste o seu espaço com amor, vincule-se profundamente às pessoas que lhe trazem bem-estar e comemore cada momento de felicidade com gratidão. Vença seus medos através da união, agradeça pelas bênçãos recebidas e seja sempre recíproco com os afetos que lhe são ofertados, entendendo que a harmonia compartilhada é o seu maior tesouro e sua maior proteção agora."
            }},
            { name: "Pajem de Copas", type: "menor", number: "Pajem", imgUrl: `${baseUrl}CC1P.jpg`, sections: {
                "Núcleo": "• Essência: Seduzir, convidar, harmonizar, fantasiar.<br>• Definição: Representa o início de algo fofo, gentil e desprovido de malícias, marcado pelo frescor do amor e pela criatividade artística. É o portador de boas notícias e convites sociais que buscam a reconciliação e a harmonia, agindo com uma ingenuidade romântica e uma proatividade generosa que motiva e encoraja todos ao redor.<br>• Advertência: Cuidado com a imaturidade emocional e com a tendência ao vitimismo (\"piá de prédio\"); embora suas propostas sejam verdadeiras e bem-intencionadas, a falta de robustez e a expectativa de um mundo de \"Disney\" podem torná-lo enjoado ou dependente de aprovação constante, dificultando a concretização prática de seus desejos.",
                "Atributo básico": "• Material: Fase de novas oportunidades profissionais que surgem através de convites em eventos sociais ou encontros informais com amigos e sócios. Há uma proatividade em solucionar problemas e um entusiasmo criativo para iniciar projetos artísticos ou filantrópicos, resultando em parcerias que trazem bem-estar e harmonia, embora exijam mais maturidade e foco material para que os resultados sejam sustentáveis e duradouros no mercado.<br>• Mental: Mentalidade aberta, entusiasmada e voltada para a conciliação de ideias, buscando sempre elevar o ego alheio e motivar as pessoas. O indivíduo expressa-se com doçura e espontaneidade, agindo de forma compreensiva e altruísta ao planejar seus propósitos, sentindo-se criativamente estimulado pela beleza e pelo frescor das novas descobertas intelectuais, embora possa fantasiar demais as situações reais do cotidiano.<br>• Sentimental: No campo afetivo, reflete um relacionamento marcado pelo xaveco meloso, pela fofura e por declarações de amor românticas e sinceras. Existe uma lealdade profunda e um desapego de mágoas passadas, onde o parceiro tenta agradar e acolher com gentileza, buscando compromissos afetivos (como namoro ou ficantes sérios) que tragam felicidade e a sensação de estar vivendo um conto de fadas apaixonado e puro.<br>• Espiritual: Momento de restauração mística e renovação da fé através da compaixão e da sensibilidade aguçada. A alma se sente receptiva a bênçãos e aberta para ajudar os outros com empatia e pureza de intenções, vivenciando rituais que trazem paz e cura interior, permitindo que a luz divina flua sem as sombras do passado e com a alegria de um novo nascimento espiritual restaurador.",
                "Atributo diverso": "• Negativo: Indica a falta de notícias ou a recusa de convites importantes por puro mau humor ou por uma timidez paralisante e enjoada. Representa uma fase de fechamento emocional onde a pessoa se torna mimada e dependente, impedindo que a harmonia retorne e resultando em propostas imaturas que não se sustentam por falta de vontade real e de compromisso com a própria felicidade.<br>• Obstáculo: Ocorre pelo excesso de carência e pela necessidade obsessiva de ser bem quisto socialmente a qualquer preço, o que leva à perda de autenticidade. A pessoa pode se perder em fantasias irreais sobre o mundo e tornar-se \"enjoada\" ou excessivamente fofa para fugir das responsabilidades práticas, agindo com uma ingenuidade que a torna vulnerável a decepções profundas quando a realidade não atende suas expectativas infantis.<br>• Orientação/conselho: Seja leal aos seus sentimentos, aja com generosidade e boa vontade em suas relações e mostre-se disposto a aceitar os convites que surgirem. Utilize sua criatividade para harmonizar o ambiente, seja gentil e afável com todos, entregue-se aos novos projetos com entusiasmo e entenda que o frescor de suas intenções e a sua resiliência serão as chaves para conquistar a paz que você busca agora."

            { name: "Cavaleiro de Copas", type: "menor", number: "Cavaleiro", imgUrl: `${baseUrl}CC2K.jpg`, sections: {
                "Núcleo": "• Essência: Paquerar, romantizar, idealizar, encantar.<br>• Definição: Representa o \"príncipe encantado\" carismático e afetuoso que vive em busca de desafios emocionais e de novas paixões idealizadas. É o mestre do xaveco e da elegância social que, embora bem-humorado e compreensivo, possui uma visão ingênua de suas próprias capacidades, perdendo o interesse rápido assim que conquista o objeto de seu desejo passageiro.<br>• Advertência: Cuidado com a futilidade e com as mentiras resultantes da sua empolgação e desconhecimento dos próprios limites; embora você encante a todos com sua vistosa presença, a falta de sustentabilidade em suas promessas e o abandono precoce de projetos podem gerar uma trilha de decepções e fracassos financeiros e afetivos irreparáveis.",
                "Atributo básico": "• Material: No trabalho, indica um profissional empolgado e vistoso que romantiza todos os seus projetos como se fossem os melhores do mundo, mas que raramente os leva até o fim. Há um risco de fracasso financeiro com prejuízos, pois o consultor faz propostas fora do seu alcance de realização e gasta energia em negociações melosas que não se sustentam na prática por falta de foco e de continuidade real nas tarefas árduas.<br>• Mental: Mentalidade idealista, criativa e sedada por ilusões que o tiram da percepção da realidade concreta e dos seus limites. O indivíduo expressa-se com elegância e cordialidade, mas de forma fútil e distorcida, agindo com uma empolgação momentânea que o leva a acreditar nas próprias irrealidades que diz, sentindo-se intelectualmente superior por sua capacidade de encantar cenários, embora não possua o estofo necessário para manter o progresso.<br>• Sentimental: No campo afetivo, reflete a busca incessante pelo romance perfeito, com xavecos carismáticos, músicas e declarações apaixonadas constantes. Existe uma magnetismo pessoal fortíssimo, onde o parceiro conquista a todos apenas para satisfazer sua necessidade de ser bem-quisto, resultando em paixonites intensas e \"luas de mel\" maravilhosas que acabam subitamente assim que o desafio da conquista termina e o cotidiano real se instala.<br>• Espiritual: Momento de encantamento místico superficial onde o consulente busca a fé apenas pelo prazer sensorial ou pelo status de ser alguém iluminado. Há um risco de se perder em práticas espirituais sem bases sólidas, movido apenas pela empolgação do momento ou pela busca de um magnetismo pessoal que não gera evolução real, exigindo cuidado com promessas espirituais imaturas que não trazem cura ou proteção duradouras.",
                "Atributo diverso": "• Negativo: Indica o fim súbito do interesse e o abandono de compromissos importantes por pura futilidade ou por uma nova alternativa mais excitante. Representa a mentira intencional ou não que destrói a confiança alheia, resultando em um isolamento melancólico onde a pessoa percebe que suas promessas eram vazias e que sua busca por prazer efêmero a deixou sem bases sólidas na vida material e amorosa.<br>• Obstáculo: Ocorre pelo excesso de exibicionismo e pela necessidade constante de publicar conquistas imaginárias nas redes sociais para obter aplausos vazios. A pessoa torna-se um \"amigo que não se pode contar\", pois sua falta de compromisso e sua visão Disney do mundo a impedem de encarar as dificuldades reais, transformando sua gentileza em uma ferramenta de manipulação superficial que irrita e afasta quem busca seriedade.<br>• Orientação/conselho: Seja gentil, sedutor e utilize sua criatividade para encantar as pessoas ao seu redor neste momento específico. Mergulhe em atividades que lhe tragam prazer imediato, acolha as boas notícias com otimismo, jogue-se nas novas experiências sem medo e entenda que a diplomacia e o bom humor serão suas melhores armas para abrir portas e suavizar os conflitos que cruzarem o seu caminho."

            { name: "Rainha de Copas", type: "menor", number: "Rainha", imgUrl: `${baseUrl}CC3Q.jpg`, sections: {
                "Núcleo": "• Essência: Acolher, intuir, calar, proteger.<br>• Definição: Representa a autoridade feminina passiva, politicamente correta e extremamente empática que esconde seus profundos sentimentos sob uma taça fechada. É a médium compreensiva e altruísta que romantiza a vida, agindo como uma protetora disponível para os outros, mas que hesita em declarar sua própria posição ou desejos por timidez ou medo da rejeição.<br>• Advertência: Cuidado com o excesso de \"frescura\" e com a incapacidade de decidir o que realmente quer; embora sua bondade e intuição sejam valiosas para curar os outros, o hábito de sufocar seus próprios anseios e de viver em um mundo de fantasias pode paralisar sua vida e deixá-la em um estado de indecisão eterna e insatisfação silenciosa.",
                "Atributo básico": "• Material: No âmbito profissional, atua como uma conselheira disponível e prestativa (psicóloga, médica ou advogada) que se dedica a solucionar os problemas alheios com compaixão. Há uma fertilidade para projetos criativos e artísticos, embora a realização material dependa de uma condição muito propícia e de um esforço para parar de fazer \"joguinhos\" e começar a agir com firmeza e autonomia para conquistar seus próprios espaços financeiros.<br>• Mental: Mentalidade intuitiva, imaginativa e voltada para a compreensão dos mistérios da alma e das emoções humanas. A expressão é fofa, educada e politicamente correta, revelando uma inteligência emocional que busca sempre a adequação social, agindo com um silêncio prudente que esconde seus verdadeiros pensamentos, sentindo-se mentalmente segura ao acolher a dor do outro, mas perdida ao tentar definir sua própria trajetória intelectual.<br>• Sentimental: No campo afetivo, reflete uma postura reservada e acolhedora, marcada por uma expectativa \"Disney\" do amor e por uma timidez que impede declarações abertas de afeto. Existe uma empatia profunda e uma disposição para perdoar, embora a parceira esconda seus desejos e mantenha o coração fechado, resultando em relacionamentos que raramente evoluem para algo concreto se não houver um esforço para ser menos passiva e mais declarada.<br>• Espiritual: Momento de profunda conexão mediúnica e sensibilidade espiritual voltada para o serviço altruísta e para a cura do próximo. A alma atua como um canal de luz que acalenta e protege, vivenciando uma fé romântica e plena que atrai orientações divinas sutis, permitindo que o consulente utilize sua intuição para harmonizar o ambiente espiritual e para transmutar energias negativas em compaixão e paz interior.",
